name: Oracle Identity & Settlement Evidence Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/oracle_selected50_footystats_identity_resolver.py"
      - "tests/test_oracle_selected50_footystats_identity_resolver.py"
      - "scripts/diagnose_selected50_feature_blockers.py"
      - "tests/test_selected50_feature_blocker_diagnostics.py"
      - ".github/workflows/oracle-selected50-research-runtime.yml"
      - "scripts/audit_selected50_snapshot_runtime_coverage.py"
      - "tests/test_selected50_snapshot_runtime_coverage.py"
      - "scripts/oracle_selected50_footystats_adapter.py"
      - "tests/test_oracle_selected50_footystats_adapter.py"
      - "scripts/validate_identity_settlement_evidence_register.py"
      - "tests/test_oracle_identity_settlement_evidence_register.py"
      - "data/oracle-identity-settlement-evidence-register-2026-10-28.csv"
      - ".github/workflows/oracle_identity_resolver_tests.yml"
  push:
    branches:
      - "research/oracle-50-league-readiness-audit"
    paths:
      - "scripts/oracle_selected50_footystats_identity_resolver.py"
      - "tests/test_oracle_selected50_footystats_identity_resolver.py"
      - "scripts/oracle_selected50_footystats_adapter.py"
      - "tests/test_oracle_selected50_footystats_adapter.py"
      - "scripts/validate_identity_settlement_evidence_register.py"
      - "tests/test_oracle_identity_settlement_evidence_register.py"
      - "data/oracle-identity-settlement-evidence-register-2026-10-28.csv"
      - ".github/workflows/oracle_identity_resolver_tests.yml"

permissions:
  contents: read

jobs:
  identity-settlement-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research identity and settlement tools
        run: python -m py_compile scripts/oracle_selected50_footystats_identity_resolver.py scripts/oracle_selected50_footystats_adapter.py scripts/validate_identity_settlement_evidence_register.py scripts/diagnose_selected50_feature_blockers.py scripts/audit_selected50_snapshot_runtime_coverage.py
      - name: Validate fixture-level identity and settlement evidence
        run: python scripts/validate_identity_settlement_evidence_register.py --input data/oracle-identity-settlement-evidence-register-2026-10-28.csv --output identity_settlement_evidence_summary.json
      - name: Run identity and settlement evidence regression tests
        run: python -m unittest discover -s tests -p 'test_oracle_identity_settlement_evidence_register.py' -v
      - name: Run FootyStats identity resolver unit tests
        run: python -m unittest discover -s tests -p 'test_oracle_selected50_footystats_identity_resolver.py' -v
      - name: Run FootyStats adapter unit tests
        run: python -m unittest discover -s tests -p 'test_oracle_selected50_footystats_adapter.py' -v
      - name: Run Selected-50 feature blocker diagnostics tests
        run: python -m unittest discover -s tests -p 'test_selected50_feature_blocker_diagnostics.py' -v
      - name: Run Selected-50 snapshot/runtime coverage tests
        run: python -m unittest discover -s tests -p 'test_selected50_snapshot_runtime_coverage.py' -v
      - name: Upload sanitized identity and settlement evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-identity-settlement-evidence-${{ github.run_id }}
          path: |
            identity_settlement_evidence_summary.json
            data/oracle-identity-settlement-evidence-register-2026-10-28.csv
            reports/oracle-selected50-identity-settlement-evidence-followup-2026-10-28.md
            reports/oracle-selected50-feature-blocker-diagnostic-2026-10-28-1523-sast.md
          if-no-files-found: error
          retention-days: 14
