name: Oracle Public V1.6 Integration Readiness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oracle-public-v1-6-integration-readiness.yml"

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit public evidence and V1.6 integration readiness
        shell: bash
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path(".")
          out=root/"recovery/fixtures/current/intelligence"; out.mkdir(parents=True,exist_ok=True)
          checks={}
          checks["fixture_reconciliation"]= (root/"recovery/fixtures/current/governed_fixture_reconciliation.csv").exists()
          checks["footystats_summary"]= (out/"footystats_current_fixture_intelligence_summary.json").exists()
          checks["recent_form_artifact_expected"]=True
          checks["h2h_artifact_expected"]=True

          # Public-only V1.6 certification requires the production prediction engine itself to be present
          # in this repository. Readiness must not confuse adapter/audit tooling or recovered ledgers with
          # a live production engine. No private repository is consulted here.
          public_engine_candidates=[
            root/"scripts/oracle_four_model_live_predict.py",
            root/"scripts/oracle_all_markets_walk_forward_v1.py",
            root/"scripts/oracle_btts_cohort_gate_v1.py"
          ]
          checks["public_v1_6_engine_present"]=any(p.is_file() and p.stat().st_size for p in public_engine_candidates)

          fixtures=list(csv.DictReader((root/"recovery/fixtures/current/governed_fixture_reconciliation.csv").open(encoding="utf-8",newline=""))) if checks["fixture_reconciliation"] else []
          exact=sum(1 for r in fixtures if r.get("identity_status")=="MATCHED_EXACT_DATE_HOME_AWAY")
          checks["fixture_identity_100pct"]=bool(fixtures) and exact==len(fixtures)

          candidates=[
            root/"research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv",
            root/"recovery/master_omi_source/2026-11-14/omi_ledger.csv"
          ]
          ledger=next((p for p in candidates if p.exists() and p.stat().st_size),None)
          checks["v1_6_ledger_source"]=ledger is not None
          checks["v1_6_ledger_is_recovered_snapshot"]=ledger is not None and ledger.as_posix().startswith("recovery/master_omi_source/")
          checks["v1_6_ledger_current_date_window"]=False
          checks["v1_6_ledger_strict_pre_match_provenance"]=False
          if ledger is not None:
              try:
                  rows=list(csv.DictReader(ledger.open(encoding="utf-8",newline="")))
                  dates={str(r.get("date",""))[:10] for r in rows if str(r.get("date","")).strip()}
                  # A recovered 2026-11-14 snapshot is not a current production ledger merely because it exists.
                  checks["v1_6_ledger_current_date_window"]=(
                      bool(rows)
                      and min(dates) >= "2026-11-13"
                      and max(dates) <= "2026-11-24"
                      and not checks["v1_6_ledger_is_recovered_snapshot"]
                  )
                  # Production certification requires explicit provenance fields and a non-empty prediction timestamp.
                  required={"prediction_timestamp","data_cutoff_date","feature_snapshot_id","source_manifest_hash","model_code_sha","calibration_id"}
                  checks["v1_6_ledger_strict_pre_match_provenance"]=(
                      bool(rows) and required.issubset(set(rows[0].keys()))
                      and all(str(r.get("prediction_timestamp","")).strip() for r in rows)
                      and all(str(r.get("data_cutoff_date","")).strip() for r in rows)
                  )
              except Exception:
                  pass

          checks["production_evidence_admissible"]=(
              checks["v1_6_ledger_source"]
              and not checks["v1_6_ledger_is_recovered_snapshot"]
              and checks["v1_6_ledger_current_date_window"]
              and checks["v1_6_ledger_strict_pre_match_provenance"]
              and checks["fixture_identity_100pct"]
              and checks["public_v1_6_engine_present"]
          )
          checks["production_logic_modified"]=False
          checks["master_omi_a_et_modified"]=False

          status="READY_FOR_INTEGRATION" if (
              checks["fixture_reconciliation"]
              and checks["footystats_summary"]
              and checks["production_evidence_admissible"]
          ) else "BLOCKED_MISSING_OR_INADMISSIBLE_PUBLIC_EVIDENCE"

          report={
              "generated_utc":datetime.now(timezone.utc).isoformat(),
              "status":status,
              "checks":checks,
              "exact_fixture_rows":exact,
              "governed_fixture_rows":len(fixtures),
              "governance":"Readiness audit only. Recovered snapshots are not production evidence. No Oracle V1.6 probabilities, thresholds, calibration or eligibility changed. No Master OMI A:ET changes.",
              "next_gate":"Require a public V1.6 production engine, then a fresh current-date production ledger generated by that engine with strict pre-match provenance and 100% exact fixture identity; otherwise remain fail-closed.",
              "blocker_detail":("PUBLIC_V1_6_PRODUCTION_ENGINE_MISSING" if not checks["public_v1_6_engine_present"] else ("V1_6_CURRENT_PRODUCTION_LEDGER_MISSING_OR_INADMISSIBLE" if not checks["production_evidence_admissible"] else ""))
          }
          (out/"v1_6_integration_readiness.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: oracle-public-v1-6-readiness-${{ github.run_id }}
          path: recovery/fixtures/current/intelligence/v1_6_integration_readiness.json
          if-no-files-found: error
