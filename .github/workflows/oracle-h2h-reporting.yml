name: Oracle H2H Reporting

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Upcoming fixture window"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "7", "15"]
  schedule:
    - cron: "30 5 * * 6,2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-h2h-reporting.yml"
      - "scripts/build_h2h_report.py"

permissions:
  contents: read

concurrency:
  group: oracle-h2h-reporting
  cancel-in-progress: true

jobs:
  h2h-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout public runner tooling
        uses: actions/checkout@v4

      - name: Clone governed private Oracle source (read-only)
        env:
          ORACLE_PRIVATE_READ_TOKEN: ${{ secrets.ORACLE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_PRIVATE_READ_TOKEN}" ]; then
            echo "ERROR: ORACLE_PRIVATE_READ_TOKEN secret is missing."
            exit 1
          fi
          git clone --depth 1 --filter=blob:none --sparse --branch fix/epl-btts-team-state-aliases \
            "https://x-access-token:${ORACLE_PRIVATE_READ_TOKEN}@github.com/dtnzv5by8c-ship-it/oracle-football-data.git" oracle
          cd oracle
          git sparse-checkout set --no-cone database/matches.csv database/one_up_truth.csv scripts/ingest_upcoming_fixtures.py scripts/restore_historical_match_spine.py config/data_config.json
          cd ..
          echo "Source commit: $(git -C oracle rev-parse HEAD)"
          cp scripts/build_h2h_report.py oracle/scripts/build_h2h_report.py

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests beautifulsoup4

      - name: Refresh upcoming fixtures in isolated checkout
        working-directory: oracle
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          DAYS_AHEAD="${{ inputs.days_ahead || '3' }}"
          python scripts/ingest_upcoming_fixtures.py "$DAYS_AHEAD" data/fixtures/oracle_upcoming_fixtures.csv
          test -s data/fixtures/oracle_upcoming_fixtures.csv
          python - <<'PY'
          import csv
          from datetime import date, timedelta
          p='data/fixtures/oracle_upcoming_fixtures.csv'
          with open(p, newline='', encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          if not rows: raise SystemExit('Fixture refresh returned zero fixtures; refusing to publish an empty report.')
          dates=[(r.get('date') or '')[:10] for r in rows]
          print(f'Fixture rows={len(rows)}; date range={min(d for d in dates if d)} to {max(d for d in dates if d)}')
          PY

      - name: Extend and validate H2H historical archive
        working-directory: oracle
        env:
          H2H_HISTORY_START: "2023-07-01"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/restore_historical_match_spine.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace("import argparse,csv,hashlib,json,re,time,urllib.parse,urllib.request",
                      "import argparse,csv,hashlib,json,re,time,urllib.parse,urllib.request,os")
          s=s.replace('START="2025-03-20"; END="2026-09-20"',
                      'START=os.getenv("H2H_HISTORY_START","2023-07-01"); END=datetime.now(timezone.utc).date().isoformat()')
          s=s.replace('for season in ("2024/2025","2025/2026","2026/2027"):',
                      'for season in ("2023/2024","2024/2025","2025/2026","2026/2027"):')
          p.write_text(s,encoding="utf-8")
          PY
          python scripts/restore_historical_match_spine.py \
            --output data/fixtures/h2h_history_extension.csv \
            --manifest data/fixtures/h2h_history_extension_manifest.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from datetime import date
          root=Path(".")
          base=root/"database/matches.csv"
          ext=root/"data/fixtures/h2h_history_extension.csv"
          audit_path=root/"data/fixtures/h2h_history_merge_audit.json"
          with base.open(newline="",encoding="utf-8-sig") as f: old=list(csv.DictReader(f))
          with ext.open(newline="",encoding="utf-8-sig") as f: new=list(csv.DictReader(f))
          if not old: raise SystemExit("Existing governed match archive is empty; refusing to replace it.")
          fields=list(old[0].keys())
          required={"date","league_code","home_team","away_team","home_goals","away_goals"}
          if not required.issubset(fields) or not required.issubset(new[0].keys()):
              raise SystemExit("Historical archive schema mismatch; no merge performed.")
          today=date.today().isoformat()
          seen=set()
          for r in old:
              seen.add((r["date"][:10],r["league_code"],r["home_team"].strip().casefold(),r["away_team"].strip().casefold()))
          valid=[]; rejected=[]
          for r in new:
              try:
                  d=date.fromisoformat(r["date"][:10]); hg=int(float(r["home_goals"])); ag=int(float(r["away_goals"]))
                  if d.isoformat()>today or hg<0 or ag<0: raise ValueError("future date or invalid score")
              except Exception as e:
                  rejected.append({"date":r.get("date"),"league_code":r.get("league_code"),"home_team":r.get("home_team"),"away_team":r.get("away_team"),"reason":str(e)})
                  continue
              key=(d.isoformat(),r["league_code"],r["home_team"].strip().casefold(),r["away_team"].strip().casefold())
              if key in seen: continue
              seen.add(key); valid.append({k:r.get(k,"") for k in fields})
          merged=old+valid
          merged.sort(key=lambda r:(r["date"],r["league_code"],r["home_team"],r["away_team"]))
          with base.open("w",newline="",encoding="utf-8-sig") as f:
              writer=csv.DictWriter(f,fieldnames=fields); writer.writeheader(); writer.writerows(merged)
          dates=[r["date"][:10] for r in merged if r.get("date")]
          keys={(r["date"][:10],r["league_code"],r["home_team"].strip().casefold(),r["away_team"].strip().casefold()) for r in merged}
          audit={"existing_rows":len(old),"extension_rows_received":len(new),"extension_rows_added":len(valid),
                 "extension_rows_rejected":len(rejected),"rejected_examples":rejected[:20],
                 "merged_rows":len(merged),"earliest_match_date":min(dates),"latest_match_date":max(dates),
                 "latest_match_age_days":(date.today()-date.fromisoformat(max(dates))).days,
                 "duplicate_keys_after_merge":len(merged)-len(keys),"existing_records_preserved":len(old)<=len(merged)}
          audit_path.write_text(json.dumps(audit,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(audit,indent=2))
          if not valid: raise SystemExit("No verified historical records were added; archive freshness gate must not pass.")
          if audit["latest_match_age_days"]>7: raise SystemExit("Historical archive still older than 7 days after extension.")
          if audit["duplicate_keys_after_merge"]!=0: raise SystemExit("Duplicate match keys detected after merge.")
          PY

      - name: Build H2H report and audit

        working-directory: oracle
        run: python scripts/build_h2h_report.py

      - name: Upload H2H outputs
        uses: actions/upload-artifact@v4
        with:
          name: oracle-h2h-report-${{ github.run_number }}
          path: |
            oracle/reports/h2h/h2h_fixture_report.csv
            oracle/reports/h2h/h2h_unmatched_fixtures.csv
            oracle/reports/h2h/h2h_audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce H2H quality gates after preserving artifacts
        if: always()
        working-directory: oracle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/h2h/h2h_audit.json")
          if not p.exists():
              raise SystemExit("H2H audit missing; report generation did not produce auditable output.")
          audit=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(audit.get("quality_gates", {}), indent=2))
          if audit.get("status") == "FAIL_QUALITY_GATES":
              raise SystemExit("H2H report generated and artifacts preserved, but quality gates failed. Review h2h_audit.json.")
          PY
