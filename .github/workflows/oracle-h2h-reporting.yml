name: Oracle H2H Reporting

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Upcoming fixture window"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "7", "15"]
  schedule:
    - cron: "30 5 * * 6,2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-h2h-reporting.yml"
      - "scripts/build_h2h_report.py"

permissions:
  contents: read

concurrency:
  group: oracle-h2h-reporting
  cancel-in-progress: false

jobs:
  h2h-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout public runner tooling
        uses: actions/checkout@v4

      - name: Clone governed private Oracle source (read-only)
        env:
          ORACLE_PRIVATE_READ_TOKEN: ${{ secrets.ORACLE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_PRIVATE_READ_TOKEN}" ]; then
            echo "ERROR: ORACLE_PRIVATE_READ_TOKEN secret is missing."
            exit 1
          fi
          git clone --depth 1 --branch fix/epl-btts-team-state-aliases \
            "https://x-access-token:${ORACLE_PRIVATE_READ_TOKEN}@github.com/dtnzv5by8c-ship-it/oracle-football-data.git" oracle
          echo "Source commit: $(git -C oracle rev-parse HEAD)"
          cp scripts/build_h2h_report.py oracle/scripts/build_h2h_report.py

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests beautifulsoup4

      - name: Refresh upcoming fixtures in isolated checkout
        working-directory: oracle
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          DAYS_AHEAD="${{ inputs.days_ahead || '3' }}"
          python scripts/ingest_upcoming_fixtures.py "$DAYS_AHEAD" data/fixtures/oracle_upcoming_fixtures.csv
          test -s data/fixtures/oracle_upcoming_fixtures.csv
          python - <<'PY'
          import csv
          from datetime import date, timedelta
          p='data/fixtures/oracle_upcoming_fixtures.csv'
          with open(p, newline='', encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          if not rows: raise SystemExit('Fixture refresh returned zero fixtures; refusing to publish an empty report.')
          dates=[(r.get('date') or '')[:10] for r in rows]
          print(f'Fixture rows={len(rows)}; date range={min(d for d in dates if d)} to {max(d for d in dates if d)}')
          PY

      - name: Build H2H report and audit
        working-directory: oracle
        run: python scripts/build_h2h_report.py

      - name: Upload H2H outputs
        uses: actions/upload-artifact@v4
        with:
          name: oracle-h2h-report-${{ github.run_number }}
          path: |
            oracle/reports/h2h/h2h_fixture_report.csv
            oracle/reports/h2h/h2h_unmatched_fixtures.csv
            oracle/reports/h2h/h2h_audit.json
          if-no-files-found: error
          retention-days: 30
