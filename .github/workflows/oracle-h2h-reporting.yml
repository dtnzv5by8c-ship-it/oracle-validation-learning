name: Oracle H2H Reporting

on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Upcoming fixture window"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "7", "15"]
  schedule:
    - cron: "30 5 * * 6,2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-h2h-reporting.yml"
      - "scripts/build_h2h_report.py"
      - "scripts/run_h2h_incremental_value_experiment.py"
      - "scripts/run_goal_result_feature_experiments.py"
      - "scripts/run_rolling_goal_result_validation.py"
      - "scripts/build_shadow_league_team_alignment.py"
      - "scripts/build_august_research_league_team_audit.py"
      - "scripts/audit_h2h_unmatched_fixtures.py"
      - "tests/test_audit_h2h_unmatched_fixtures.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oracle-h2h-reporting.yml"
      - "scripts/build_h2h_report.py"
      - "scripts/audit_h2h_unmatched_fixtures.py"
      - "tests/test_audit_h2h_unmatched_fixtures.py"

permissions:
  contents: read

concurrency:
  group: oracle-h2h-reporting
  cancel-in-progress: true

jobs:
  h2h-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout public runner tooling
        uses: actions/checkout@v4

      - name: Clone governed private Oracle source (read-only)
        env:
          ORACLE_PRIVATE_READ_TOKEN: ${{ secrets.ORACLE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_PRIVATE_READ_TOKEN}" ]; then
            echo "ERROR: ORACLE_PRIVATE_READ_TOKEN secret is missing."
            exit 1
          fi
          git clone --depth 1 --filter=blob:none --sparse --branch fix/epl-btts-team-state-aliases \
            "https://x-access-token:${ORACLE_PRIVATE_READ_TOKEN}@github.com/dtnzv5by8c-ship-it/oracle-football-data.git" oracle
          cd oracle
          git sparse-checkout set --no-cone database/matches.csv database/one_up_truth.csv archive/PREDICTION_LEDGER.csv scripts/ingest_upcoming_fixtures.py scripts/restore_historical_match_spine.py config/data_config.json research/august_2026_backtest/august_2026_predictions.csv
          cd ..
          echo "Source commit: $(git -C oracle rev-parse HEAD)"
          cp scripts/build_h2h_report.py oracle/scripts/build_h2h_report.py

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests beautifulsoup4 scikit-learn

      - name: Refresh upcoming fixtures in isolated checkout
        working-directory: oracle
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          DAYS_AHEAD="${{ inputs.days_ahead || '3' }}"
          python scripts/ingest_upcoming_fixtures.py "$DAYS_AHEAD" data/fixtures/oracle_upcoming_fixtures.csv
          test -s data/fixtures/oracle_upcoming_fixtures.csv
          python - <<'PY'
          import csv
          from datetime import date, timedelta
          p='data/fixtures/oracle_upcoming_fixtures.csv'
          with open(p, newline='', encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          if not rows: raise SystemExit('Fixture refresh returned zero fixtures; refusing to publish an empty report.')
          dates=[(r.get('date') or '')[:10] for r in rows]
          print(f'Fixture rows={len(rows)}; date range={min(d for d in dates if d)} to {max(d for d in dates if d)}')
          PY

      - name: Extend and validate H2H historical archive
        working-directory: oracle
        env:
          H2H_HISTORY_START: "2018-07-01"
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/restore_historical_match_spine.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace("import argparse,csv,hashlib,json,re,time,urllib.parse,urllib.request",
                      "import argparse,csv,hashlib,json,re,time,urllib.parse,urllib.request,os")
          s=s.replace('START="2025-03-20"; END="2026-09-20"',
                      'START=os.getenv("H2H_HISTORY_START","2023-07-01"); END=datetime.now(timezone.utc).date().isoformat()')
          s=s.replace('for season in ("2024/2025","2025/2026","2026/2027"):',
                      'for season in ("2018/2019","2019/2020","2020/2021","2021/2022","2022/2023","2023/2024","2024/2025","2025/2026","2026/2027"):')
          p.write_text(s,encoding="utf-8")
          PY
          python scripts/restore_historical_match_spine.py \
            --output data/fixtures/h2h_history_extension.csv \
            --manifest data/fixtures/h2h_history_extension_manifest.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from datetime import date
          root=Path(".")
          base=root/"database/matches.csv"
          ext=root/"data/fixtures/h2h_history_extension.csv"
          audit_path=root/"data/fixtures/h2h_history_merge_audit.json"
          with base.open(newline="",encoding="utf-8-sig") as f: old=list(csv.DictReader(f))
          with ext.open(newline="",encoding="utf-8-sig") as f: new=list(csv.DictReader(f))
          if not old: raise SystemExit("Existing governed match archive is empty; refusing to replace it.")
          fields=list(old[0].keys())
          required={"date","league_code","home_team","away_team","home_goals","away_goals"}
          if not required.issubset(fields) or not required.issubset(new[0].keys()):
              raise SystemExit("Historical archive schema mismatch; no merge performed.")
          today=date.today().isoformat()
          seen=set()
          for r in old:
              seen.add((r["date"][:10],r["league_code"],r["home_team"].strip().casefold(),r["away_team"].strip().casefold()))
          valid=[]; rejected=[]
          for r in new:
              try:
                  d=date.fromisoformat(r["date"][:10]); hg=int(float(r["home_goals"])); ag=int(float(r["away_goals"]))
                  if d.isoformat()>today or hg<0 or ag<0: raise ValueError("future date or invalid score")
              except Exception as e:
                  rejected.append({"date":r.get("date"),"league_code":r.get("league_code"),"home_team":r.get("home_team"),"away_team":r.get("away_team"),"reason":str(e)})
                  continue
              key=(d.isoformat(),r["league_code"],r["home_team"].strip().casefold(),r["away_team"].strip().casefold())
              if key in seen: continue
              seen.add(key); valid.append({k:r.get(k,"") for k in fields})
          merged=old+valid
          merged.sort(key=lambda r:(r["date"],r["league_code"],r["home_team"],r["away_team"]))
          with base.open("w",newline="",encoding="utf-8-sig") as f:
              writer=csv.DictWriter(f,fieldnames=fields); writer.writeheader(); writer.writerows(merged)
          dates=[r["date"][:10] for r in merged if r.get("date")]
          keys={(r["date"][:10],r["league_code"],r["home_team"].strip().casefold(),r["away_team"].strip().casefold()) for r in merged}
          audit={"existing_rows":len(old),"extension_rows_received":len(new),"extension_rows_added":len(valid),
                 "extension_rows_rejected":len(rejected),"rejected_examples":rejected[:20],
                 "merged_rows":len(merged),"earliest_match_date":min(dates),"latest_match_date":max(dates),
                 "latest_match_age_days":(date.today()-date.fromisoformat(max(dates))).days,
                 "duplicate_keys_after_merge":len(merged)-len(keys),"existing_records_preserved":len(old)<=len(merged)}
          audit_path.write_text(json.dumps(audit,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(audit,indent=2))
          if not valid: raise SystemExit("No verified historical records were added; archive freshness gate must not pass.")
          if audit["latest_match_age_days"]>7: raise SystemExit("Historical archive still older than 7 days after extension.")
          if audit["duplicate_keys_after_merge"]!=0: raise SystemExit("Duplicate match keys detected after merge.")
          PY

      - name: Build development-only prospective challenger settlement audit
        run: |
          set -euo pipefail
          python scripts/build_prospective_challenger_settlement_audit.py \
            --predictions oracle/archive/PREDICTION_LEDGER.csv \
            --matches oracle/database/matches.csv \
            --verified-results data/verified_shadow_result_reconciliations.csv \
            --out-dir reports/backtest

      - name: Run research-only chronological H2H incremental-value experiment
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/run_h2h_incremental_value_experiment.py \
            --matches oracle/database/matches.csv \
            --predictions oracle/research/august_2026_backtest/august_2026_predictions.csv \
            --out-dir reports/backtest

      - name: Run research-only chronological goal-count and match-result feature experiments
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/run_goal_result_feature_experiments.py \
            --matches oracle/database/matches.csv \
            --out-dir reports/backtest \
            --test-start 2026-04-01

      - name: Build reporting-only shadow league and team alignment scorecards
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_shadow_league_team_alignment.py
          python scripts/build_shadow_league_team_alignment.py \
            --settlements reports/backtest/prospective_shadow_settlements.csv \
            --out-dir reports/backtest \
            --min-team-fixtures 8 \
            --min-league-market 20

      - name: Build August research league and team market scorecards
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_august_research_league_team_audit.py
          python scripts/build_august_research_league_team_audit.py \
            --predictions oracle/research/august_2026_backtest/august_2026_predictions.csv \
            --out-dir reports/backtest \
            --min-team-fixtures 8 \
            --min-league-market 15

      - name: Run multi-window chronological Over 2.5 and match-result validation
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_rolling_goal_result_validation.py
          python scripts/run_rolling_goal_result_validation.py \
            --matches oracle/database/matches.csv \
            --out-dir reports/backtest

      - name: Build H2H report and audit
        working-directory: oracle
        run: python scripts/build_h2h_report.py

      - name: Audit unresolved H2H team and league mappings (research-only)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_audit_h2h_unmatched_fixtures.py' -v
          python scripts/audit_h2h_unmatched_fixtures.py \
            --matches oracle/database/matches.csv \
            --unmatched oracle/reports/h2h/h2h_unmatched_fixtures.csv \
            --out-csv oracle/reports/h2h/h2h_unmatched_team_review.csv \
            --out-json oracle/reports/h2h/h2h_unmatched_team_review_audit.json

      - name: Expose canonical Fixture ID and join H2H by exact ID
        working-directory: oracle
        run: |
          set -euo pipefail
          python ../scripts/prepare_oracle_fixture_id_export.py \
            --input data/fixtures/oracle_upcoming_fixtures.csv \
            --output reports/h2h/oracle_fixture_id_export.csv \
            --audit reports/h2h/oracle_fixture_id_export_audit.json
          python ../scripts/join_h2h_by_fixture_id.py \
            --oracle reports/h2h/oracle_fixture_id_export.csv \
            --h2h reports/h2h/h2h_fixture_report.csv \
            --out reports/h2h/oracle_fixture_report_with_h2h.csv \
            --audit reports/h2h/oracle_h2h_exact_id_join_audit.json \
            --oracle-id fixture_id --h2h-id fixture_id --league-column league_code

      - name: Upload H2H outputs
        uses: actions/upload-artifact@v4
        with:
          name: oracle-h2h-report-${{ github.run_number }}
          path: |
            oracle/reports/h2h/h2h_fixture_report.csv
            oracle/reports/h2h/h2h_unmatched_fixtures.csv
            oracle/reports/h2h/h2h_no_historical_meetings.csv
            oracle/reports/h2h/h2h_match_diagnostics.csv
            oracle/reports/h2h/h2h_unmatched_team_review.csv
            oracle/reports/h2h/h2h_unmatched_team_review_audit.json
            oracle/reports/h2h/h2h_audit.json
            oracle/reports/h2h/oracle_fixture_id_export.csv
            oracle/reports/h2h/oracle_fixture_id_export_audit.json
            oracle/reports/h2h/oracle_fixture_report_with_h2h.csv
            oracle/reports/h2h/oracle_h2h_exact_id_join_audit.json
            oracle/data/fixtures/h2h_history_extension_manifest.json
            oracle/data/fixtures/h2h_history_merge_audit.json
            reports/backtest/**
            data/verified_shadow_result_reconciliations.csv
          if-no-files-found: error
          retention-days: 30

      - name: Enforce H2H quality gates after preserving artifacts
        if: always()
        working-directory: oracle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h2h_path=Path("reports/h2h/h2h_audit.json")
          merge_path=Path("data/fixtures/h2h_history_merge_audit.json")
          source_path=Path("data/fixtures/h2h_history_extension_manifest.json")
          id_export_path=Path("reports/h2h/oracle_fixture_id_export_audit.json")
          join_path=Path("reports/h2h/oracle_h2h_exact_id_join_audit.json")
          for p in (h2h_path,merge_path,source_path,id_export_path,join_path):
              if not p.exists():
                  raise SystemExit(f"Required audit artifact missing: {p}")
          audit=json.loads(h2h_path.read_text(encoding="utf-8"))
          merge=json.loads(merge_path.read_text(encoding="utf-8"))
          source=json.loads(source_path.read_text(encoding="utf-8"))
          id_export=json.loads(id_export_path.read_text(encoding="utf-8"))
          exact_join=json.loads(join_path.read_text(encoding="utf-8"))
          failures=list(audit.get("quality_gates",{}).get("failures",[]))
          if source.get("status") != "OK": failures.append(f"historical source status is {source.get('status')}; errors={len(source.get('errors',[]))}")
          if len(source.get("errors",[])): failures.append(f"historical source has {len(source.get('errors',[]))} league/season acquisition errors")
          if merge.get("latest_match_age_days",999)>7: failures.append("merged historical archive is stale")
          if merge.get("duplicate_keys_after_merge",1)!=0: failures.append("duplicate match keys after historical merge")
          if id_export.get("status")!="PASS": failures.append("canonical fixture ID export did not pass")
          if exact_join.get("exact_id_matches")!=exact_join.get("oracle_rows"): failures.append("not every Oracle fixture has an exact-ID H2H report row")
          if exact_join.get("joined_rows")!=exact_join.get("oracle_rows"): failures.append("joined report row count differs from Oracle fixture export")
          if exact_join.get("fuzzy_matching_used") is not False: failures.append("exact-ID join governance violation")
          print(json.dumps({"h2h_quality_gates":audit.get("quality_gates",{}),"history_merge":merge,"source_status":source.get("status"),"source_errors":len(source.get("errors",[])),"id_export":id_export,"exact_id_join":exact_join,"combined_failures":failures},indent=2))
          if failures:
              raise SystemExit("H2H artifacts were preserved, but one or more quality gates failed. Review the audit and diagnostics artifacts.")
          PY
