name: Oracle Selected-50 Safety Contract Tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline safety contract tests
        run: python -m unittest discover -s tests -p "test_footystats_selected50_bounded_probe_contract.py" -v
      - name: Run research score-settlement contract tests
        run: python -m unittest discover -s tests -p "test_score_market_settlement.py" -v
      - name: Run current-feed identity contract tests (research only)
        run: python -m unittest discover -s tests -p "test_current_feed_identity_contract.py" -v
      - name: Run offline current-feed staging adapter tests (research only)
        run: python -m unittest discover -s tests -p "test_stage_current_feed_identity.py" -v
      - name: Compile current fixture snapshot validator
        run: python -m py_compile scripts/validate_selected50_current_fixture_snapshot.py
      - name: Run current fixture snapshot validator tests
        run: python -m unittest discover -s tests -p "test_selected50_current_fixture_snapshot.py" -v
      - name: Run one-call identity workflow safety tests
        run: python -m unittest discover -s tests -p "test_footystats_one_call_identity_workflow.py" -v
      - name: Run exact cross-provider fixture join audit tests (offline)
        run: python -m unittest discover -s tests -p "test_selected50_cross_provider_fixture_joins.py" -v
      - name: Compile current snapshot overlay
        run: python -m py_compile scripts/overlay_selected50_current_snapshot.py
      - name: Run current snapshot overlay safety tests
        run: python -m unittest discover -s tests -p "test_overlay_selected50_current_snapshot.py" -v
      - name: Compile archive consumption helper and research runtime
        run: python -m py_compile scripts/record_selected50_archive_consumption.py scripts/build_selected50_research_runtime.py
      - name: Compile runtime provenance writer
        run: python -m py_compile scripts/write_selected50_runtime_provenance.py
      - name: Run runtime provenance contract tests
        run: python -m unittest discover -s tests -p "test_selected50_runtime_provenance.py" -v
      - name: Compile snapshot-runtime bridge audit
        run: python -m py_compile scripts/audit_selected50_snapshot_runtime_bridge.py
      - name: Run snapshot-runtime bridge provenance tests
        run: python -m unittest discover -s tests -p "test_selected50_snapshot_runtime_bridge_provenance.py" -v

      - name: Compile fixture context discordance research script
        run: python -m py_compile scripts/analyze_selected50_fixture_context_discordance.py
      - name: Run fixture context discordance research tests
        run: python -m unittest discover -s tests -p "test_selected50_fixture_context_discordance.py" -v

      - name: Compile global market fold-stability audit
        run: python -m py_compile scripts/audit_selected50_global_market_fold_stability.py
      - name: Run global market fold-stability regression tests
        run: python -m unittest discover -s tests -p "test_selected50_global_market_fold_stability.py" -v
      - name: Generate global market fold-stability summary
        run: python scripts/audit_selected50_global_market_fold_stability.py --root . --output "$RUNNER_TEMP/oracle-global-market-fold-summary.json"
