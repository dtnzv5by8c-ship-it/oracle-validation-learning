# Delta gateway status-capture repair is tracked on main in 2ea024ffe37bfc5ad392d38c2c21b6af15528188.
name: Oracle Selected-50 Safety Contract Tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths-ignore:
      - "**/*.md"
      - "data/footystats/rolling-request-ledger.json"
      - "data/footystats/endpoint-preflight/**"
      - "data/footystats/historical-season-plan-2024-2026/**"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report-only regression dependencies
        run: python -m pip install --disable-pip-version-check openpyxl scikit-learn
      - name: Compile dynamic FootyStats provider registry and adapter
        run: python -m py_compile scripts/build_footystats_provider_registry.py scripts/oracle_selected50_footystats_adapter.py
      - name: Test dynamic FootyStats provider registry
        run: python -m unittest discover -s tests -p "test_footystats_provider_registry.py" -v
      - name: Compile and test provider-driven historical season planner
        run: |
          python -m py_compile scripts/build_footystats_historical_season_plan.py
          python -m unittest discover -s tests -p "test_footystats_historical_season_plan.py" -v
      - name: Build and verify the 2024-to-current provider season plan (offline)
        env:
          PLAN_DIR: ${{ runner.temp }}/footystats-historical-plan
        run: |
          set -euo pipefail
          mkdir -p "$PLAN_DIR"
          python scripts/build_footystats_historical_season_plan.py \
            --registry-json data/footystats/footystats-provider-season-registry-2026-11-04.json \
            --start-date 2024-01-01 \
            --end-date 2026-11-04 \
            --plan-csv "$PLAN_DIR/season-plan.csv" \
            --excluded-csv "$PLAN_DIR/excluded-seasons.csv" \
            --summary-json "$PLAN_DIR/summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary=json.loads((Path(os.environ["PLAN_DIR"]) / "summary.json").read_text())
          assert summary["catalogue_provider_season_count"] == 756
          assert summary["planned_provider_season_count"] == 182
          assert summary["planned_provider_league_count"] == 49
          assert summary["excluded_provider_season_count"] == 574
          assert summary["all_catalogue_rows_accounted_for"] is True
          assert summary["api_requests_made"] == 0
          assert summary["production_eligible"] is False and summary["betting_eligible"] is False
          print("PASS: 182 provider seasons / 49 leagues intersect 2024-01-01 through 2026-11-04; all 756 catalogue rows accounted for.")
          PY
      - name: Upload offline FootyStats historical season plan
        uses: actions/upload-artifact@v4
        with:
          name: footystats-historical-season-plan-2024-to-2026
          path: |
            ${{ runner.temp }}/footystats-historical-plan/season-plan.csv
            ${{ runner.temp }}/footystats-historical-plan/excluded-seasons.csv
            ${{ runner.temp }}/footystats-historical-plan/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Compile and test exact current-catalogue to legacy-50 reconciliation
        run: |
          python -m py_compile scripts/reconcile_footystats_current_catalogue_to_legacy50.py
          python -m unittest discover -s tests -p "test_footystats_current_catalogue_reconciliation.py" -v
      - name: Build exact current-catalogue mapping and historical-season crosswalk (offline)
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/footystats-current-catalogue-crosswalk"
          mkdir -p "$OUT_DIR"
          python scripts/reconcile_footystats_current_catalogue_to_legacy50.py \
            --catalogue data/footystats/footystats-provider-season-registry-2026-11-04.csv \
            --season-plan data/footystats/historical-season-plan-2024-2026/season-plan.csv \
            --legacy50-manifest reports/oracle-footystats-selected-50-league-manifest-2026-10-24.md \
            --prior-canonical-crosswalk reports/oracle-selected50-canonical-candidate-crosswalk-2026-10-27.csv \
            --history-start 2024-01-01 \
            --history-end 2026-11-04 \
            --out-csv "$OUT_DIR/current-catalogue-provider-to-oracle-candidate-crosswalk.csv" \
            --out-json "$OUT_DIR/current-catalogue-reconciliation-summary.json"
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"]) / "footystats-current-catalogue-crosswalk"
          summary=json.loads((out / "current-catalogue-reconciliation-summary.json").read_text())
          with (out / "current-catalogue-provider-to-oracle-candidate-crosswalk.csv").open(encoding="utf-8", newline="") as f:
              rows=list(csv.DictReader(f))
          assert summary["current_provider_league_count"] == 49
          assert summary["current_catalogue_season_row_count"] == 756
          assert summary["historical_plan_season_row_count"] == 182
          assert summary["exact_legacy_country_competition_matches"] == 44
          assert summary["legacy50_leagues_absent_from_current_selected_catalogue_count"] == 6
          assert summary["new_current_catalogue_leagues_not_in_legacy50_count"] == 5
          assert summary["canonical_candidate_requires_human_approval_count"] == 22
          assert summary["no_match_in_current_protected_27_registry_count"] == 22
          assert summary["not_assessed_against_current_protected_registry_count"] == 5
          assert summary["historical_ledger_code_candidate_count"] == 24
          assert summary["approved_oracle_canonical_mappings"] == 0
          assert summary["api_requests_made"] == 0
          assert summary["production_eligible"] is False and summary["betting_eligible"] is False
          assert len(rows) == 49
          assert all(r["provider_parent_competition_id"] == "" for r in rows)
          print("PASS: 49 current provider leagues reconciled; 182 historical season partitions linked; no canonical ID promoted.")
          PY
      - name: Upload current provider-to-Oracle candidate crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: footystats-current-catalogue-to-oracle-candidate-crosswalk
          path: |
            ${{ runner.temp }}/footystats-current-catalogue-crosswalk/current-catalogue-provider-to-oracle-candidate-crosswalk.csv
            ${{ runner.temp }}/footystats-current-catalogue-crosswalk/current-catalogue-reconciliation-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Test dynamic FootyStats season adapter
        run: python -m unittest discover -s tests -p "test_oracle_selected50_footystats_adapter.py" -v
      - name: Compile and test FootyStats endpoint pagination contracts
        run: |
          python -m py_compile scripts/validate_footystats_endpoint_contracts.py
          python -m unittest discover -s tests -p "test_footystats_endpoint_contracts.py" -v
      - name: Compile and test global FootyStats rolling-hour request budget
        run: |
          python -m py_compile scripts/footystats_request_budget.py
          python -m unittest discover -s tests -p "test_footystats_request_budget.py" -v
      - name: Compile and test sanitized budgeted FootyStats endpoint preflight
        run: |
          python -m py_compile scripts/footystats_budgeted_endpoint_preflight.py
          python -m unittest discover -s tests -p "test_footystats_budgeted_endpoint_preflight.py" -v
      - name: Compile and test FootyStats full ingestion manifest planner
        run: |
          python -m py_compile scripts/build_footystats_full_ingestion_manifest.py
          python -m unittest discover -s tests -p "test_build_footystats_full_ingestion_manifest.py" -v
      - name: Compile OMI report, history audit and no-call actuals placeholder
        run: python -m py_compile scripts/build_selected50_market_intelligence_report.py scripts/audit_selected50_row_level_history_provenance.py scripts/write_selected50_unqueried_actual_results.py scripts/build_selected50_research_runtime.py
      - name: Test explicit snapshot evidence exceptions in OMI report
        run: python -m unittest discover -s tests -p "test_selected50_market_intelligence_report.py" -v
      - name: Test venue-specific historical form provenance
        run: python -m unittest discover -s tests -p "test_selected50_row_level_history_provenance.py" -v
      - name: Test inclusive runtime report horizon
        run: python -m unittest discover -s tests -p "test_selected50_report_window.py" -v
      - name: Test zero-call actual-results placeholder
        run: python -m unittest discover -s tests -p "test_selected50_unqueried_actual_results.py" -v
      - name: Run offline safety contract tests
        run: python -m unittest discover -s tests -p "test_footystats_selected50_bounded_probe_contract.py" -v
      - name: Verify all legacy FootyStats API paths are blocked
        run: python -m unittest discover -s tests -p "test_footystats_ingestion_workflow_contract.py" -v
      - name: Run research score-settlement contract tests
        run: python -m unittest discover -s tests -p "test_score_market_settlement.py" -v
      - name: Run paired H2H chronology and output-contract tests (research only)
        run: python -m unittest discover -s tests -p "test_selected50_h2h_paired_chronology.py" -v && python -m unittest discover -s tests -p "test_selected50_h2h_output_contract.py" -v
      - name: Run current-feed identity contract tests (research only)
        run: python -m unittest discover -s tests -p "test_current_feed_identity_contract.py" -v
      - name: Run offline current-feed staging adapter tests (research only)
        run: python -m unittest discover -s tests -p "test_stage_current_feed_identity.py" -v
      - name: Compile current fixture snapshot probe and validator
        run: python -m py_compile scripts/oracle_selected50_current_fixture_probe.py scripts/validate_selected50_current_fixture_snapshot.py
      - name: Run current fixture snapshot validator tests
        run: python -m unittest discover -s tests -p "test_selected50_current_fixture_snapshot.py" -v
      - name: Run one-call identity workflow safety tests
        run: python -m unittest discover -s tests -p "test_footystats_one_call_identity_workflow.py" -v
      - name: Run exact cross-provider fixture join audit tests (offline)
        run: python -m unittest discover -s tests -p "test_selected50_cross_provider_fixture_joins.py" -v
      - name: Compile current snapshot overlay
        run: python -m py_compile scripts/overlay_selected50_current_snapshot.py
      - name: Run current snapshot overlay safety tests
        run: python -m unittest discover -s tests -p "test_overlay_selected50_current_snapshot.py" -v
      - name: Compile archive consumption helper and research runtime
        run: python -m py_compile scripts/record_selected50_archive_consumption.py scripts/build_selected50_research_runtime.py
      - name: Compile runtime provenance writer
        run: python -m py_compile scripts/write_selected50_runtime_provenance.py
      - name: Run runtime provenance contract tests
        run: python -m unittest discover -s tests -p "test_selected50_runtime_provenance.py" -v
      - name: Compile snapshot-runtime bridge audit
        run: python -m py_compile scripts/audit_selected50_snapshot_runtime_bridge.py
      - name: Run snapshot-runtime bridge provenance tests
        run: python -m unittest discover -s tests -p "test_selected50_snapshot_runtime_bridge_provenance.py" -v

      - name: Compile fixture context discordance research script
        run: python -m py_compile scripts/analyze_selected50_fixture_context_discordance.py
      - name: Run fixture context discordance research tests
        run: python -m unittest discover -s tests -p "test_selected50_fixture_context_discordance.py" -v

      - name: Compile global market fold-stability audit
        run: python -m py_compile scripts/audit_selected50_global_market_fold_stability.py
      - name: Run global market fold-stability regression tests
        run: python -m unittest discover -s tests -p "test_selected50_global_market_fold_stability.py" -v
      - name: Generate global market fold-stability summary
        run: python scripts/audit_selected50_global_market_fold_stability.py --root . --output "$RUNNER_TEMP/oracle-global-market-fold-summary.json"

      - name: Compile 200-season ingestion ledger audit
        run: python -m py_compile scripts/audit_selected50_ingestion_ledger_reconciliation.py
      - name: Run 200-season ingestion ledger regression tests
        run: python -m unittest discover -s tests -p "test_selected50_ingestion_ledger_reconciliation.py" -v
      - name: Reconcile sanitized 200-season ingestion ledger
        run: python scripts/audit_selected50_ingestion_ledger_reconciliation.py --ledger data/oracle_selected50_sanitized_ingestion_ledger_40375285207.json.gz --summary "$RUNNER_TEMP/oracle-selected50-200-season-summary.json" --rollup "$RUNNER_TEMP/oracle-selected50-200-season-rollup.csv"
      - name: Run private archive feature coverage helper tests
        run: python -m unittest discover -s tests -p "test_selected50_private_archive_feature_coverage.py" -v
      - name: Compile exact calendar-year coverage audit
        run: python -m py_compile scripts/build_selected50_calendar_year_coverage.py
      - name: Run exact calendar-year coverage contract tests
        run: python -m unittest discover -s tests -p "test_selected50_calendar_year_coverage.py" -v
      - name: Compile per-league numeric missingness audit
        run: python -m py_compile scripts/analyze_selected50_league_numeric_missingness.py
      - name: Run per-league numeric missingness regression tests
        run: python -m unittest discover -s tests -p "test_selected50_league_numeric_missingness.py" -v
      - name: Compile prematch xG and odds zero-mask audit
        run: python -m py_compile scripts/analyze_selected50_xg_odds_mask_audit.py
      - name: Run prematch xG and odds zero-mask audit tests
        run: python -m unittest discover -s tests -p "test_selected50_xg_odds_mask_audit.py" -v
      - name: Compile xG and odds temporal shift audit
        run: python -m py_compile scripts/audit_selected50_xg_odds_temporal_shift.py
      - name: Run xG and odds temporal shift regression tests
        run: python -m unittest discover -s tests -p "test_selected50_xg_odds_temporal_shift.py" -v
      - name: Compile xG and odds cross-scope reconciliation audit
        run: python -m py_compile scripts/audit_selected50_xg_odds_crossscope_reconciliation.py
      - name: Run xG and odds cross-scope reconciliation tests
        run: python -m unittest discover -s tests -p "test_selected50_xg_odds_crossscope_reconciliation.py" -v
      - name: Compile season event-time readiness audit
        run: python -m py_compile scripts/audit_selected50_season_event_time_readiness.py
      - name: Run season event-time readiness regression tests
        run: python -m unittest discover -s tests -p "test_selected50_season_event_time_readiness.py" -v
      - name: Compile xG heterogeneity and team sample adequacy audit
        run: python -m py_compile scripts/audit_selected50_xg_heterogeneity_team_sample_adequacy.py
      - name: Run xG heterogeneity and team sample adequacy regression tests
        run: python -m unittest discover -s tests -p "test_selected50_xg_heterogeneity_team_sample_adequacy.py" -v

      - name: Upload sanitized 200-season archive rollup
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-200-season-ingestion-audit
          path: |
            ${{ runner.temp }}/oracle-selected50-200-season-summary.json
            ${{ runner.temp }}/oracle-selected50-200-season-rollup.csv
          if-no-files-found: error
          retention-days: 14

