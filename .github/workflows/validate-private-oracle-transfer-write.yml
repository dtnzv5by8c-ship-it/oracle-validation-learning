name: DISABLED — Private Oracle Transfer Write Validation

# This workflow previously created and deleted a temporary branch in the protected
# oracle-football-data repository. Even temporary writes are prohibited for this task.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse protected-repository write validation
        shell: bash
        run: |
          echo "::error::This write-validation workflow is disabled. Do not create or delete refs in the protected Oracle repository."
          exit 1
