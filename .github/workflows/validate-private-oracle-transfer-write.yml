name: Validate private Oracle transfer write access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create and remove a temporary private-repository test branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          TARGET_REPO: dtnzv5by8c-ship-it/oracle-football-data
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::ORACLE_PRIVATE_REPO_TOKEN secret is missing or empty."
            exit 1
          fi
          # Unique test branch. No files or commits are created; cleanup runs even after a failed check.
          TEST_BRANCH="oracle-transfer-permission-test-${GITHUB_RUN_ID}"
          cleanup() {
            gh api --method DELETE "repos/$TARGET_REPO/git/refs/heads/$TEST_BRANCH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          if ! BASE_SHA="$(gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)"; then
            echo "::error::Could not read the private repository main ref."
            exit 1
          fi
          if ! gh api --method POST "repos/$TARGET_REPO/git/refs" -f "ref=refs/heads/$TEST_BRANCH" -f "sha=$BASE_SHA" >/dev/null 2>&1; then
            echo "::error::Read access passed, but GitHub rejected the temporary ref creation. Check token Contents: Read and write permission and repository selection."
            exit 1
          fi
          if ! gh api --method DELETE "repos/$TARGET_REPO/git/refs/heads/$TEST_BRANCH" >/dev/null 2>&1; then
            echo "::error::Write check succeeded, but temporary branch cleanup failed. Delete the branch named $TEST_BRANCH from the private repository after checking."
            exit 1
          fi
          trap - EXIT
          echo "PASS: token can create and delete a temporary ref in the private repository."
          echo "No files, commits, model changes, provider data, or credentials were written."
