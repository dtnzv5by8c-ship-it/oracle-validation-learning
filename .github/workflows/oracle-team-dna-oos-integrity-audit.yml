name: Oracle Team DNA OOS Integrity Audit (Research Only)
on:
  workflow_dispatch:
    inputs:
      confirm_private_source_read:
        description: "Confirm read-only checkout of the existing oracle-football-data source repository"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  audit:
    if: ${{ inputs.confirm_private_source_read }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Verify private source-read permission
        env:
          SOURCE_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          test -n "$SOURCE_TOKEN" || { echo "ORACLE_PRIVATE_REPO_TOKEN is unavailable"; exit 1; }
      - name: Checkout pinned existing source outputs
        uses: actions/checkout@v4
        with:
          repository: dtnzv5by8c-ship-it/oracle-football-data
          ref: cb89e5bd1c24810fe821a6b2c3c2c1c19272b381
          token: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          path: oracle-football-data
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            database/matches.csv
            research/four_model/outputs/four_model_oos_predictions.csv
            research/M1UP_OOS_PREDICTIONS_001.csv
            research/M1UP_CALIBRATION_PREDICTIONS_w250.csv
      - name: Run research-only tests
        run: python -m unittest discover -s tests -p "test_build_oracle_team_market_oos_profiles.py" -v
      - name: Build team/league market OOS profiles
        run: |
          python scripts/build_oracle_team_market_oos_profiles.py \
            --source-root oracle-football-data \
            --output-dir "$${{ runner.temp }}/oracle-team-dna-oos"
      - name: Upload sanitized aggregate outputs only
        uses: actions/upload-artifact@v4
        with:
          name: oracle-team-dna-oos-integrity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oracle-team-dna-oos/oracle_team_market_oos_summary.json
            ${{ runner.temp }}/oracle-team-dna-oos/oracle_team_market_oos_summary.csv
            ${{ runner.temp }}/oracle-team-dna-oos/oracle_team_market_oos_chronology.csv
            ${{ runner.temp }}/oracle-team-dna-oos/oracle_league_market_oos_summary.csv
          if-no-files-found: error
          retention-days: 14
