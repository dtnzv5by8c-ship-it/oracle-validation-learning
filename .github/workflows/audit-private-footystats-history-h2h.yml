name: Disabled - Private FootyStats History and H2H Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse protected-repository audit transfer
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This audit workflow is disabled for the research-only build because its previous implementation uploaded artifacts to a protected repository. No credentials, private archive, provider API, or remote write may be used here."
          exit 1
