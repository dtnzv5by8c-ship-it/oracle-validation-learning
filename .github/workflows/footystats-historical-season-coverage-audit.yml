name: DISABLED — Legacy FootyStats Historical Season Coverage Audit

# This workflow previously ran on push and could call multiple endpoints for historical
# seasons without explicit provider-credit or monthly-credit confirmation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse automatic historical provider calls
        shell: bash
        run: |
          echo "::error::This historical season audit is disabled. Automatic or unbudgeted FootyStats calls are prohibited."
          exit 1
