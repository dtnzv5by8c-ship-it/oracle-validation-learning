name: Oracle Research Expansion (Public Runner)

on:
  push:
    branches: [reporting/run61-followups-32col-kickoff-risk]
    paths:
      - ".github/workflows/oracle-research-expansion-public-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-research-expansion-public-runner
  cancel-in-progress: false

jobs:
  replay:
    name: Research replay ${{ matrix.league }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        league: [D1, I1, F1, P1, RSA, E1, E2, E3, SP2, D2, F2, I2, N1, NED2, POR2, B1, AUT, SWZ, POL, ROU, CZE, CRO, UKR, SC0, T1, E0, SP1]
    env:
      SEASON: "2025/2026"
      LEAGUE: ${{ matrix.league }}
    steps:
      - name: Clone governed Oracle source read-only
        env:
          ORACLE_READ_TOKEN: ${{ secrets.ORACLE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_READ_TOKEN}" ]; then
            echo "ERROR: ORACLE_PRIVATE_READ_TOKEN is missing."
            exit 1
          fi
          git -c http.version=HTTP/1.1 clone --depth 1 --single-branch --branch fix/epl-btts-team-state-aliases "https://x-access-token:${ORACLE_READ_TOKEN}@github.com/dtnzv5by8c-ship-it/oracle-football-data.git" oracle
          unset ORACLE_READ_TOKEN
          echo "Source commit: $(git -C oracle rev-parse HEAD)"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Run existing walk-forward research engine
        working-directory: oracle
        run: python scripts/run_oracle_walk_forward.py --season "$SEASON" --league "$LEAGUE"
      - name: Validate research manifest
        working-directory: oracle
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          season=os.environ["SEASON"].replace("/","-")
          league=os.environ["LEAGUE"]
          p=Path("research/oracle_walk_forward")/f"manifest_{season}_{league}.json"
          if not p.exists():
              raise SystemExit(f"Missing research manifest: {p}")
          d=json.loads(p.read_text())
          if d.get("prediction_rows",0)<=0 or d.get("league_scope")!=league or d.get("season")!=os.environ["SEASON"]:
              raise SystemExit(f"Invalid research manifest: {d}")
          print(json.dumps({"league":league,"season":d.get("season"),"prediction_rows":d.get("prediction_rows"),"resolved_rows":d.get("resolved_rows"),"status":"RESEARCH_ONLY","production_promotion":False},indent=2))
          PY
      - name: Upload league research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oracle-v2-research-${{ matrix.league }}
          path: |
            oracle/research/oracle_walk_forward/manifest_2025-2026_${{ matrix.league }}.json
            oracle/research/oracle_walk_forward/predictions_2025-2026_${{ matrix.league }}.csv
            oracle/research/oracle_walk_forward/monthly_metrics_2025-2026_${{ matrix.league }}.csv
            oracle/research/oracle_walk_forward/team_compatibility_2025-2026_${{ matrix.league }}.csv
            oracle/research/oracle_walk_forward/fixture_dna_2025-2026_${{ matrix.league }}.csv
            oracle/research/oracle_walk_forward/league_dna_2025-2026_${{ matrix.league }}.csv
          if-no-files-found: error
          retention-days: 14
