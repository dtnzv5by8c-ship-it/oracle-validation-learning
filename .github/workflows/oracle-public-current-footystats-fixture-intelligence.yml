name: Oracle Public Current FootyStats Fixture Intelligence

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oracle-public-current-footystats-fixture-intelligence.yml"
      - "recovery/fixtures/current/governed_fixture_reconciliation.csv"
      - "data/fixtures/governed_50league_current.csv"
      - "data/fixtures/governed_50league_current_manifest.json"

permissions:
  contents: write

concurrency:
  group: oracle-public-current-footystats-fixture-intelligence
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate provider secret
        run: test -n "${FOOTYSTATS_API_KEY:-}"

      - name: Pull current pre-match FootyStats team intelligence
        shell: python
        run: |
          import csv, json, os, re, time, unicodedata
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API=os.environ["FOOTYSTATS_API_KEY"]
          SRC=Path("data/fixtures/governed_50league_current.csv")
          MANIFEST=Path("data/fixtures/governed_50league_current_manifest.json")
          OUT=Path("recovery/fixtures/current/intelligence")
          OUT.mkdir(parents=True,exist_ok=True)

          rows=list(csv.DictReader(SRC.open(encoding="utf-8",newline="")))
          manifest=json.loads(MANIFEST.read_text(encoding="utf-8"))
          governed_fixture_rows=len(rows)
          if governed_fixture_rows <= 0:
              raise SystemExit("FAIL-CLOSED: current governed fixture spine is empty")
          if int(manifest.get("governed_leagues") or 0) != 50:
              raise SystemExit("FAIL-CLOSED: governed_leagues must equal 50")
          if int(manifest.get("fixture_rows") or 0) != governed_fixture_rows:
              raise SystemExit("FAIL-CLOSED: manifest fixture_rows diverges from live rolling spine")
          if int(manifest.get("unique_provider_fixture_ids") or 0) != governed_fixture_rows:
              raise SystemExit("FAIL-CLOSED: manifest provider Fixture-ID count diverges from live rolling spine")
          if any(str(r.get("identity_status") or "") != "EXACT_PROVIDER_FIXTURE_ID" for r in rows):
              raise SystemExit("FAIL-CLOSED: rolling spine contains non-exact provider fixture identity")
          for r in rows:
              r["league_code"]=r.get("league_season_id") or ""
              r["provider_fixture_id"]=r.get("fixture_id") or ""
              r["provider_competition_id"]=r.get("league_season_id") or ""
              r["provider_season"]=r.get("provider_season") or ""
              r["provider_status"]=r.get("provider_status") or ""
              r["provider_kickoff_unix"]=str(int(datetime.fromisoformat(str(r.get("kickoff_utc")).replace("Z","+00:00")).timestamp()))
              r["provider_kickoff_utc"]=r.get("kickoff_utc") or ""
              r["provider_home_id"]=r.get("provider_home_id") or ""
              r["provider_away_id"]=r.get("provider_away_id") or ""

          def norm(x):
              return re.sub(r"[^a-z0-9]+","",unicodedata.normalize("NFKD",str(x or "")).encode("ascii","ignore").decode().lower())

          def api(path, params):
              url="https://api.football-data-api.com/"+path+"?"+urlencode({"key":API,**params})
              req=Request(url,headers={"User-Agent":"Oracle-Public-Current-FootyStats-Intelligence/1.0"})
              last=None
              for attempt in range(4):
                  try:
                      with urlopen(req,timeout=60) as r:
                          p=json.loads(r.read().decode("utf-8"))
                      if p.get("success") is not True:
                          raise RuntimeError(f"{path}: success=false")
                      return p
                  except Exception as e:
                      last=e
                      if getattr(e,"code",None)==429 and attempt<3:
                          time.sleep(8*(attempt+1))
                          continue
                      raise
              raise last

          # Only exact current-provider identities are eligible.
          exact=list(rows)
          ambiguous=[]
          unmatched=[]

          metrics=[
            ("PPG","PPG","seasonPPG_overall","points_per_game"),
            ("PPG Home","PPG_HOME","seasonPPG_home","home_ppg"),
            ("PPG Away","PPG_AWAY","seasonPPG_away","away_ppg"),
            ("GF/M","GF_PER_MATCH","seasonAVG_goals_scored","goals_scored_per_match","avg_goals_scored"),
            ("GA/M","GA_PER_MATCH","seasonAVG_goals_conceded","goals_conceded_per_match","avg_goals_conceded"),
            ("Average Goals","AVERAGE_GOALS","seasonAVG_total_goals","average_goals"),
            ("BTTS %","BTTS_PCT","seasonBTTSPercentage","btts_percentage"),
            ("Over 0.5 %","OVER_0_5_PCT","seasonOver05Percentage","over05_percentage"),
            ("Over 1.5 %","OVER_1_5_PCT","seasonOver15Percentage","over15_percentage"),
            ("Over 2.5 %","OVER_2_5_PCT","seasonOver25Percentage","over25_percentage"),
            ("Over 3.5 %","OVER_3_5_PCT","seasonOver35Percentage","over35_percentage"),
            ("Over 4.5 %","OVER_4_5_PCT","seasonOver45Percentage","over45_percentage"),
            ("Under 0.5 %","UNDER_0_5_PCT","seasonUnder05Percentage","under05_percentage"),
            ("Under 1.5 %","UNDER_1_5_PCT","seasonUnder15Percentage","under15_percentage"),
            ("Under 2.5 %","UNDER_2_5_PCT","seasonUnder25Percentage","under25_percentage"),
            ("Under 3.5 %","UNDER_3_5_PCT","seasonUnder35Percentage","under35_percentage"),
            ("Under 4.5 %","UNDER_4_5_PCT","seasonUnder45Percentage","under45_percentage"),
          ]

          # todays-matches exposes the numeric league-season identifier in provider_competition_id.
          # FootyStats league-teams requires that numeric season_id; provider_season is only a display label.
          team_cache={}
          evidence=[]
          audit=[]

          def flat(t):
              s=t.get("stats")
              if isinstance(s,dict): return {**t,**s}
              if isinstance(s,list) and s and isinstance(s[0],dict): return {**t,**s[0]}
              return t

          def get(t,*keys):
              t=flat(t)
              for k in keys:
                  if k in t and t[k] not in (None,"","null"):
                      return t[k]
              return None

          for r in exact:
              fid=r.get("provider_fixture_id")
              season_label=str(r.get("provider_season") or "").strip()
              comp_id=str(r.get("provider_competition_id") or "").strip()
              sid=comp_id
              kickoff_raw=r.get("provider_kickoff_unix")
              if not sid:
                  audit.append({**r,"intelligence_status":"UNVERIFIED","reason":"PROVIDER_SEASON_ID_MISSING","provider_competition_id":comp_id,"provider_season":season_label})
                  continue
              try:
                  kickoff=int(float(kickoff_raw))
              except Exception:
                  audit.append({**r,"intelligence_status":"UNVERIFIED","reason":"PROVIDER_KICKOFF_MISSING"})
                  continue

              cutoff=kickoff-1
              date_key=r.get("date") or ""
              cache_key=(sid,date_key)
              if cache_key not in team_cache:
                  try:
                      same_day=[x for x in exact if str(x.get("provider_season") or "").strip()==season_label and str(x.get("provider_competition_id") or "").strip()==comp_id and str(x.get("date") or "")==date_key]
                      cutoffs=[]
                      for x in same_day:
                          try: cutoffs.append(int(float(x.get("provider_kickoff_unix")))-1)
                          except Exception: pass
                      snapshot_cutoff=min(cutoffs) if cutoffs else cutoff
                      payload=api("league-teams",{"season_id":sid,"include":"stats","max_time":snapshot_cutoff})
                      team_cache[cache_key]=(payload.get("data") or [],snapshot_cutoff)
                  except Exception as exc:
                      team_cache[cache_key]=None
                      audit.append({**r,"intelligence_status":"UNVERIFIED","reason":"PROVIDER_TEAM_SNAPSHOT_FAILED","detail":type(exc).__name__,"provider_season_id":sid})
                      continue

              cached=team_cache[cache_key]
              if cached is None:
                  continue
              teams,snapshot_cutoff=cached
              byid={str(t.get("id")):t for t in teams if isinstance(t,dict) and t.get("id") is not None}
              ht=byid.get(str(r.get("provider_home_id")))
              at=byid.get(str(r.get("provider_away_id")))
              if not ht or not at:
                  audit.append({**r,"intelligence_status":"UNVERIFIED","reason":"PROVIDER_TEAM_ID_NOT_IN_SNAPSHOT"})
                  continue

              for side,t in (("Home",ht),("Away",at)):
                  st=flat(t)
                  for label,code,*keys in metrics:
                      v=get(st,*keys)
                      if label=="PPG":
                          denom_key="seasonMatchesPlayed_overall"
                      elif label=="PPG Home" and side=="Home":
                          denom_key="seasonMatchesPlayed_home"
                      elif label=="PPG Away" and side=="Away":
                          denom_key="seasonMatchesPlayed_away"
                      else:
                          denom_key="seasonMatchesPlayed_overall"
                      sample=get(st,denom_key)
                      value_ok=v is not None
                      chronology_ok=cutoff<kickoff
                      if not value_ok:
                          status="UNAVAILABLE"
                          reason="PROVIDER_FIELD_MISSING"
                          quality="UNAVAILABLE"
                      elif not chronology_ok:
                          status="UNVERIFIED"
                          reason="SOURCE_NOT_PRE_KICKOFF"
                          quality="UNVERIFIED"
                      elif sample is None:
                          status="FOOTYSTATS_DIRECT_DENOMINATOR_UNAVAILABLE"
                          reason="PROVIDER_DENOMINATOR_FIELD_MISSING"
                          quality="DIRECT_PROVIDER_VALUE"
                      else:
                          status="FOOTYSTATS_DIRECT"
                          reason=""
                          quality="DIRECT_PROVIDER_VALUE"

                      evidence.append({
                          "Fixture ID":fid,
                          "date":r.get("date"),
                          "league":r.get("league_code") or "",
                          "home_team":r.get("home_team"),
                          "away_team":r.get("away_team"),
                          "provider":"FootyStats",
                          "provider_fixture_id":fid,
                          "provider_home_id":r.get("provider_home_id"),
                          "provider_away_id":r.get("provider_away_id"),
                          "provider_season":sid,
                          "provider_league":r.get("provider_competition_id") or "",
                          "side":side,
                          "metric":label,
                          "metric_code":code,
                          "value":v if value_ok else "UNAVAILABLE",
                          "denominator_sample":sample if sample is not None else "UNAVAILABLE",
                          "source_timestamp":snapshot_cutoff,
                          "source_timestamp_utc":datetime.fromtimestamp(snapshot_cutoff,tz=timezone.utc).isoformat(),
                          "kickoff_unix":kickoff,
                          "pre_match_status":"VERIFIED_PRE_KICKOFF" if chronology_ok else "UNVERIFIED",
                          "freshness":"PREMATCH_SNAPSHOT" if chronology_ok else "UNVERIFIED",
                          "provenance":"FootyStats league-teams direct API",
                          "source_quality":quality,
                          "substitution_flag":"FALSE",
                          "missingness_reason":reason,
                          "status":status
                      })

              audit.append({**r,"intelligence_status":"DIRECT_PROVIDER_SNAPSHOT","reason":"","snapshot_cutoff_unix":snapshot_cutoff,"provider_season_id":sid})
              time.sleep(0.05)

          for r in ambiguous:
              audit.append({**r,"intelligence_status":"UNVERIFIED","reason":"AMBIGUOUS_PROVIDER_FIXTURE_IDENTITY"})
          for r in unmatched:
              audit.append({**r,"intelligence_status":"UNVERIFIED","reason":"NO_CURRENT_FOOTYSTATS_FIXTURE_IDENTITY"})

          with (OUT/"footystats_current_fixture_intelligence.csv").open("w",encoding="utf-8",newline="") as f:
              fieldnames=list(evidence[0].keys()) if evidence else ["Fixture ID","status"]
              w=csv.DictWriter(f,fieldnames=fieldnames)
              w.writeheader()
              w.writerows(evidence)

          with (OUT/"fixture_intelligence_audit.csv").open("w",encoding="utf-8",newline="") as f:
              fieldnames=list(audit[0].keys()) if audit else ["Fixture ID","intelligence_status","reason"]
              w=csv.DictWriter(f,fieldnames=fieldnames)
              w.writeheader()
              w.writerows(audit)

          direct=sum(1 for x in evidence if x.get("status")=="FOOTYSTATS_DIRECT")
          unavailable=sum(1 for x in evidence if x.get("status")=="UNAVAILABLE")
          denom_missing=sum(1 for x in evidence if x.get("status")=="FOOTYSTATS_DIRECT_DENOMINATOR_UNAVAILABLE")
          unverified=sum(1 for x in evidence if x.get("status")=="UNVERIFIED")

          summary={
              "generated_utc":datetime.now(timezone.utc).isoformat(),
              "governed_fixture_rows":governed_fixture_rows,
              "governed_leagues":int(manifest.get("governed_leagues") or 0),
              "season_ids_with_fixtures":int(manifest.get("season_ids_with_fixtures") or 0),
              "exact_fixture_rows":len(exact),
              "ambiguous_fixture_rows":len(ambiguous),
              "unmatched_fixture_rows":len(unmatched),
              "intelligence_rows":len(evidence),
              "direct_provider_value_rows":direct,
              "unavailable_value_rows":unavailable,
              "denominator_unavailable_rows":denom_missing,
              "unverified_value_rows":unverified,
              "metrics_requested":len(metrics),
              "private_repository_used":False,
              "historical_season_fallback_used":False,
              "fuzzy_matching_used":False,
              "oracle_v1_6_changed":False,
              "master_omi_a_et_changed":False,
              "governance":"Current FootyStats intelligence evidence only; provider values are not Oracle V1.6 probabilities."
          }
          if summary["governed_fixture_rows"] != len(rows):
              raise SystemExit("FAIL-CLOSED: summary fixture count diverges from current governed spine")
          (OUT/"footystats_current_fixture_intelligence_summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))

          if len(exact) != governed_fixture_rows:
              raise SystemExit("FAIL-CLOSED: exact fixture identity count diverges from rolling spine")
          if len(exact)>0 and len(evidence)==0:
              raise SystemExit("FAIL-CLOSED: exact fixture identities exist but no current intelligence was produced.")

      - name: Persist current intelligence evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oracle-public-footystats-bot"
          git config user.email "oracle-public-footystats-bot@users.noreply.github.com"
          git add recovery/fixtures/current/intelligence/
          if git diff --cached --quiet; then
            echo "No intelligence changes."
          else
            git commit -m "Add current FootyStats fixture intelligence"
            for attempt in 1 2 3 4 5; do
              git fetch --no-tags origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Persisted current intelligence on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::CURRENT_INTELLIGENCE_PERSISTENCE_PUSH_FAILED_AFTER_RETRIES"
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Upload intelligence artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-public-current-footystats-fixture-intelligence-${{ github.run_id }}
          path: recovery/fixtures/current/intelligence/
          retention-days: 30
