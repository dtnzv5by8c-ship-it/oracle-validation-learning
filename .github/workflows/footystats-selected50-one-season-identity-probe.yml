name: FootyStats One-Call Selected-Season Identity Probe (Fail-Closed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block-mismatched-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why no provider request is permitted
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This workflow is intentionally fail-closed. Its current entrypoint iterates over 50 selected seasons, not exactly one request. No provider requests were made. Reintroduce a true single-season entrypoint or obtain separate approval for a batch workflow with an explicit 50-request credit budget."
          exit 1
