name: Oracle Weekly Chronological Backtest and Recalibration Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-weekly-recalibration.yml"
      - "scripts/run_weekly_recalibration_audit.py"

permissions:
  contents: write

concurrency:
  group: oracle-weekly-recalibration
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
      TARGET_REPO: dtnzv5by8c-ship-it/oracle-football-data
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret
        run: test -n "${GH_TOKEN:-}"

      - name: Clone latest private production main
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(${printf 'x-access-token:%s' "$"GH_TOKEN" | base64 -w0)" clone --depth 1 --branch main "https://github.com/${TARGET_REPO}.git" oracle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn

      - name: Run chronological weekly audit
        run: python scripts/run_weekly_recalibration_audit.py

      - name: Publish research evidence
        run: |
          git config user.name "oracle-weekly-recalibration-bot"
          git config user.email "oracle-weekly-recalibration-bot@users.noreply.github.com"
          git add outputs/weekly_recalibration
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record weekly chronological backtest and recalibration audit"
            git fetch --no-tags origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oracle-weekly-recalibration-${{ github.run_id }}
          retention-days: 14
          path: outputs/weekly_recalibration
