name: Oracle Selected-50 Dry-Run Planner
on:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dry-run plan (no network calls)
        run: python scripts/plan_selected50_dry_run.py
      - name: Build conservative market gates
        run: python scripts/build_selected50_market_gates.py
      - name: Run planner regression tests
        run: python tests/test_selected50_dry_run_planner.py
      - name: Run market gate regression tests
        run: python tests/test_selected50_market_gates.py
      - name: Run exact catalogue resolver tests
        run: python tests/test_selected50_catalogue_resolver.py
      - name: Run prediction input contract tests
        run: python tests/test_selected50_prediction_inputs.py
      - name: Validate governed Selected-50 compatibility contract
        run: python tests/test_selected50_compatibility_contract.py
      - name: Validate FootyStats identifier separation contract (no API calls)
        run: python tests/test_footystats_ingestion_workflow_contract.py
      - name: Generate Combo settlement mismatch diagnostic (no network calls)
        run: python scripts/build_combo_settlement_mismatch_audit.py
      - name: Run Combo settlement governance regression tests
        run: python tests/test_selected50_combo_settlement_gate.py
      - name: Validate Combo diagnostic output
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("audit-output")
          rows = list(csv.DictReader((root / "selected50_combo_settlement_mismatch_matrix.csv").open(encoding="utf-8", newline="")))
          summary = json.loads((root / "selected50_combo_settlement_mismatch_summary.json").read_text(encoding="utf-8"))
          assert len(rows) == 121
          assert summary["combo_home_disagreement_scorelines"] == 2
          assert summary["combo_away_disagreement_scorelines"] == 2
          assert all(r["production_eligible"] == "NO" for r in rows)
          assert summary["production_eligible"] is False
          print("PASS: Combo mismatch is explicit, reproducible, and remains blocked.")
          PY
      - name: Validate plan output
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("audit-output")
          rows = list(csv.DictReader((root / "selected50_dry_run_coverage_matrix.csv").open()))
          gates = list(csv.DictReader((root / "selected50_market_readiness_gates.csv").open()))
          summary = json.loads((root / "selected50_dry_run_summary.json").read_text())
          assert len(rows) == len(gates) == 50
          assert len({r["selected_id"] for r in rows}) == 50
          assert summary["network_calls_made"] == summary["paid_provider_calls_made"] == 0
          assert all(r["production_eligible"] == "NO" for r in rows + gates)
          assert all(r["btts_yes_gate"] == "NOT_VERIFIED" for r in gates)
          print("PASS: 50 IDs, evidence joins, conservative market gates, zero provider calls.")
          PY
      - name: Validate evidence-layer reconciliation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("audit-output/selected50_evidence_layer_reconciliation.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          e = d["run56_exact_id_evidence"]
          selected_count = d["selected_group_count"]
          present = e["manifest_records_present"]
          absent = e["no_manifest_record"]
          archive_rows = e["archive_records"]
          # Assert stable invariants rather than freezing today's 31/19 split.
          # A refreshed evidence snapshot may legitimately change the counts.
          assert selected_count == 50
          assert present >= 0 and absent >= 0 and present + absent == selected_count
          assert e["exact_archive_coverage_rows"] == present
          for field in ("archive_score_complete_rows", "archive_settled_status_allowed_rows",
                        "archive_parseable_kickoff_rows", "archive_complete_team_id_rows",
                        "archive_rows_missing_team_names"):
              assert 0 <= e[field] <= archive_rows, (field, e[field], archive_rows)
          assert d["identity_findings"]["provider_parent_competition_ids_populated_by_this_dry_run"] == 0
          assert d["identity_findings"]["parent_ids_inferred_from_season_ids"] is False
          assert d["identity_findings"]["canonical_fixture_team_join_verified"] is False
          assert d["identity_findings"]["settlement_truth_verified"] is False
          assert d["live_ingestion"]["network_calls_made"] == 0
          assert d["live_ingestion"]["paid_provider_calls_made"] == 0
          assert d["live_ingestion"]["minimum_endpoint_calls_if_one_pass"] >= selected_count
          assert d["production_eligible"] is False
          print(f"PASS: {selected_count} groups accounted for ({present} exact manifest matches, {absent} absent); counts internally consistent; no network calls; production blocked.")
          PY
      - name: Reconcile selected-50 archive evidence layers (no network calls)
        run: python scripts/build_selected50_archive_evidence_reconciliation.py
      - name: Test selected-50 archive evidence reconciliation
        run: python tests/test_selected50_archive_evidence_reconciliation.py
      - name: Build latest sanitized private-archive coverage matrix (no network calls)
        run: python scripts/build_selected50_latest_private_archive_coverage.py
      - name: Test latest sanitized private-archive coverage matrix
        run: python tests/test_selected50_latest_private_archive_coverage.py
      - name: Upload dry-run and readiness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-dry-run-plan
          path: audit-output/
          if-no-files-found: error
