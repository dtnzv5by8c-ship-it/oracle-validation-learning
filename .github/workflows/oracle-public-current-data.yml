name: Oracle Public Current Data Execution
# Recovery control: private current-data persistence command repaired 2026-11-13; rerun on public Actions capacity.

on:
  push:
    paths:
      - ".github/workflows/oracle-public-current-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-serialized-evidence-writer
  cancel-in-progress: false

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
      TARGET_REPO: dtnzv5by8c-ship-it/oracle-football-data
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN is missing."; exit 1; }
          test -n "${FOOTYSTATS_API_KEY:-}" || { echo "::error::FOOTYSTATS_API_KEY is missing."; exit 1; }

      - name: Clone private production repository
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone --depth 1 --branch main "https://github.com/${TARGET_REPO}.git" oracle-source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: oracle-source
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Ingest current FootyStats data (PRIMARY)
        working-directory: oracle-source
        run: python scripts/ingest_current_footystats.py

      - name: Reconcile current staging data
        working-directory: oracle-source
        run: python scripts/reconcile_current_data.py

      - name: Reconcile independent current sources
        working-directory: oracle-source
        run: python scripts/reconcile_current_sources.py

      - name: Build current pre-match team state
        working-directory: oracle-source
        run: python scripts/build_current_team_state.py

      - name: Validate current Team-State integrity
        working-directory: oracle-source
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          python - <<'PY'
          import csv, json
          from pathlib import Path
          csv_path=Path("database/current_prematch_team_state.csv")
          manifest=json.loads(Path("data/current_team_state_manifest.json").read_text())
          with csv_path.open(newline="", encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          csv_rows=len(rows)
          manifest_rows=int(manifest.get("rows",-1))
          if csv_rows <= 0:
              raise SystemExit("CURRENT_TEAM_STATE_PERSISTENCE_INVALID: CSV has zero rows")
          if manifest_rows != csv_rows:
              raise SystemExit(f"CURRENT_TEAM_STATE_PERSISTENCE_INVALID: manifest={manifest_rows} csv={csv_rows}")
          print({"status":"PASS","rows":csv_rows})
          PY

      - name: Run current Team-State persistence regression tests
        working-directory: oracle-source
        run: python -m unittest tests/test_current_team_state_persistence.py

      - name: Build prediction-engine Team-State compatibility view
        working-directory: oracle-source
        run: python scripts/build_prediction_team_state_compatibility.py

      - name: Check model readiness
        working-directory: oracle-source
        run: python scripts/check_model_readiness.py

      - name: Build Team DNA intelligence
        working-directory: oracle-source
        run: mkdir -p data && python scripts/build_team_dna.py database/matches.csv database/one_up_truth.csv data/current_team_dna.csv

      - name: Build current OTMS diagnostic layer
        working-directory: oracle-source
        run: python research/otms/build_current_otms.py

      - name: Validate tooling
        working-directory: oracle-source
        run: |
          python -m py_compile scripts/build_team_dna.py scripts/build_fixture_dynamics.py scripts/build_model_interaction.py scripts/publish_prediction_run.py scripts/classify_misses.py scripts/validate_prediction_run.py scripts/settle_prediction_run.py scripts/feed_learning_ledgers.py scripts/update_learning_ledgers.py scripts/probability_calibration_engine.py scripts/team_prediction_behaviour_engine.py
          python -m py_compile scripts/publish_prediction_run.py scripts/classify_misses.py scripts/validate_prediction_run.py scripts/settle_prediction_run.py

      - name: Persist validated current state to private production branch
        working-directory: oracle-source
        run: |
          set -euo pipefail
          required_files=(
            database/current_matches.csv
            database/current_goal_events.csv
            database/current_source_reconciliation.csv
            database/current_prematch_team_state.csv
            research/otms/outputs/current_otms.csv
            data/current_source_manifest.json
            data/current_reconciliation_status.json
            data/source_reconciliation_manifest.json
            data/current_team_state_manifest.json
            data/model_readiness.json
            data/current_otms_manifest.json
            data/four_model_readiness.json
          )
          for path in "${required_files[@]}"; do
            test -f "${path}" || { echo "::error::PERSIST_INPUT_MISSING=${path}"; exit 1; }
          done

          test -s database/current_prematch_team_state.csv
          TEAM_STATE_SIZE="$(wc -c < database/current_prematch_team_state.csv)"
          TEAM_STATE_SHA256="$(sha256sum database/current_prematch_team_state.csv | awk '{print $1}')"
          TEAM_STATE_ROWS="$(tail -n +2 database/current_prematch_team_state.csv | wc -l)"
          MANIFEST_ROWS="$(python -c 'import json; print(json.load(open("data/current_team_state_manifest.json"))["rows"])')"
          test "${TEAM_STATE_ROWS}" = "${MANIFEST_ROWS}" || { echo "::error::MANIFEST_CSV_ROW_MISMATCH"; exit 1; }

          PERSIST_BRANCH="oracle/current-state/public-run-${GITHUB_RUN_ID}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git fetch --no-tags origin main
          git switch --create "${PERSIST_BRANCH}"
          # Clear any stale assume-unchanged/skip-worktree bit on the generated Team State file.
          git update-index --no-assume-unchanged --no-skip-worktree database/current_prematch_team_state.csv
          git ls-files -v database/current_prematch_team_state.csv

          git add "${required_files[@]}"
          git add -f database/current_prematch_team_state.csv

          # Critical large-file-safe index verification: prove the staged blob is the generated non-empty artifact.
          INDEX_SIZE="$(git cat-file -s :database/current_prematch_team_state.csv)"
          INDEX_SHA1="$(git rev-parse :database/current_prematch_team_state.csv)"
          WORKTREE_SHA1="$(git hash-object database/current_prematch_team_state.csv)"
          test "${INDEX_SIZE}" = "${TEAM_STATE_SIZE}" || { echo "::error::STAGED_BLOB_SIZE_MISMATCH index=${INDEX_SIZE} worktree=${TEAM_STATE_SIZE}"; exit 1; }
          test "${INDEX_SHA1}" = "${WORKTREE_SHA1}" || { echo "::error::STAGED_BLOB_HASH_MISMATCH index=${INDEX_SHA1} worktree=${WORKTREE_SHA1}"; exit 1; }
          test "${INDEX_SIZE}" -gt 0 || { echo "::error::STAGED_TEAM_STATE_BLOB_EMPTY"; exit 1; }

          git config user.name "oracle-public-current-data-bot"
          git config user.email "oracle-public-current-data-bot@users.noreply.github.com"
          git commit -m "Persist validated current Team State from public runner"

          git push --set-upstream origin "${PERSIST_BRANCH}"

          git fetch --no-tags origin "+refs/heads/${PERSIST_BRANCH}:refs/remotes/origin/${PERSIST_BRANCH}"
          REMOTE_SIZE="$(git cat-file -s "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv")"
          REMOTE_SHA1="$(git rev-parse "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv")"
          test "${REMOTE_SIZE}" = "${TEAM_STATE_SIZE}" || { echo "::error::REMOTE_BLOB_SIZE_MISMATCH"; exit 1; }
          test "${REMOTE_SHA1}" = "${WORKTREE_SHA1}" || { echo "::error::REMOTE_BLOB_HASH_MISMATCH"; exit 1; }

          echo "PERSIST_BRANCH=${PERSIST_BRANCH}" >> "$GITHUB_ENV"
          echo "TEAM_STATE_SIZE=${TEAM_STATE_SIZE}" >> "$GITHUB_ENV"
          echo "TEAM_STATE_SHA256=${TEAM_STATE_SHA256}" >> "$GITHUB_ENV"
          echo "TEAM_STATE_ROWS=${TEAM_STATE_ROWS}" >> "$GITHUB_ENV"
          echo "PERSISTENCE_BRANCH_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Create or reuse persistence PR
        working-directory: oracle-source
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "${TARGET_REPO}" --head "${PERSIST_BRANCH}" --state open --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            echo "PERSIST_PR=${existing}" >> "$GITHUB_ENV"
            exit 0
          fi
          pr_url="$(gh pr create --repo "${TARGET_REPO}" --base main --head "${PERSIST_BRANCH}"             --title "Persist validated current Team State from public runner"             --body "Validated current-state persistence. Rows=${TEAM_STATE_ROWS}; bytes=${TEAM_STATE_SIZE}; SHA256=${TEAM_STATE_SHA256}; staged and remote Git blob parity verified before PR creation. Oracle V1.6 production logic unchanged.")"
          pr_number="${pr_url##*/}"
          echo "PERSIST_PR=${pr_number}" >> "$GITHUB_ENV"
          echo "PERSIST_PR_URL=${pr_url}" >> "$GITHUB_ENV"

      - name: Record validated persistence evidence
        working-directory: oracle-source
        run: |
          set -euo pipefail
          echo "PERSISTENCE_SOURCE_VALID=true"
          echo "PERSISTENCE_BRANCH_VERIFIED=${PERSISTENCE_BRANCH_VERIFIED:-false}"
          echo "PERSIST_PR=${PERSIST_PR:-unknown}"
          echo "CURRENT_TEAM_STATE_SIZE=${TEAM_STATE_SIZE}"
          echo "CURRENT_TEAM_STATE_SHA256=${TEAM_STATE_SHA256}"
          echo "CURRENT_TEAM_STATE_ROWS=${TEAM_STATE_ROWS}"

      - name: Upload validated recovery bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-current-state-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            oracle-source/database/current_matches.csv
            oracle-source/database/current_goal_events.csv
            oracle-source/database/current_prematch_team_state.csv
            oracle-source/database/current_source_reconciliation.csv
            oracle-source/research/otms/outputs/current_otms.csv
            oracle-source/data/current_source_manifest.json
            oracle-source/data/current_reconciliation_status.json
            oracle-source/data/source_reconciliation_manifest.json
            oracle-source/data/current_team_state_manifest.json
            oracle-source/data/model_readiness.json
            oracle-source/data/current_otms_manifest.json
            oracle-source/data/four_model_readiness.json


      - name: Record validated persistence evidence
        working-directory: oracle-source
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          TEAM_STATE_SIZE="$(wc -c < database/current_prematch_team_state.csv)"
          TEAM_STATE_SHA256="$(sha256sum database/current_prematch_team_state.csv | awk '{print $1}')"
          TEAM_STATE_ROWS="$(tail -n +2 database/current_prematch_team_state.csv | wc -l)"
          MANIFEST_ROWS="$(python -c 'import json; print(json.load(open("data/current_team_state_manifest.json"))["rows"])')"
          test "${TEAM_STATE_ROWS}" = "${MANIFEST_ROWS}"
          echo "CURRENT_TEAM_STATE_SIZE=${TEAM_STATE_SIZE}"
          echo "CURRENT_TEAM_STATE_SHA256=${TEAM_STATE_SHA256}"
          echo "CURRENT_TEAM_STATE_ROWS=${TEAM_STATE_ROWS}"
          echo "PERSISTENCE_SOURCE_VALID=true"

