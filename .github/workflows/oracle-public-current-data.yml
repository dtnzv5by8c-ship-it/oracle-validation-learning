name: Oracle Public Current Data Execution
# Recovery control: current-state date provenance repair applied 2026-11-13; run on public Actions capacity.

# Trigger checkpoint: current-data consumer runs after the :15 rolling-spine producer; exact-spine/hash gates remain fail-closed.
# 2026-11-27 08:24 SAST: rerun after exact FootyStats provider-ID Team State rebuild and regression hardening.
on:
  push:
    paths:
      - ".github/workflows/oracle-public-current-data.yml"
      - "data/fixtures/governed_50league_current.csv"
      - "data/fixtures/governed_50league_current_manifest.json"
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-serialized-evidence-writer
  cancel-in-progress: false

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
      TARGET_REPO: dtnzv5by8c-ship-it/oracle-football-data
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN is missing."; exit 1; }
          test -n "${FOOTYSTATS_API_KEY:-}" || { echo "::error::FOOTYSTATS_API_KEY is missing."; exit 1; }

      - name: Clone private production repository
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone --depth 1 --branch main "https://github.com/${TARGET_REPO}.git" oracle-source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: oracle-source
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn

      - name: Ingest current FootyStats data (PRIMARY)
        working-directory: oracle-source
        run: python scripts/ingest_current_footystats.py

      - name: Reconcile current staging data
        working-directory: oracle-source
        run: python scripts/reconcile_current_data.py

      - name: Fail closed if reconciliation spine snapshot differs from live rolling spine
        working-directory: oracle-source
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, urllib.request, hashlib
          from pathlib import Path
          url="https://raw.githubusercontent.com/dtnzv5by8c-ship-it/oracle-validation-learning/main/data/fixtures/governed_50league_current.csv"
          manifest_url="https://raw.githubusercontent.com/dtnzv5by8c-ship-it/oracle-validation-learning/main/data/fixtures/governed_50league_current_manifest.json"
          req=urllib.request.Request(url, headers={"User-Agent":"Oracle-Public-Current-Data/1.0","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw=r.read()
          with urllib.request.urlopen(urllib.request.Request(manifest_url,headers={"User-Agent":"Oracle-Public-Current-Data/1.0","Cache-Control":"no-cache"}), timeout=60) as r:
              manifest=json.loads(r.read().decode("utf-8"))
          live=list(csv.DictReader(raw.decode("utf-8-sig").splitlines()))
          status=json.loads(Path("data/current_reconciliation_status.json").read_text())
          reported=int(status.get("governed_upcoming_spine_rows") or 0)
          live_ids=sorted({str(x.get("fixture_id") or "").strip() for x in live if str(x.get("fixture_id") or "").strip()})
          live_n=len(live_ids)
          live_sha=hashlib.sha256(raw).hexdigest()
          live_ids_sha=hashlib.sha256("\n".join(live_ids).encode("utf-8")).hexdigest()
          if reported != live_n:
              raise SystemExit(f"CURRENT_RECONCILIATION_SNAPSHOT_MISMATCH: reported={reported} live={live_n}")
          # The reconciliation status contract historically did not persist the two
          # rolling-spine hashes. Do not invent or require absent fields: derive the
          # hashes from the exact live spine and persist them in the gate log instead.
          # Identity/timestamp parity is still fail-closed.
          # The current-source manifest timestamp and rolling-spine manifest timestamp
          # are intentionally different clocks. The prior gate incorrectly compared them,
          # causing false failures whenever the rolling 50-league spine refreshed before
          # the current-source reconciliation completed. Compare the persisted rolling
          # spine hashes instead: this proves exact fixture identity without coupling
          # independent generation timestamps.
          if status.get("rolling_spine_sha256") != live_sha:
              raise SystemExit("CURRENT_RECONCILIATION_ROLLING_SPINE_HASH_DRIFT")
          if status.get("rolling_spine_fixture_ids_sha256") != live_ids_sha:
              raise SystemExit("CURRENT_RECONCILIATION_ROLLING_SPINE_ID_HASH_DRIFT")
          if manifest.get("fixture_rows") != live_n:
              raise SystemExit(f"CURRENT_RECONCILIATION_MANIFEST_ROW_DRIFT: manifest={manifest.get('fixture_rows')} live={live_n}")
          if int(manifest.get("unique_provider_fixture_ids") or 0) != live_n:
              raise SystemExit("CURRENT_RECONCILIATION_MANIFEST_ID_COUNT_DRIFT")
          if status.get("status") != "CURRENT":
              raise SystemExit(f"CURRENT_RECONCILIATION_NOT_CURRENT: {status.get('status')}")
          if float(status.get("governed_upcoming_spine_coverage") or 0) != 1.0:
              raise SystemExit(f"CURRENT_RECONCILIATION_COVERAGE_NOT_100: {status.get('governed_upcoming_spine_coverage')}")
          print({"status":"PASS","live_spine_rows":live_n,"coverage":status.get("governed_upcoming_spine_coverage"),"spine_sha256":live_sha})
          PY

      - name: Reconcile independent current sources
        working-directory: oracle-source
        run: python scripts/reconcile_current_sources.py


      - name: Build current pre-match team state
        working-directory: oracle-source
        run: python scripts/build_current_team_state.py

      - name: Validate current Team-State integrity
        working-directory: oracle-source
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          python - <<'PY'
          import csv, json
          from pathlib import Path
          csv_path=Path("database/current_prematch_team_state.csv")
          manifest=json.loads(Path("data/current_team_state_manifest.json").read_text())
          with csv_path.open(newline="", encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          csv_rows=len(rows)
          manifest_rows=int(manifest.get("rows",-1))
          if csv_rows <= 0:
              raise SystemExit("CURRENT_TEAM_STATE_PERSISTENCE_INVALID: CSV has zero rows")
          if manifest_rows != csv_rows:
              raise SystemExit(f"CURRENT_TEAM_STATE_PERSISTENCE_INVALID: manifest={manifest_rows} csv={csv_rows}")
          print({"status":"PASS","rows":csv_rows})
          PY

      - name: Run current Team-State persistence regression tests
        working-directory: oracle-source
        run: python -m unittest tests/test_current_team_state_persistence.py

      - name: Validate current Team-State prediction namespace
        working-directory: oracle-source
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("database/current_prematch_team_state.csv")
          with p.open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          if not rows:
              raise SystemExit("CURRENT_TEAM_STATE_NAMESPACE_BLOCKED_EMPTY")
          missing=[r.get("fixture_id","") for r in rows if not str(r.get("league_code") or "").strip()]
          if missing:
              raise SystemExit(f"CURRENT_TEAM_STATE_NAMESPACE_BLOCKED_MISSING_LEAGUE_CODE count={len(missing)}")
          print({"status":"PASS","rows":len(rows),"league_namespace_complete":True})
          PY
          python -m unittest tests/test_current_team_state_exact_identity.py

      - name: Build prediction-engine Team-State compatibility view
        working-directory: oracle-source
        run: python scripts/build_prediction_team_state_compatibility.py

      - name: Check model readiness
        working-directory: oracle-source
        run: python scripts/check_model_readiness.py

      - name: Build Team DNA intelligence
        working-directory: oracle-source
        run: mkdir -p data && python scripts/build_team_dna.py database/matches.csv database/one_up_truth.csv data/current_team_dna.csv

      - name: Build current OTMS diagnostic layer
        working-directory: oracle-source
        run: python research/otms/build_current_otms.py

      - name: Validate tooling
        working-directory: oracle-source
        run: |
          python -m py_compile scripts/build_team_dna.py scripts/build_fixture_dynamics.py scripts/build_model_interaction.py scripts/publish_prediction_run.py scripts/classify_misses.py scripts/validate_prediction_run.py scripts/settle_prediction_run.py scripts/feed_learning_ledgers.py scripts/update_learning_ledgers.py scripts/probability_calibration_engine.py scripts/team_prediction_behaviour_engine.py
          python -m py_compile scripts/publish_prediction_run.py scripts/classify_misses.py scripts/validate_prediction_run.py scripts/settle_prediction_run.py

      - name: Run exact-identity and current-spine regression gates
        working-directory: oracle-source
        run: python -m unittest tests/test_exact_identity_regression.py

      - name: Persist validated current state to private production branch
        working-directory: oracle-source
        run: |
          set -euo pipefail
          required_files=(
            database/current_matches.csv
            database/current_goal_events.csv
            database/current_source_reconciliation.csv
            database/current_prematch_team_state.csv
            research/otms/outputs/current_otms.csv
            data/current_source_manifest.json
            data/current_reconciliation_status.json
            data/source_reconciliation_manifest.json
            data/current_team_state_manifest.json
            data/model_readiness.json
            data/current_otms_manifest.json
            data/four_model_readiness.json
          )
          for path in "${required_files[@]}"; do
            test -f "${path}" || { echo "::error::PERSIST_INPUT_MISSING=${path}"; exit 1; }
          done

          test -s database/current_prematch_team_state.csv
          TEAM_STATE_SIZE="$(wc -c < database/current_prematch_team_state.csv)"
          TEAM_STATE_SHA256="$(sha256sum database/current_prematch_team_state.csv | awk '{print $1}')"
          TEAM_STATE_ROWS="$(tail -n +2 database/current_prematch_team_state.csv | wc -l)"
          MANIFEST_ROWS="$(python -c 'import json; print(json.load(open("data/current_team_state_manifest.json"))["rows"])')"
          test "${TEAM_STATE_ROWS}" = "${MANIFEST_ROWS}" || { echo "::error::MANIFEST_CSV_ROW_MISMATCH"; exit 1; }

          PERSIST_BRANCH="oracle/current-state/public-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git fetch --no-tags origin main
          git switch --create "${PERSIST_BRANCH}"
          # Clear any stale assume-unchanged/skip-worktree bit on the generated Team State file.
          git update-index --no-assume-unchanged --no-skip-worktree database/current_prematch_team_state.csv
          git ls-files -v database/current_prematch_team_state.csv

          git add "${required_files[@]}"
          git add -f database/current_prematch_team_state.csv

          # Critical large-file-safe index verification: prove the staged blob is the generated non-empty artifact.
          INDEX_SIZE="$(git cat-file -s :database/current_prematch_team_state.csv)"
          INDEX_SHA1="$(git rev-parse :database/current_prematch_team_state.csv)"
          WORKTREE_SHA1="$(git hash-object database/current_prematch_team_state.csv)"
          test "${INDEX_SIZE}" = "${TEAM_STATE_SIZE}" || { echo "::error::STAGED_BLOB_SIZE_MISMATCH index=${INDEX_SIZE} worktree=${TEAM_STATE_SIZE}"; exit 1; }
          test "${INDEX_SHA1}" = "${WORKTREE_SHA1}" || { echo "::error::STAGED_BLOB_HASH_MISMATCH index=${INDEX_SHA1} worktree=${WORKTREE_SHA1}"; exit 1; }
          test "${INDEX_SIZE}" -gt 0 || { echo "::error::STAGED_TEAM_STATE_BLOB_EMPTY"; exit 1; }

          git config user.name "oracle-public-current-data-bot"
          git config user.email "oracle-public-current-data-bot@users.noreply.github.com"
          git commit -m "Persist validated current Team State from public runner"

          git push --set-upstream origin "${PERSIST_BRANCH}"

          git fetch --no-tags origin "+refs/heads/${PERSIST_BRANCH}:refs/remotes/origin/${PERSIST_BRANCH}"
          REMOTE_SIZE="$(git cat-file -s "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv")"
          REMOTE_SHA1="$(git rev-parse "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv")"
          test "${REMOTE_SIZE}" = "${TEAM_STATE_SIZE}" || { echo "::error::REMOTE_BLOB_SIZE_MISMATCH"; exit 1; }
          test "${REMOTE_SHA1}" = "${WORKTREE_SHA1}" || { echo "::error::REMOTE_BLOB_HASH_MISMATCH"; exit 1; }

          echo "PERSIST_BRANCH=${PERSIST_BRANCH}" >> "$GITHUB_ENV"
          echo "TEAM_STATE_SIZE=${TEAM_STATE_SIZE}" >> "$GITHUB_ENV"
          echo "TEAM_STATE_SHA256=${TEAM_STATE_SHA256}" >> "$GITHUB_ENV"
          echo "TEAM_STATE_ROWS=${TEAM_STATE_ROWS}" >> "$GITHUB_ENV"
          echo "PERSISTENCE_BRANCH_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Build authoritative current prediction ledger from governed rolling spine
        working-directory: oracle-source
        run: |
          set -euo pipefail
          mkdir -p data/fixtures research/four_model/outputs
          python - <<'PY'
          import csv, urllib.request
          from pathlib import Path
          url="https://raw.githubusercontent.com/dtnzv5by8c-ship-it/oracle-validation-learning/main/data/fixtures/governed_50league_current.csv"
          req=urllib.request.Request(url,headers={"User-Agent":"Oracle-Public-Current-Data/1.0","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=60) as r:
              Path("data/fixtures/governed_50league_current.csv").write_bytes(r.read())
          with Path("data/fixtures/governed_50league_current.csv").open(newline="",encoding="utf-8-sig") as f:
              rows=list(csv.DictReader(f))
          if not rows:
              raise SystemExit("CURRENT_LEDGER_BLOCKED_EMPTY_ROLLING_SPINE")
          ids=[str(x.get("fixture_id") or "").strip() for x in rows]
          if any(not x for x in ids) or len(ids)!=len(set(ids)):
              raise SystemExit("CURRENT_LEDGER_BLOCKED_FIXTURE_IDENTITY_INVALID")
          print({"rolling_fixture_rows":len(rows),"unique_fixture_ids":len(set(ids))})
          PY
          python scripts/oracle_four_model_predict.py data/fixtures/governed_50league_current.csv research/four_model/outputs/omi_prediction_ledger_current.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          fx=list(csv.DictReader(Path("data/fixtures/governed_50league_current.csv").open(newline="",encoding="utf-8-sig")))
          led=list(csv.DictReader(Path("research/four_model/outputs/omi_prediction_ledger_current.csv").open(newline="",encoding="utf-8")))
          fx_ids=[str(r.get("fixture_id") or "").strip() for r in fx]
          led_ids=[str(r.get("fixture_id") or "").strip() for r in led]
          if len(fx) != len(led):
              raise SystemExit(f"CURRENT_LEDGER_ROW_PARITY_FAIL fixtures={len(fx)} ledger={len(led)}")
          if any(not x for x in fx_ids) or len(set(fx_ids)) != len(fx_ids):
              raise SystemExit("CURRENT_LEDGER_GOVERNED_FIXTURE_IDS_INVALID")
          if any(not x for x in led_ids) or len(set(led_ids)) != len(led_ids):
              raise SystemExit("CURRENT_LEDGER_OUTPUT_FIXTURE_IDS_INVALID")
          if set(fx_ids) != set(led_ids):
              missing=sorted(set(fx_ids)-set(led_ids))
              extra=sorted(set(led_ids)-set(fx_ids))
              raise SystemExit(f"CURRENT_LEDGER_EXACT_FIXTURE_ID_SET_FAIL missing={missing[:10]} extra={extra[:10]}")
          print({"status":"PASS","rows":len(led),"exact_fixture_id_set":True})
          PY
      - name: Publish current prediction ledger when authoritative private production output exists
        working-directory: oracle-source
        env:
          PUBLIC_REPO: ${{ github.repository }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LEDGER="research/four_model/outputs/omi_prediction_ledger_current.csv"
          if [ ! -s "$LEDGER" ]; then
            echo "CURRENT_PREDICTION_LEDGER_NOT_YET_AVAILABLE=true"
            exit 0
          fi
          cd ..
          rm -rf public-ledger
          git clone --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPO}.git" public-ledger
          mkdir -p public-ledger/research/four_model/outputs
          cp "oracle-source/${LEDGER}" "public-ledger/${LEDGER}"
          cd public-ledger
          git config user.name "oracle-public-current-data-bot"
          git config user.email "oracle-public-current-data-bot@users.noreply.github.com"
          git add "${LEDGER}"
          if git diff --cached --quiet; then
            echo "No current prediction ledger changes to persist."
            exit 0
          fi
          git commit -m "Publish authoritative current prediction ledger"
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "CURRENT_PREDICTION_LEDGER_PERSISTED=true"

      - name: Publish validated current-state bundle to public governed repository
        working-directory: oracle-source
        env:
          PUBLIC_REPO: ${{ github.repository }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${PUBLIC_REPO:-}"
          test -n "${PUBLIC_TOKEN:-}"
          required_public_files=(
            database/current_matches.csv
            database/current_goal_events.csv
            database/current_prematch_team_state.csv
            database/current_source_reconciliation.csv
            research/otms/outputs/current_otms.csv
            data/current_source_manifest.json
            data/current_reconciliation_status.json
            data/source_reconciliation_manifest.json
            data/current_team_state_manifest.json
            data/model_readiness.json
            data/current_otms_manifest.json
            data/four_model_readiness.json
          )
          for path in "${required_public_files[@]}"; do
            test -f "${path}" || { echo "::error::PUBLIC_PERSIST_INPUT_MISSING=${path}"; exit 1; }
          done
          cd ..
          rm -rf public-governed
          git clone --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPO}.git" public-governed
          for path in "${required_public_files[@]}"; do
            mkdir -p "public-governed/$(dirname "${path}")"
            cp "oracle-source/${path}" "public-governed/${path}"
          done
          cd public-governed
          git config user.name "oracle-public-current-data-bot"
          git config user.email "oracle-public-current-data-bot@users.noreply.github.com"
          git add "${required_public_files[@]}"
          if git diff --cached --quiet; then
            echo "No public current-state changes to persist."
            exit 0
          fi
          git commit -m "Publish validated current-state bundle"
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "PUBLIC_CURRENT_STATE_PERSISTED=true"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::PUBLIC_CURRENT_STATE_PERSIST_FAILED"
              exit 1
            fi
            git rebase --abort || true
            sleep 2
          done

      - name: Handoff validated persistence branch to serialized completion controller
        run: |
          set -euo pipefail
          echo "Validated branch is ready for connector-controlled PR/merge."
          echo "PERSIST_BRANCH=${PERSIST_BRANCH}"
          echo "TEAM_STATE_SIZE=${TEAM_STATE_SIZE}"
          echo "TEAM_STATE_SHA256=${TEAM_STATE_SHA256}"
          echo "TEAM_STATE_ROWS=${TEAM_STATE_ROWS}"

      - name: Record validated persistence evidence
        working-directory: oracle-source
        run: |
          set -euo pipefail
          echo "PERSISTENCE_SOURCE_VALID=true"
          echo "PERSISTENCE_BRANCH_VERIFIED=${PERSISTENCE_BRANCH_VERIFIED:-false}"
          echo "PERSIST_PR=${PERSIST_PR:-unknown}"
          echo "CURRENT_TEAM_STATE_SIZE=${TEAM_STATE_SIZE}"
          echo "CURRENT_TEAM_STATE_SHA256=${TEAM_STATE_SHA256}"
          echo "CURRENT_TEAM_STATE_ROWS=${TEAM_STATE_ROWS}"

      - name: Upload validated recovery bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-current-state-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            oracle-source/database/current_matches.csv
            oracle-source/database/current_goal_events.csv
            oracle-source/database/current_prematch_team_state.csv
            oracle-source/database/current_source_reconciliation.csv
            oracle-source/research/otms/outputs/current_otms.csv
            oracle-source/data/current_source_manifest.json
            oracle-source/data/current_reconciliation_status.json
            oracle-source/data/source_reconciliation_manifest.json
            oracle-source/data/current_team_state_manifest.json
            oracle-source/data/model_readiness.json
            oracle-source/data/current_otms_manifest.json
            oracle-source/data/four_model_readiness.json


      - name: Record validated persistence evidence
        working-directory: oracle-source
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          TEAM_STATE_SIZE="$(wc -c < database/current_prematch_team_state.csv)"
          TEAM_STATE_SHA256="$(sha256sum database/current_prematch_team_state.csv | awk '{print $1}')"
          TEAM_STATE_ROWS="$(tail -n +2 database/current_prematch_team_state.csv | wc -l)"
          MANIFEST_ROWS="$(python -c 'import json; print(json.load(open("data/current_team_state_manifest.json"))["rows"])')"
          test "${TEAM_STATE_ROWS}" = "${MANIFEST_ROWS}"
          echo "CURRENT_TEAM_STATE_SIZE=${TEAM_STATE_SIZE}"
          echo "CURRENT_TEAM_STATE_SHA256=${TEAM_STATE_SHA256}"
          echo "CURRENT_TEAM_STATE_ROWS=${TEAM_STATE_ROWS}"
          echo "PERSISTENCE_SOURCE_VALID=true"

# Trigger checkpoint: compatibility league-code preservation fix 0e3ac00.

# Trigger checkpoint: consume post-21:49 durable Team-State restoration and refresh current FootyStats state before the next serialized prospective admission pass.
# 2026-11-26 23:42 SAST: fresh current-data reconciliation cycle after rolling-spine remediation; no production model logic change.

# 2026-11-27 03:30 SAST: fail closed on any lag between reconciliation snapshot and the live rolling 50-league spine.
