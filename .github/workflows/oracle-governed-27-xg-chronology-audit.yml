name: Oracle governed 27 xG and chronology audit — report only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-governed-27-xg-chronology-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download existing private historical archive
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN is missing."; exit 1; }
          gh release download footystats-all-selected-leagues-2024-2026-20261021 --repo dtnzv5by8c-ship-it/oracle-football-data --pattern 'oracle-footystats-all-selected-leagues-2024-2026.zip' --dir .
          unzip -q oracle-footystats-all-selected-leagues-2024-2026.zip -d input

      - name: Validate xG field shape, chronology, status and season coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,csv,collections,datetime,math
          from pathlib import Path
          root=Path("input"); mf=next(root.rglob("ingestion_manifest.csv"),None)
          if not mf: raise SystemExit("ingestion manifest missing")
          base=mf.parent
          registry=[
          ("ENG_E0","England_Premier_League"),("ENG_E1","England_Championship"),("ENG_E2","England_EFL_League_One"),("ENG_E3","England_EFL_League_Two"),
          ("ESP_SP1","Spain_La_Liga"),("ESP_SP2","Spain_Segunda_Divisi_n","Spain_Segunda_Division"),("DEU_D1","Germany_Bundesliga"),("DEU_D2","Germany_2._Bundesliga","Germany_2_Bundesliga"),
          ("ITA_I1","Italy_Serie_A"),("ITA_I2","Italy_Serie_B"),("FRA_F1","France_Ligue_1"),("FRA_F2","France_Ligue_2"),
          ("NLD_N1","Netherlands_Eredivisie"),("NLD_N2","Netherlands_Eerste_Divisie"),("PRT_P1","Portugal_Liga_NOS","Portugal_Primeira_Liga"),("PRT_P2","Portugal_LigaPro","Portugal_Liga_Pro"),
          ("TUR_T1","Turkey_S_per_Lig","Turkey_Super_Lig"),("BEL_B1","Belgium_Pro_League"),("SCO_SC0","Scotland_Premiership"),("AUT_A1","Austria_Bundesliga"),("CHE_S1","Switzerland_Super_League"),
          ("POL_P1","Poland_Ekstraklasa"),("ROU_R1","Romania_Liga_I"),("CZE_CZ1","Czech_Republic_First_League"),("HRV_HR1","Croatia_Prva_HNL"),("UKR_UA1","Ukraine_Ukrainian_Premier_League"),("ZAF_PSL","South_Africa_Premier_Soccer_League")]
          alias={a:(lid,als) for lid,*als in registry for a in als}
          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          def epoch(v):
            try:
              n=float(v); n=n/1000 if n>1e12 else n
              return int(n) if n>0 else None
            except:return None
          def num(v):
            try:
              n=float(v)
              return n if math.isfinite(n) and n>=0 else None
            except:return None
          by_league=collections.defaultdict(collections.Counter); by_season=collections.defaultdict(collections.Counter)
          errors=[]; nfiles=0; allrows=0
          for fp in base.rglob("matches.json"):
            folder=fp.parent.parent.name
            if folder not in alias: continue
            lid,_=alias[folder]; nfiles+=1
            try: data=json.loads(fp.read_text(encoding="utf-8"))
            except Exception as e: errors.append({"file":str(fp.relative_to(base)),"error":type(e).__name__});continue
            if not isinstance(data,list):errors.append({"file":str(fp.relative_to(base)),"error":"not_list"});continue
            for m in data:
              if not isinstance(m,dict): continue
              allrows+=1; c=by_league[lid]; season=str(m.get("season","unknown")); sc=by_season[(lid,season)]
              c["rows"]+=1; sc["rows"]+=1
              dt=epoch(m.get("date_unix") or m.get("date") or m.get("kickoff"))
              future=dt is not None and dt>now
              c["future_rows"]+=int(future);sc["future_rows"]+=int(future)
              status=str(m.get("status","")).lower(); c["status:"+status]+=1;sc["status:"+status]+=1
              if status in ("complete","completed","finished","ft","full time"):c["complete_status"]+=1;sc["complete_status"]+=1
              fields=("team_a_xg_prematch","team_b_xg_prematch","total_xg_prematch","team_a_xg","team_b_xg","total_xg")
              for field in fields:
                value=num(m.get(field))
                if value is not None:
                  c[field+"_valid"]+=1;sc[field+"_valid"]+=1
                  c[field+"_sum"]+=value;sc[field+"_sum"]+=value
                  c[field+"_zero"]+=int(value==0);sc[field+"_zero"]+=int(value==0)
                  if future and field in ("team_a_xg","team_b_xg","total_xg"):c["future_rows_with_postmatch_xg"]+=1;sc["future_rows_with_postmatch_xg"]+=1
              for field in ("homeGoalCount","awayGoalCount"):
                c[field+"_valid"]+=int(num(m.get(field)) is not None);sc[field+"_valid"]+=int(num(m.get(field)) is not None)
          league_rows=[]
          for lid,*als in registry:
            c=by_league[lid]; n=c["rows"]
            row={"league_id":lid,"records":n,"future_rows":c["future_rows"],"complete_status_rows":c["complete_status"]}
            for f in ("team_a_xg_prematch","team_b_xg_prematch","total_xg_prematch","team_a_xg","team_b_xg","total_xg"):
              row[f+"_valid_pct"]=round(100*c[f+"_valid"]/n,2) if n else None
              row[f+"_zero_count"]=c[f+"_zero"]
              row[f+"_mean_valid"]=round(c[f+"_sum"]/c[f+"_valid"],4) if c[f+"_valid"] else None
            row["future_rows_with_postmatch_xg_field_values"]=c["future_rows_with_postmatch_xg"]
            row["status_counts"]="; ".join(f"{k[7:]}={v}" for k,v in sorted(c.items()) if k.startswith("status:"))
            league_rows.append(row)
          season_rows=[]
          for (lid,season),c in sorted(by_season.items()):
            n=c["rows"]; row={"league_id":lid,"season":season,"records":n,"future_rows":c["future_rows"],"complete_status_rows":c["complete_status"]}
            for f in ("team_a_xg_prematch","team_b_xg_prematch","total_xg_prematch","team_a_xg","team_b_xg","total_xg"):
              row[f+"_valid_pct"]=round(100*c[f+"_valid"]/n,2) if n else None
            season_rows.append(row)
          out=Path("oracle-xg-chronology-audit");out.mkdir()
          for name,rows in (("league_xg_chronology.csv",league_rows),("league_season_coverage.csv",season_rows)):
            with (out/name).open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()) if rows else ["empty"]);w.writeheader();w.writerows(rows)
          summary={"status":"XG_CHRONOLOGY_AUDIT_COMPLETED","governed_leagues":27,"matched_provider_folders":len(by_league),"match_files_read":nfiles,"records":allrows,
            "future_rows":sum(c["future_rows"] for c in by_league.values()),
            "future_rows_with_postmatch_xg_field_values":sum(c["future_rows_with_postmatch_xg"] for c in by_league.values()),
            "errors":errors,"production_readiness":"NOT_ASSESSED",
            "interpretation":"Field presence and populated post-match xG in future-dated rows are diagnostic signals only. No point-in-time provenance is established by this audit; do not use post-match xG as a pre-match feature."}
          (out/"summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          (out/"README.md").write_text("# Oracle xG and chronology audit\n\nRead-only audit of existing archived rows. Distinguishes pre-match-labelled xG fields from actual xG fields, reports values by league and season, and counts future-dated rows that contain post-match xG values. This does not establish when the provider first made a field available. Production readiness remains NOT_ASSESSED.\n",encoding="utf-8")
          print(json.dumps(summary,indent=2))
          if errors: raise SystemExit("Some source files failed parsing; inspect error list.")
          PY

      - name: Publish audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-governed-27-xg-chronology-audit
          path: oracle-xg-chronology-audit/
          if-no-files-found: error
          retention-days: 30
