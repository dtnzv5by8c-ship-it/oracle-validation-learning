name: Oracle Selected-50 Private Archive QA

on:
  workflow_dispatch:
    inputs:
      confirm_private_archive_read:
        description: "Confirm this workflow may read the existing private archive; no provider API calls"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/oracle-selected50-private-archive-qa.yml"
      - "scripts/qa_selected50_private_archive.py"

permissions:
  contents: read

jobs:
  private-archive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit

      - name: Guard private archive access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          CONFIRM_PRIVATE_ARCHIVE_READ: ${{ inputs.confirm_private_archive_read }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${CONFIRM_PRIVATE_ARCHIVE_READ:-false}" == "true" ]] || { echo "::error::Explicit private archive read confirmation required."; exit 1; }
          fi
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN missing."; exit 1; }
          gh auth status

      - name: Download existing private historical archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p private-download
          gh release download research-selected50-footystats-history-40375285207 \
            --repo dtnzv5by8c-ship-it/oracle-football-data \
            --pattern 'oracle-selected50-footystats-private-ingestion.zip' \
            --pattern 'private-package.sha256' \
            --dir private-download
          cd private-download
          sha256sum -c private-package.sha256
          test -s oracle-selected50-footystats-private-ingestion.zip

      - name: Audit private archive without exporting raw provider records
        shell: bash
        env:
          ORACLE_ARCHIVE: private-download/oracle-selected50-footystats-private-ingestion.zip
        run: |
          set -euo pipefail
          python scripts/qa_selected50_private_archive.py

      - name: Upload sanitized QA only
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-private-archive-qa
          path: |
            selected50_archive_qa/selected50_archive_qa.json
            selected50_archive_qa/selected50_season_qa.csv
          if-no-files-found: error
          retention-days: 14
