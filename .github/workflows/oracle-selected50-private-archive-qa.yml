name: Oracle Selected-50 Private Archive QA

on:
  workflow_dispatch:
    inputs:
      confirm_private_archive_read:
        description: "Confirm this workflow may read the existing private archive; no provider API calls"
        required: true
        default: false
        type: boolean
      private_archive_release_tag:
        description: "Existing private archive release tag to audit"
        required: false
        default: research-selected50-footystats-history-40375285207
        type: string
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/oracle-selected50-private-archive-qa.yml"
      - "scripts/qa_selected50_private_archive.py"
      - "tests/test_selected50_private_archive_feature_coverage.py"
      - "scripts/analyze_selected50_league_numeric_missingness.py"
      - "scripts/analyze_selected50_xg_odds_mask_audit.py"
      - "tests/test_selected50_xg_odds_mask_audit.py"
      - "scripts/audit_selected50_xg_odds_temporal_shift.py"
      - "tests/test_selected50_xg_odds_temporal_shift.py"
      - "scripts/audit_selected50_xg_odds_crossscope_reconciliation.py"
      - "tests/test_selected50_xg_odds_crossscope_reconciliation.py"
      - "scripts/audit_selected50_season_event_time_readiness.py"
      - "tests/test_selected50_season_event_time_readiness.py"

permissions:
  contents: read

jobs:
  private-archive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Guard private archive access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          CONFIRM_PRIVATE_ARCHIVE_READ: ${{ inputs.confirm_private_archive_read }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${CONFIRM_PRIVATE_ARCHIVE_READ:-false}" == "true" ]] || { echo "::error::Explicit private archive read confirmation required."; exit 1; }
          fi
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN missing."; exit 1; }
          gh auth status

      - name: Download existing private historical archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          PRIVATE_ARCHIVE_RELEASE_TAG: ${{ inputs.private_archive_release_tag }}
          EXPECTED_PRIVATE_ARCHIVE_SHA256: 7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f
        run: |
          set -euo pipefail
          TAG="${PRIVATE_ARCHIVE_RELEASE_TAG:-research-selected50-footystats-history-40375285207}"
          [[ "$TAG" =~ ^research-selected50-footystats-history-[0-9]+$ ]] || { echo "::error::Invalid private archive tag."; exit 1; }
          echo "Reading existing private archive tag: $TAG"
          mkdir -p private-download
          gh release download "$TAG" \
            --repo dtnzv5by8c-ship-it/oracle-football-data \
            --pattern 'oracle-selected50-footystats-private-ingestion.zip' \
            --pattern 'private-package.sha256' \
            --dir private-download
          cd private-download
          sha256sum -c private-package.sha256
          ACTUAL_PRIVATE_ARCHIVE_SHA256="$(sha256sum oracle-selected50-footystats-private-ingestion.zip | awk '{print $1}')"
          [[ "${ACTUAL_PRIVATE_ARCHIVE_SHA256}" == "${EXPECTED_PRIVATE_ARCHIVE_SHA256}" ]] || { echo "::error::Downloaded archive SHA-256 does not match the pinned Selected-50 research archive."; exit 1; }
          test -s oracle-selected50-footystats-private-ingestion.zip
          echo "ORACLE_ARCHIVE_SOURCE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Audit private archive without exporting raw provider records
        shell: bash
        env:
          ORACLE_ARCHIVE: private-download/oracle-selected50-footystats-private-ingestion.zip
        run: |
          set -euo pipefail
          python scripts/qa_selected50_private_archive.py

      - name: Validate primary-window coverage reconciliation and fail-closed gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          report = json.loads(Path("selected50_archive_qa/selected50_archive_qa.json").read_text(encoding="utf-8"))
          with Path("selected50_archive_qa/selected50_primary_window_coverage.csv").open(encoding="utf-8", newline="") as handle:
              groups = list(csv.DictReader(handle))
          assert report["status"] == "QA_COMPLETE_REVIEW_REQUIRED"
          assert report["primary_window_start"] == "2025-03-20"
          assert report["primary_window_end"] == "2026-09-20"
          total = report["primary_window_archive_match_records"]
          unique_ids = report["primary_window_archive_unique_provider_match_ids"]
          duplicates = report["primary_window_archive_duplicate_provider_match_id_rows_across_seasons"]
          statuses = report["primary_window_provider_status_counts"]
          assert total >= 0 and 0 <= unique_ids <= total
          assert 0 <= duplicates <= total
          assert sum(statuses.values()) == total
          assert sum(report["primary_window_calendar_year_coverage"][year]["archive_match_records"] for year in ("2025", "2026")) == total
          for year in ("2025", "2026"):
              bucket = report["primary_window_calendar_year_coverage"][year]
              assert sum(bucket["provider_status_counts"].values()) == bucket["archive_match_records"]
              assert bucket["unique_provider_match_ids"] <= bucket["archive_match_records"]
          assert report["selected_group_primary_window_coverage_rows"] == 50
          assert report["selected_group_labels_unique"] == 50
          assert report["selected_groups_with_exactly_one_selected_current_season"] == 50
          assert len(groups) == 50
          assert len({(row["country"], row["competition_name"]) for row in groups}) == 50
          assert all(row["selected_current_season_id_count"] == "1" for row in groups)
          assert sum(int(row["primary_window_match_records"]) for row in groups) == total
          assert report["selected_group_primary_window_records_sum"] == total
          assert all(row["provider_parent_competition_id_verified"] == "NO" for row in groups)
          assert all(row["canonical_league_mapping_verified"] == "NO" for row in groups)
          assert all(row["canonical_fixture_team_joins_verified"] == "NO" for row in groups)
          assert all(row["official_settlement_truth_verified"] == "NO" for row in groups)
          assert all(row["production_eligible"] == "NO" for row in groups)
          assert report["primary_window_current_selected_season_folder_match_records"] <= total
          assert report["primary_window_current_selected_season_folder_complete_status_records"] <= report["primary_window_current_selected_season_folder_match_records"]
          assert report["primary_window_noncomplete_status_records_with_zero_zero_score_pair"] <= report["primary_window_noncomplete_status_records_with_parseable_score_pair"]
          assert report["primary_window_coverage_is_canonical_fixture_count"] is False
          assert report["official_settlement_truth_verified"] is False
          assert report["production_eligible"] is False
          print(json.dumps({
              "contract": "PASS_PRIMARY_WINDOW_COVERAGE_RECONCILIATION_RESEARCH_ONLY",
              "primary_window_start": report["primary_window_start"],
              "primary_window_end": report["primary_window_end"],
              "archive_match_records": total,
              "unique_provider_match_ids": unique_ids,
              "duplicate_provider_match_id_rows": duplicates,
              "calendar_2025_records": report["primary_window_calendar_year_coverage"]["2025"]["archive_match_records"],
              "calendar_2026_records": report["primary_window_calendar_year_coverage"]["2026"]["archive_match_records"],
              "production_eligible": False,
              "official_settlement_truth_verified": False
          }, sort_keys=True))
          PY

      - name: Build per-league and per-season numeric missingness audit (offline)
        run: |
          set -euo pipefail
          python scripts/analyze_selected50_league_numeric_missingness.py --input-dir selected50_archive_qa --output-dir selected50_archive_qa/numeric_missingness

      - name: Build prematch xG and market-odds zero-mask investigation (offline)
        run: |
          set -euo pipefail
          python scripts/analyze_selected50_xg_odds_mask_audit.py --input-dir selected50_archive_qa --output-dir selected50_archive_qa/xg_odds_audit

      - name: Build current-versus-historical xG and odds temporal shift audit (offline)
        run: |
          set -euo pipefail
          python scripts/audit_selected50_xg_odds_temporal_shift.py --input-dir selected50_archive_qa --output-dir selected50_archive_qa/xg_temporal_shift

      - name: Build cross-scope xG and odds reconciliation (offline)
        run: |
          set -euo pipefail
          python scripts/audit_selected50_xg_odds_crossscope_reconciliation.py --input-dir selected50_archive_qa --output-dir selected50_archive_qa/xg_crossscope

      - name: Build season event-time and status audit (offline)
        run: |
          set -euo pipefail
          python scripts/audit_selected50_season_event_time_readiness.py --input-dir selected50_archive_qa --output-dir selected50_archive_qa/season_event_time

      - name: Upload sanitized QA only
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-private-archive-qa
          path: |
            selected50_archive_qa/selected50_archive_qa.json
            selected50_archive_qa/selected50_season_qa.csv
            selected50_archive_qa/selected50_primary_window_coverage.csv
            selected50_archive_qa/selected50_feature_coverage.csv
            selected50_archive_qa/selected50_numeric_feature_quality.csv
            selected50_archive_qa/selected50_numeric_feature_quality_by_season.csv
            selected50_archive_qa/selected50_numeric_feature_quality_by_league.csv
            selected50_archive_qa/numeric_missingness/oracle_selected50_league_numeric_missingness_summary.json
            selected50_archive_qa/numeric_missingness/oracle_selected50_league_core_numeric_quality.csv
            selected50_archive_qa/numeric_missingness/oracle_selected50_season_core_numeric_quality.csv
            selected50_archive_qa/xg_odds_audit/oracle_selected50_xg_odds_mask_audit_summary.json
            selected50_archive_qa/xg_odds_audit/oracle_selected50_current_season_prematch_xg_zero_rates.csv
            selected50_archive_qa/xg_odds_audit/oracle_selected50_current_season_xg_zero_mask_pairs.csv
            selected50_archive_qa/xg_odds_audit/oracle_selected50_belgium_odds_season_comparison.csv
            selected50_archive_qa/xg_odds_audit/oracle_selected50_belgium_odds_pair_masks.csv
            selected50_archive_qa/xg_temporal_shift/oracle_selected50_xg_temporal_shift_summary.json
            selected50_archive_qa/xg_temporal_shift/oracle_selected50_xg_current_vs_historical_by_league.csv
            selected50_archive_qa/xg_crossscope/oracle_selected50_xg_odds_crossscope_summary.json
            selected50_archive_qa/xg_crossscope/oracle_selected50_xg_current_vs_noncurrent_all_groups.csv
            selected50_archive_qa/xg_crossscope/oracle_selected50_current_season_market_field_zero_rates.csv
            selected50_archive_qa/xg_crossscope/oracle_selected50_belgium_vs_rest_market_zero_rates.csv
            selected50_archive_qa/selected50_zero_cooccurrence_by_season.csv
            selected50_archive_qa/season_event_time/oracle_selected50_season_event_time_summary.json
            selected50_archive_qa/season_event_time/oracle_selected50_current_season_event_time_coverage.csv
            selected50_archive_qa/season_event_time/oracle_selected50_season_status_anomaly_rollup.csv
          if-no-files-found: error
          retention-days: 14
