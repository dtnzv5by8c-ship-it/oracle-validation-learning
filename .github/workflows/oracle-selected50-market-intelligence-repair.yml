name: Oracle Selected-50 Market Intelligence Report Repair

on:
  workflow_dispatch:
    inputs:
      confirm_private_archive_read:
        description: "Confirm read-only use of the existing pinned private archive; no provider API calls"
        required: true
        default: false
        type: boolean
      private_archive_release_tag:
        description: "Pinned private archive release tag"
        required: true
        default: "research-selected50-footystats-history-40375285207"
        type: string
      runtime_run_id:
        description: "Verified successful Selected-50 runtime run containing the source prediction report"
        required: true
        default: "41175230838"
        type: string

  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/oracle-selected50-market-intelligence-repair.yml"
      - "scripts/build_selected50_market_intelligence_report.py"
      - "scripts/build_selected50_field_coverage_audit.py"
      - "scripts/build_selected50_kickoff_discrepancy_triage.py"
      - "tests/test_selected50_kickoff_discrepancy_triage.py"
      - "scripts/validate_selected50_kickoff_source_evidence.py"
      - "scripts/diagnose_selected50_feature_blockers.py"
      - "tests/test_selected50_feature_blocker_diagnostics.py"
      - "scripts/audit_selected50_row_level_history_provenance.py"
      - "tests/test_selected50_row_level_history_provenance.py"
      - "scripts/audit_footystats_xg_manifest_provenance.py"
      - "tests/test_footystats_xg_manifest_provenance.py"
      - "tests/test_selected50_kickoff_source_evidence.py"
      - "reports/oracle-selected50-kickoff-source-evidence-2026-11-01.csv"
      - "tests/test_selected50_field_coverage_audit.py"
      - "scripts/build_footystats_archive_features.py"\n      - "tests/test_footystats_archive_features.py"
      - "tests/test_selected50_market_intelligence_report.py"
      - "reports/templates/ORACLE_MARKET_INTELLIGENCE_TEMPLATE_V1.md"
      - "reports/templates/ORACLE_MARKET_INTELLIGENCE_TEMPLATE_V1_3.md"
      - "reports/templates/ORACLE_MARKET_INTELLIGENCE_TEMPLATE_V1_4.md"
      - "docs/ORACLE_MASTER_INTELLIGENCE_DATA_DICTIONARY_V1.md"
      - "docs/ORACLE_MASTER_INTELLIGENCE_CONTINUITY_LOCK.md"
      - "scripts/build_goal_market_research_engine.py"
      - "tests/test_goal_market_research_engine.py"
      - "docs/PROJECT_ORACLE_EXECUTION_PROTOCOL.md"
      - "reports/oracle-footystats-max-time-xg-endpoint-scope-2026-11-01.md"
      - "reports/oracle-footystats-xg-point-in-time-capture-spec-2026-11-01.md"
      - "reports/oracle-selected50-footystats-xg-provenance-2026-11-01.md"
      - "reports/oracle-selected50-xg-league-coverage-2026-11-01.csv"
      - "reports/oracle-selected50-cross-sheet-field-coverage-and-xg-provenance-2026-11-01.md"

permissions:
  actions: read
  contents: read

jobs:
  market-intelligence-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout governed research branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enforce branch, explicit archive consent and existing private token
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          CONFIRM_PRIVATE_ARCHIVE_READ: ${{ inputs.confirm_private_archive_read }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "research/oracle-50-league-readiness-audit" ]] || { echo "::error::Run this workflow from the governed research branch only."; exit 1; }
          [[ "$CONFIRM_PRIVATE_ARCHIVE_READ" == "true" ]] || { echo "::error::Explicit read-only archive confirmation required."; exit 1; }
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN is missing."; exit 1; }
          gh auth status

      - name: Download pinned private archive and verify SHA-256
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          PRIVATE_ARCHIVE_RELEASE_TAG: ${{ inputs.private_archive_release_tag }}
          EXPECTED_ARCHIVE_SHA256: 7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f
        run: |
          set -euo pipefail
          [[ "$PRIVATE_ARCHIVE_RELEASE_TAG" == "research-selected50-footystats-history-40375285207" ]] || { echo "::error::Only the pinned Selected-50 archive release is permitted."; exit 1; }
          mkdir -p private-download
          gh release download "$PRIVATE_ARCHIVE_RELEASE_TAG" \
            --repo dtnzv5by8c-ship-it/oracle-football-data \
            --pattern 'oracle-selected50-footystats-private-ingestion.zip' \
            --pattern 'private-package.sha256' \
            --dir private-download
          cd private-download
          sha256sum -c private-package.sha256
          ACTUAL="$(sha256sum oracle-selected50-footystats-private-ingestion.zip | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED_ARCHIVE_SHA256" ]] || { echo "::error::Pinned archive SHA-256 mismatch."; exit 1; }
          echo "PINNED_ARCHIVE_SHA256_VERIFIED=$ACTUAL" >> "$GITHUB_ENV"

      - name: Download exact runtime artifact and verify run, branch, commit and digest
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Runtime run ID must be numeric."; exit 1; }
          mkdir -p runtime-artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID" > runtime-artifact/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUNTIME_RUN_ID/artifacts" > runtime-artifact/artifacts.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id = str(os.environ["RUNTIME_RUN_ID"])
          run = json.loads(Path("runtime-artifact/run.json").read_text())
          if str(run.get("id")) != run_id:
              raise SystemExit("FAIL: runtime run ID mismatch")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("FAIL: source runtime run is not completed successfully")
          if run.get("head_branch") != "research/oracle-50-league-readiness-audit":
              raise SystemExit("FAIL: source runtime did not run on the governed research branch")
          data = json.loads(Path("runtime-artifact/artifacts.json").read_text())
          matches = [a for a in data.get("artifacts", []) if a.get("name") == "oracle-selected50-research-runtime-report"]
          if len(matches) != 1:
              raise SystemExit(f"FAIL: expected one runtime report artifact, found {len(matches)}")
          artifact = matches[0]
          workflow_run = artifact.get("workflow_run") or {}
          if str(workflow_run.get("id")) != run_id or workflow_run.get("head_branch") != run.get("head_branch"):
              raise SystemExit("FAIL: runtime artifact provenance does not match requested run")
          if artifact.get("expired") is not False or not artifact.get("digest", "").startswith("sha256:"):
              raise SystemExit("FAIL: runtime artifact is expired or has no SHA-256 digest")
          Path("runtime-artifact/artifact-metadata.json").write_text(json.dumps({
              "artifact_id": str(artifact["id"]),
              "artifact_name": artifact["name"],
              "artifact_digest": artifact["digest"],
              "run_id": run_id,
              "head_branch": run["head_branch"],
              "head_sha": run["head_sha"],
          }, indent=2) + "\n")
          PY
          python -m json.tool runtime-artifact/artifact-metadata.json > /dev/null
          ARTIFACT_ID="$(python -c 'import json; print(json.load(open("runtime-artifact/artifact-metadata.json"))["artifact_id"])')"
          EXPECTED="$(python -c 'import json; print(json.load(open("runtime-artifact/artifact-metadata.json"))["artifact_digest"].split(":",1)[1].lower())')"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o runtime-artifact/runtime-report.zip
          ACTUAL="$(sha256sum runtime-artifact/runtime-report.zip | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::Runtime artifact ZIP digest mismatch."; exit 1; }
          mkdir -p runtime-artifact/extracted
          unzip -q runtime-artifact/runtime-report.zip -d runtime-artifact/extracted
          test -s runtime-artifact/extracted/oracle_selected50_prediction_report.csv
          test -s runtime-artifact/extracted/oracle_selected50_schedule_coverage.csv
          test -s runtime-artifact/extracted/oracle_selected50_runtime_provenance.json
          test -s runtime-artifact/extracted/current_snapshot_candidate_trace.csv
          test -s runtime-artifact/extracted/oracle_selected50_snapshot_artifact_metadata.json
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root = Path("runtime-artifact/extracted")
          report = root / "oracle_selected50_prediction_report.csv"
          provenance = json.loads((root / "oracle_selected50_runtime_provenance.json").read_text())
          snapshot_meta = json.loads((root / "oracle_selected50_snapshot_artifact_metadata.json").read_text())
          snapshot_trace_path = root / "current_snapshot_candidate_trace.csv"
          run_id = str(os.environ["RUNTIME_RUN_ID"])
          metadata = json.loads(Path("runtime-artifact/artifact-metadata.json").read_text())
          actual_report_sha = hashlib.sha256(report.read_bytes()).hexdigest()
          if str(provenance.get("runtime_run_id")) != run_id:
              raise SystemExit("FAIL: runtime provenance run ID mismatch")
          if provenance.get("runtime_commit_sha") != metadata.get("head_sha"):
              raise SystemExit("FAIL: runtime provenance commit SHA mismatch")
          if provenance.get("runtime_ref") != "refs/heads/research/oracle-50-league-readiness-audit":
              raise SystemExit("FAIL: runtime provenance branch mismatch")
          if provenance.get("source_archive_sha256") != "7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f":
              raise SystemExit("FAIL: runtime source archive SHA does not match pinned archive")
          if provenance.get("runtime_report_sha256") != actual_report_sha:
              raise SystemExit("FAIL: runtime report content SHA mismatch")
          with report.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          with (root / "oracle_selected50_schedule_coverage.csv").open(encoding="utf-8-sig", newline="") as f:
              schedule = list(csv.DictReader(f))
          with snapshot_trace_path.open(encoding="utf-8-sig", newline="") as f:
              snapshot_trace = list(csv.DictReader(f))
          governed_ids = {r.get("selected_id", "").strip() for r in schedule if r.get("selected_id", "").strip()}
          report_ids = {r.get("selected_id", "").strip() for r in rows if r.get("selected_id", "").strip()}
          if len(rows) != 434 or len(schedule) != 50 or len(governed_ids) != 50 or not report_ids.issubset(governed_ids):
              raise SystemExit(f"FAIL: runtime rows/schedule scope mismatch: rows={len(rows)}, schedule_rows={len(schedule)}, unique_governed_ids={len(governed_ids)}, report_ids={len(report_ids)}")
          expected_snapshot_sha = str(provenance.get("snapshot_file_sha256") or "")
          expected_snapshot_time = str(provenance.get("snapshot_retrieved_utc") or "")
          expected_archive_sha = str(provenance.get("source_archive_sha256") or "")
          if str(snapshot_meta.get("artifact_id")) != str(provenance.get("snapshot_artifact_id")):
              raise SystemExit("FAIL: snapshot artifact ID does not match runtime provenance")
          if str(snapshot_meta.get("artifact_workflow_run_id")) != str(provenance.get("snapshot_run_id")):
              raise SystemExit("FAIL: snapshot run ID does not match runtime provenance")
          if str(snapshot_meta.get("artifact_head_branch")) != str(provenance.get("snapshot_artifact_head_branch")):
              raise SystemExit("FAIL: snapshot artifact branch does not match runtime provenance")
          if str(snapshot_meta.get("artifact_head_sha")) != str(provenance.get("snapshot_artifact_head_sha")):
              raise SystemExit("FAIL: snapshot artifact commit does not match runtime provenance")
          if str(snapshot_meta.get("artifact_zip_sha256", "")).removeprefix("sha256:") != str(provenance.get("snapshot_artifact_zip_sha256", "")).removeprefix("sha256:"):
              raise SystemExit("FAIL: snapshot artifact digest does not match runtime provenance")
          if len(snapshot_trace) != int(provenance.get("snapshot_fixture_rows") or -1):
              raise SystemExit("FAIL: snapshot candidate trace row count does not match runtime provenance")
          snapshot_keys = []
          for item in snapshot_trace:
              if item.get("snapshot_file_sha256") != expected_snapshot_sha:
                  raise SystemExit("FAIL: snapshot trace file hash mismatch")
              if item.get("source_archive_sha256") != expected_archive_sha:
                  raise SystemExit("FAIL: snapshot trace archive hash mismatch")
              if item.get("snapshot_retrieved_utc") != expected_snapshot_time:
                  raise SystemExit("FAIL: snapshot trace retrieval time mismatch")
              key = tuple(str(item.get(k) or "").strip() for k in (
                  "selected_season_id", "fixture_id", "home_team_provider_id", "away_team_provider_id"))
              if not all(key):
                  raise SystemExit("FAIL: snapshot candidate trace has an incomplete exact identity")
              snapshot_keys.append(key)
          if len(snapshot_keys) != len(set(snapshot_keys)):
              raise SystemExit("FAIL: duplicate exact identities in snapshot candidate trace")
          runtime_keys = [tuple(str(item.get(k) or "").strip() for k in (
              "selected_id", "fixture_id", "home_team_provider_id", "away_team_provider_id")) for item in rows]
          if len(runtime_keys) != len(set(runtime_keys)) or not set(runtime_keys).issubset(set(snapshot_keys)):
              raise SystemExit("FAIL: runtime fixtures do not have exact ordered-ID snapshot trace matches")
          runtime_key_set = set(runtime_keys)
          runtime_snapshot = [item for item in snapshot_trace if tuple(str(item.get(k) or "").strip() for k in (
              "selected_season_id", "fixture_id", "home_team_provider_id", "away_team_provider_id")) in runtime_key_set]
          no_home_away = sum(str(item.get("no_home_away") or "").strip() == "1" for item in runtime_snapshot)
          print(f"Runtime artifact verified: run={run_id}; fixture_rows={len(rows)}; governed_leagues={len(governed_ids)}; fixture_leagues={len(report_ids)}; exact_snapshot_trace={len(runtime_snapshot)}; no_home_away={no_home_away}")
          PY

      - name: Build report-only team-level feature blocker diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c 'import json; print(json.load(open("runtime-artifact/artifact-metadata.json"))["artifact_id"])')"
          RUNTIME_COMMIT="$(python -c 'import json; print(json.load(open("runtime-artifact/artifact-metadata.json"))["head_sha"])')"
          ARTIFACT_DIGEST="$(python -c 'import json; print(json.load(open("runtime-artifact/artifact-metadata.json"))["artifact_digest"].split(":",1)[1])')"
          python scripts/diagnose_selected50_feature_blockers.py \
            --input-csv runtime-artifact/extracted/oracle_selected50_prediction_report.csv \
            --output-side-csv market-intelligence-output/oracle_selected50_feature_blocker_side_diagnostics.csv \
            --output-team-csv market-intelligence-output/oracle_selected50_feature_blocker_team_diagnostics.csv \
            --output-summary-json market-intelligence-output/oracle_selected50_feature_blocker_diagnostics_qa.json \
            --source-runtime-run-id "$RUNTIME_RUN_ID" \
            --source-runtime-artifact-id "$ARTIFACT_ID" \
            --source-runtime-commit "$RUNTIME_COMMIT" \
            --source-runtime-artifact-sha256 "$ARTIFACT_DIGEST"

      - name: Install report-only dependencies
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Test exact joins, chronology, duplicate guards and market masking
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_selected50_market_intelligence_report.py' -v
          python -m unittest discover -s tests -p 'test_goal_market_research_engine.py' -v
          python -m unittest discover -s tests -p 'test_selected50_field_coverage_audit.py' -v
          python -m unittest discover -s tests -p 'test_selected50_kickoff_discrepancy_triage.py' -v
          python -m unittest discover -s tests -p 'test_selected50_kickoff_source_evidence.py' -v
          python -m unittest discover -s tests -p 'test_selected50_feature_blocker_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_selected50_row_level_history_provenance.py' -v
          python -m unittest discover -s tests -p 'test_footystats_xg_manifest_provenance.py' -v

      - name: Download preserved Run 154 schedule queue for evidence-register CI
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@v4
        with:
          name: oracle-selected50-market-intelligence-repair
          path: /tmp/oracle-selected50-run154
          run-id: 41276694062
          github-token: ${{ github.token }}

      - name: Validate kickoff source evidence against preserved Run 154 queue
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          python scripts/validate_selected50_kickoff_source_evidence.py \
            --queue /tmp/oracle-selected50-run154/market-intelligence-output/oracle_selected50_schedule_reconciliation_queue.csv \
            --evidence reports/oracle-selected50-kickoff-source-evidence-2026-11-01.csv \
            --out /tmp/oracle-selected50-kickoff-evidence-qa.json

      - name: Upload kickoff evidence CI QA
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-kickoff-evidence-ci-qa
          path: /tmp/oracle-selected50-kickoff-evidence-qa.json
          if-no-files-found: error
          retention-days: 14

      - name: Download preserved runtime artifact for feature blocker CI
        if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@v4
        with:
          name: oracle-selected50-research-runtime-report
          path: /tmp/oracle-selected50-runtime-41175230838
          run-id: 41175230838
          github-token: ${{ github.token }}

      - name: Build report-only team-level feature blocker diagnostics from preserved runtime
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          python scripts/diagnose_selected50_feature_blockers.py \
            --input-csv /tmp/oracle-selected50-runtime-41175230838/oracle_selected50_prediction_report.csv \
            --output-side-csv /tmp/oracle-selected50-feature-blocker-side.csv \
            --output-team-csv /tmp/oracle-selected50-feature-blocker-team.csv \
            --output-summary-json /tmp/oracle-selected50-feature-blocker-qa.json \
            --source-runtime-run-id 41175230838 \
            --source-runtime-artifact-id 13032880970 \
            --source-runtime-commit ea3f46dab4e54b71a818ab8d8723f36426e36bef \
            --source-runtime-artifact-sha256 e4bca38c8ab8e6afd5c23d241e4b55fe3ce6277e656172e8cda910718c897ae0

      - name: Upload team-level feature blocker CI diagnostics
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-feature-blocker-ci-diagnostics
          path: |
            /tmp/oracle-selected50-feature-blocker-side.csv
            /tmp/oracle-selected50-feature-blocker-team.csv
            /tmp/oracle-selected50-feature-blocker-qa.json
          if-no-files-found: error
          retention-days: 14

      - name: Build archive-wide pre-kickoff evidence from the pinned archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python scripts/build_footystats_archive_features.py \
            --archive private-download/oracle-selected50-footystats-private-ingestion.zip \
            --out archive-audit

      - name: Inventory FootyStats archive manifest and xG metadata provenance (research only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python scripts/audit_footystats_xg_manifest_provenance.py \
            --archive private-download/oracle-selected50-footystats-private-ingestion.zip \
            --out-dir market-intelligence-output \
            --expected-archive-sha256 7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path("market-intelligence-output/oracle_selected50_xg_manifest_provenance_qa.json").read_text())
          if qa.get("archive_sha256") != "7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f":
              raise SystemExit("FAIL: xG manifest inventory did not use the pinned archive")
          if qa.get("xg_point_in_time_provenance_verified") is not False or qa.get("xg_quarantine_required") is not True:
              raise SystemExit("FAIL: xG provenance inventory must preserve quarantine")
          if qa.get("provider_api_calls") != 0 or qa.get("production_eligible") is not False or qa.get("betting_eligible") is not False:
              raise SystemExit("FAIL: xG manifest inventory governance contract violated")
          print("xG manifest inventory:", qa.get("status"), "manifest rows:", qa.get("manifest_rows"),
                "manifest capture candidates:", qa.get("manifest_rows_with_capture_timestamp_candidate"),
                "fixture-linked capture/hash candidates:", qa.get("manifest_rows_with_fixture_capture_and_hash_candidates"))
          PY

      - name: Build row-level historical feature provenance audit (research only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python scripts/audit_selected50_row_level_history_provenance.py \
            --archive private-download/oracle-selected50-footystats-private-ingestion.zip \
            --selected-manifest data/oracle-footystats-selected-50-season-id-manifest.csv \
            --runtime-report runtime-artifact/extracted/oracle_selected50_prediction_report.csv \
            --out-dir market-intelligence-output
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path("market-intelligence-output/oracle_selected50_history_provenance_qa.json").read_text())
          if qa.get("archive_sha256") != "7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f":
              raise SystemExit("FAIL: row-level history audit did not use the pinned archive")
          if qa.get("minimum_history_required") != 5 or qa.get("minimum_history_changed") is not False:
              raise SystemExit("FAIL: five-match minimum governance contract changed")
          if qa.get("feature_imputation") != 0 or qa.get("production_model_logic_changed") is not False or qa.get("production_probabilities_changed") is not False:
              raise SystemExit("FAIL: research-only history audit governance contract violated")
          print("Row-level history provenance QA:", qa.get("status"), "sides:", qa.get("blocked_team_side_rows_audited"), "count mismatches:", len(qa.get("runtime_archive_history_count_mismatches", [])))
          PY

      - name: Verify archive audit digest and pinned archive coverage
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path("archive-audit/summary.json").read_text())
          if qa.get("archive_sha256") != "7c60a239f16dcee318cd04b031c68c07505760cb1063c1c34f368bef86844f2f":
              raise SystemExit("FAIL: feature audit archive digest does not match the pinned archive")
          if qa.get("archive_match_records") != 59049 or qa.get("season_folders") != 200:
              raise SystemExit(f"FAIL: pinned archive coverage mismatch: rows={qa.get('archive_match_records')}, seasons={qa.get('season_folders')}")
          if qa.get("provider_api_calls") != 0:
              raise SystemExit("FAIL: provider API calls were made; archive-only policy violated")
          print("Pinned archive audit verified: 59,049 records; 200 season folders; zero provider API calls.")
          PY

      - name: Build experimental goal-market estimates and chronological backtest (research only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python scripts/build_goal_market_research_engine.py \
            --archive-audit archive-audit/match_field_audit.csv \
            --runtime-report runtime-artifact/extracted/oracle_selected50_prediction_report.csv \
            --out-dir goal-market-research

      - name: Rebuild 38-column Market Intelligence report and enforce QA gates
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          RUNTIME_ARTIFACT_ID="$(python -c 'import json; print(json.load(open("runtime-artifact/artifact-metadata.json"))["artifact_id"])')"
          python scripts/build_selected50_market_intelligence_report.py \
            --runtime-artifact-id "$RUNTIME_ARTIFACT_ID" \
            --runtime-report runtime-artifact/extracted/oracle_selected50_prediction_report.csv \
            --archive-audit archive-audit \
            --schedule-coverage runtime-artifact/extracted/oracle_selected50_schedule_coverage.csv \
            --runtime-provenance runtime-artifact/extracted/oracle_selected50_runtime_provenance.json \
            --snapshot-candidate-trace runtime-artifact/extracted/current_snapshot_candidate_trace.csv \
            --archive-summary archive-audit/summary.json \
            --goal-market-research goal-market-research/goal_market_research.csv \
            --out-dir market-intelligence-output \
            --expected-league-groups 50

      - name: Enforce exact orientation and runtime feature-block QA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          out = Path("market-intelligence-output")
          orientation_qa = json.loads((out / "oracle_selected50_snapshot_orientation_qa.json").read_text())
          with (out / "oracle_selected50_fixture_orientation_audit.csv").open(encoding="utf-8-sig", newline="") as f:
              orientation = list(csv.DictReader(f))
          with Path("runtime-artifact/extracted/oracle_selected50_prediction_report.csv").open(encoding="utf-8-sig", newline="") as f:
              runtime = list(csv.DictReader(f))
          if orientation_qa.get("status") != "PASS_EXACT_SNAPSHOT_TRACE_JOIN":
              raise SystemExit("FAIL: exact snapshot orientation QA did not pass")
          if len(orientation) != len(runtime) or len(orientation) != orientation_qa.get("runtime_fixture_rows"):
              raise SystemExit("FAIL: orientation audit row count does not reconcile to runtime fixtures")
          flagged = [r for r in orientation if r.get("snapshot_no_home_away_flag") == "1"]
          distinct = [r for r in orientation if r.get("snapshot_no_home_away_flag") == "0"]
          unknown = [r for r in orientation if r.get("fixture_orientation_status") == "ORIENTATION_UNKNOWN"]
          if len(flagged) != orientation_qa.get("no_home_away_flagged") or len(distinct) != orientation_qa.get("home_away_distinction_present"):
              raise SystemExit("FAIL: orientation CSV counts do not match orientation QA")
          if unknown or len(flagged) + len(distinct) != len(runtime):
              raise SystemExit("FAIL: orientation audit contains unknown or unclassified runtime fixtures")
          if any(r.get("home_away_market_review_status") != "REVIEW_REQUIRED_NO_HOME_AWAY_DISTINCTION" for r in flagged):
              raise SystemExit("FAIL: no_home_away=1 fixture lacks home/away market review status")
          if any(r.get("production_eligible") != "NO" or r.get("betting_eligible") != "NO" for r in orientation):
              raise SystemExit("FAIL: orientation research rows must remain ineligible")
          feature_qa = json.loads((out / "oracle_selected50_runtime_feature_block_audit_qa.json").read_text())
          with (out / "oracle_selected50_runtime_feature_block_audit.csv").open(encoding="utf-8-sig", newline="") as f:
              side_rows = list(csv.DictReader(f))
          if len(side_rows) != feature_qa.get("blocked_team_side_histories"):
              raise SystemExit("FAIL: runtime feature-block side rows do not reconcile to QA")
          if sum(r.get("team_side") == "HOME" for r in side_rows) != feature_qa.get("home_side_histories_below_5"):
              raise SystemExit("FAIL: home-side feature-block count mismatch")
          if sum(r.get("team_side") == "AWAY" for r in side_rows) != feature_qa.get("away_side_histories_below_5"):
              raise SystemExit("FAIL: away-side feature-block count mismatch")
          if any(int(r.get("recent5_feature_complete_n", "99")) >= 5 for r in side_rows):
              raise SystemExit("FAIL: side audit includes a history that passes the five-match gate")
          if any(r.get("production_eligible") != "NO" or r.get("betting_eligible") != "NO" for r in side_rows):
              raise SystemExit("FAIL: feature-block research rows must remain ineligible")
          print(f"Orientation QA PASS: {len(flagged)} no_home_away flags; {len(distinct)} with distinction; 0 unknown.")
          print(f"Runtime feature audit PASS: {feature_qa.get('blocked_fixture_rows')} fixtures; {len(side_rows)} blocked team sides.")
          PY

