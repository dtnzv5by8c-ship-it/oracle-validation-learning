name: Oracle Public Current Data Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-public-current-data-recovery.yml"

permissions:
  contents: read

concurrency:
  group: oracle-public-current-state-recovery
  cancel-in-progress: false

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_REPO: dtnzv5by8c-ship-it/oracle-football-data
    steps:
      - name: Checkout public execution controller
        uses: actions/checkout@v4

      - name: Clone private Oracle main with write-capable token
        env:
          ORACLE_PRIVATE_REPO_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ORACLE_PRIVATE_REPO_TOKEN:-}" || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN is missing."; exit 1; }
          git clone --depth 1 --branch main "https://x-access-token:${ORACLE_PRIVATE_REPO_TOKEN}@github.com/${TARGET_REPO}.git" oracle
          echo "SOURCE_COMMIT=$(git -C oracle rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Source commit: $(git -C oracle rev-parse HEAD)"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Ingest current FootyStats data
        working-directory: oracle
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${FOOTYSTATS_API_KEY:-}" || { echo "::error::FOOTYSTATS_API_KEY is missing."; exit 1; }
          python scripts/ingest_current_footystats.py

      - name: Reconcile current staging data
        working-directory: oracle
        run: python scripts/reconcile_current_data.py

      - name: Reconcile independent current sources
        working-directory: oracle
        run: python scripts/reconcile_current_sources.py

      - name: Build current pre-match team state
        working-directory: oracle
        run: python scripts/build_current_team_state.py

      - name: Validate Team State before persistence
        working-directory: oracle
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          python - <<'PY'
          import csv, json
          from pathlib import Path
          csv_path=Path("database/current_prematch_team_state.csv")
          manifest=json.loads(Path("data/current_team_state_manifest.json").read_text())
          with csv_path.open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          csv_rows=len(rows)
          manifest_rows=int(manifest.get("rows",-1))
          if csv_rows <= 0:
              raise SystemExit("CURRENT_TEAM_STATE_PERSISTENCE_INVALID: CSV has zero rows")
          if manifest_rows != csv_rows:
              raise SystemExit(f"CURRENT_TEAM_STATE_PERSISTENCE_INVALID: manifest={manifest_rows} csv={csv_rows}")
          print({"status":"PASS","rows":csv_rows})
          PY

      - name: Run current Team State persistence regression tests
        working-directory: oracle
        run: python -m unittest tests/test_current_team_state_persistence.py

      - name: Build prediction-engine compatibility view
        working-directory: oracle
        run: python scripts/build_prediction_team_state_compatibility.py

      - name: Persist validated current state to private repository branch
        working-directory: oracle
        env:
          ORACLE_PRIVATE_REPO_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          required_files=(
            database/current_matches.csv
            database/current_goal_events.csv
            database/current_source_reconciliation.csv
            database/current_prematch_team_state.csv
            research/otms/outputs/current_otms.csv
            data/current_source_manifest.json
            data/current_reconciliation_status.json
            data/source_reconciliation_manifest.json
            data/current_team_state_manifest.json
            data/model_readiness.json
            data/current_otms_manifest.json
            data/four_model_readiness.json
          )
          for path in "${required_files[@]}"; do
            test -f "$path" || { echo "PERSIST_INPUT_MISSING=$path"; exit 1; }
          done
          test -s database/current_prematch_team_state.csv
          TEAM_STATE_SIZE="$(wc -c < database/current_prematch_team_state.csv)"
          TEAM_STATE_SHA256="$(sha256sum database/current_prematch_team_state.csv | awk '{print $1}')"
          TEAM_STATE_ROWS="$(tail -n +2 database/current_prematch_team_state.csv | wc -l)"
          echo "CURRENT_TEAM_STATE_SIZE=$TEAM_STATE_SIZE"
          echo "CURRENT_TEAM_STATE_SHA256=$TEAM_STATE_SHA256"
          echo "CURRENT_TEAM_STATE_ROWS=$TEAM_STATE_ROWS"

          PERSIST_BRANCH="oracle/current-state/public-run-${GITHUB_RUN_ID}"
          git fetch --no-tags origin main
          git switch --create "${PERSIST_BRANCH}"
          git add "${required_files[@]}"
          git add -f database/current_prematch_team_state.csv
          git diff --cached --quiet && { echo "No current staging changes."; exit 0; }
          git config user.name "oracle-public-current-data-bot"
          git config user.email "oracle-public-current-data-bot@users.noreply.github.com"
          git commit -m "Persist validated current staging data from public runner"
          git push --force --set-upstream origin "${PERSIST_BRANCH}"

          git fetch --no-tags origin "${PERSIST_BRANCH}"
          REMOTE_TEAM_STATE_SIZE="$(git show "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv" | wc -c)"
          REMOTE_TEAM_STATE_SHA256="$(git show "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv" | sha256sum | awk '{print $1}')"
          REMOTE_TEAM_STATE_ROWS="$(git show "origin/${PERSIST_BRANCH}:database/current_prematch_team_state.csv" | tail -n +2 | wc -l)"
          test "${REMOTE_TEAM_STATE_SIZE}" = "${TEAM_STATE_SIZE}"
          test "${REMOTE_TEAM_STATE_SHA256}" = "${TEAM_STATE_SHA256}"
          test "${REMOTE_TEAM_STATE_ROWS}" = "${TEAM_STATE_ROWS}"
          echo "PERSIST_BRANCH=${PERSIST_BRANCH}" >> "$GITHUB_ENV"
          echo "PERSIST_BRANCH_READY=true" >> "$GITHUB_ENV"
          echo "REMOTE_TEAM_STATE_SIZE=${REMOTE_TEAM_STATE_SIZE}"
          echo "REMOTE_TEAM_STATE_SHA256=${REMOTE_TEAM_STATE_SHA256}"
          echo "REMOTE_TEAM_STATE_ROWS=${REMOTE_TEAM_STATE_ROWS}"

      - name: Create private repository persistence PR
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        working-directory: oracle
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "${TARGET_REPO}" --head "${PERSIST_BRANCH}" --state open --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            echo "Existing persistence PR #${existing}"
            exit 0
          fi
          gh pr create --repo "${TARGET_REPO}" --base main --head "${PERSIST_BRANCH}"             --title "Persist validated current Team State from public runner"             --body "Automated persistence handoff. Source commit: ${SOURCE_COMMIT}. Team State was validated non-empty with manifest parity, persistence regression tests, compatibility view build, and remote SHA/byte/row parity before this PR was created. No Oracle V1.6 production logic is modified."
