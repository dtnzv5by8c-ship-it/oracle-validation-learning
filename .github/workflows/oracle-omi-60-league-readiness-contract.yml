name: Oracle OMI 60-League Readiness Contract
on:
  push:
    branches: [research/oracle-50-league-readiness-audit]
    paths:
      - "scripts/validate_omi_universe_readiness.py"
      - "tests/test_omi_universe_readiness.py"
      - "scripts/validate_60_league_registry_admission.py"
      - "tests/test_60_league_registry_admission.py"
      - "config/omi_market_intelligence_schema_v1.json"
      - "scripts/validate_gateway_receipt.py"
      - "tests/test_gateway_receipt.py"
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline OMI readiness unit tests
        run: python tests/test_omi_universe_readiness.py
      - name: Run offline 60-league registry admission tests
        run: python tests/test_60_league_registry_admission.py
      - name: Run offline private gateway receipt safety tests
        run: python tests/test_gateway_receipt.py
