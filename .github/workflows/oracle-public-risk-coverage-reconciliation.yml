name: Oracle Public Risk Coverage Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oracle-public-risk-coverage-reconciliation.yml"

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest successful public V1.6 integration run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/run.env
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"}
          )
          data=json.load(urllib.request.urlopen(req))
          name="Oracle Public V1.6 Fixture Integration Audit V2"
          runs=[r for r in data["workflow_runs"] if r["name"]==name and r["conclusion"]=="success"]
          if not runs: raise SystemExit("No successful public V1.6 integration run found")
          r=max(runs,key=lambda x:x["updated_at"])
          print(f"run={r['id']}")
          PY
          cat /tmp/run.env >> "$GITHUB_OUTPUT"

      - name: Download latest public V1.6 integration artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run }}
          pattern: oracle-public-v1-6-integration-v2-*
          merge-multiple: true
          path: /tmp/integration

      - name: Resolve latest successful Selected-50 current gap probe
        id: gap
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/gap.env
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"})
          data=json.load(urllib.request.urlopen(req))
          runs=[r for r in data["workflow_runs"] if r["name"]=="Oracle Public Selected-50 Current Gap Probe" and r["conclusion"]=="success"]
          if not runs: raise SystemExit("No successful Selected-50 current gap probe found")
          r=max(runs,key=lambda x:x["updated_at"])
          print(f"run={r['id']}")
          PY
          cat /tmp/gap.env >> "$GITHUB_OUTPUT"

      - name: Download latest Selected-50 gap evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.gap.outputs.run }}
          pattern: oracle-public-selected50-current-gap-probe-*
          merge-multiple: true
          path: /tmp/selected50-gap

      - name: Build fail-closed risk and coverage matrix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path(".")
          fix=root/"recovery/fixtures/current/governed_fixture_reconciliation.csv"
          fts=root/"recovery/fixtures/current/intelligence/footystats_current_fixture_intelligence_summary.json"
          src=root/"recovery/current-state/2026-11-16-0758/data/current_source_manifest.json"
          integ=next(Path("/tmp/integration").rglob("v1_6_fixture_integration_summary.json"),None)
          out=root/"recovery/fixtures/current/intelligence"; out.mkdir(parents=True,exist_ok=True)
          for p in (fix,fts,src,integ):
              if not p or not p.exists(): raise SystemExit("FAIL-CLOSED missing evidence: "+str(p))
          fixtures=list(csv.DictReader(fix.open(encoding="utf-8",newline="")))
          f=json.loads(fts.read_text())
          s=json.loads(src.read_text())
          i=json.loads(integ.read_text())
          counts={}
          for r in fixtures:
              st=r.get("identity_status","")
              counts[st]=counts.get(st,0)+1
          exact=counts.get("MATCHED_EXACT_DATE_HOME_AWAY",0)
          ambiguous=counts.get("AMBIGUOUS_EXACT_DATE_HOME_AWAY",0)
          unmatched=len(fixtures)-exact-ambiguous
          direct=f.get("direct_provider_value_rows",0)
          unavailable=f.get("unavailable_value_rows",0)
          expected=s.get("expected_league_count",50)
          # Count only governed Selected-50 leagues with direct current-season evidence.\n          # Gap-probe evidence is admitted only when it is direct provider evidence for an explicit 2026-labelled season.
          # The current snapshot may contain non-selected extras; those never count toward the 50.
          current_seasons={"2026","20262027","2026/2027"}
          registry_url="https://raw.githubusercontent.com/dtnzv5by8c-ship-it/oracle-validation-learning/research/oracle-50-league-readiness-audit/data/prospective/oracle_50_league_fixture_source_registry.csv"
          from urllib.request import urlopen
          registry=list(csv.DictReader(urlopen(registry_url,timeout=30).read().decode("utf-8").splitlines()))
          selected_ids={x["footystats_league_id"] for x in registry}
          name_to_id={str(x.get("governed_league_name","")).strip():x["footystats_league_id"] for x in registry}
          current_selected_ids=set()
          for x in s.get("leagues",[]):
              name=str(x.get("league","")).strip()
              if name in name_to_id and name_to_id[name] in selected_ids and int(x.get("rows",0) or 0)>0 and str(x.get("season","")) in current_seasons:
                  current_selected_ids.add(name_to_id[name])
          gap=next(Path("/tmp/selected50-gap").rglob("selected50_current_gap_probe_summary.json"),None)
          gap_nonempty_ids=set()
          if gap:
              gd=json.loads(gap.read_text())
              gap_nonempty_ids={str(x.get("selected_id")) for x in gd.get("results",[]) if int(x.get("rows",0) or 0)>0 and str(x.get("selected_id")) in selected_ids}
          current_selected_ids |= gap_nonempty_ids
          current_leagues=[x for x in s.get("leagues",[]) if int(x.get("rows",0) or 0)>0 and str(x.get("season","")) in current_seasons]
          stale_leagues=[x for x in s.get("leagues",[]) if int(x.get("rows",0) or 0)==0 and str(x.get("season","")) not in current_seasons]
          actual=len(current_selected_ids)
          blockers=[]
          if exact < len(fixtures): blockers.append("FIXTURE_IDENTITY_COVERAGE_BELOW_100")
          if ambiguous: blockers.append("AMBIGUOUS_FIXTURE_IDENTITIES")
          if actual < expected: blockers.append("CURRENT_FOOTYSTATS_LEAGUE_COVERAGE_BELOW_100")
          if stale_leagues: blockers.append("STALE_PROVIDER_SEASON_ENTRIES_PRESENT")
          if not i.get("production_certification",False): blockers.append("V1_6_CURRENT_PRODUCTION_CERTIFICATION_UNAVAILABLE")
          summary={
            "generated_utc":datetime.now(timezone.utc).isoformat(),
            "governed_fixture_rows":len(fixtures),
            "exact_identity_rows":exact,
            "ambiguous_identity_rows":ambiguous,
            "unmatched_identity_rows":unmatched,
            "identity_coverage_pct":round(exact/len(fixtures)*100,2),
            "footystats_direct_provider_value_rows":direct,
            "footystats_unavailable_value_rows":unavailable,
            "footystats_actual_leagues":actual,
            "footystats_current_selected_ids":sorted(current_selected_ids),
            "footystats_gap_probe_nonempty_selected_leagues":len(gap_nonempty_ids),
            "footystats_expected_leagues":expected,
            "footystats_league_coverage_pct":round(actual/expected*100,2) if expected else 0,
            "stale_provider_season_leagues":len(stale_leagues),
            "stale_provider_season_names":[x.get("league") for x in stale_leagues],
            "v1_6_production_certified":bool(i.get("production_certification",False)),
            "production_readiness":"BLOCKED" if blockers else "READY_FOR_FINAL_ASSEMBLY",
            "blockers":blockers,
            "oracle_v1_6_changed":False,
            "master_omi_a_et_changed":False,
            "private_repo_used":False,
            "historical_fallback":False,
            "fuzzy_matching":False
          }
          (out/"risk_coverage_reconciliation_summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          with (out/"risk_coverage_reconciliation.csv").open("w",encoding="utf-8",newline="") as fh:
              w=csv.writer(fh); w.writerow(["gate","value","status","reason"])
              for k,v in summary.items():
                  if isinstance(v,(dict,list)): continue
                  w.writerow([k,v,"PASS" if k not in ("production_readiness",) and not (k=="footystats_actual_leagues" and actual<expected) else "REVIEW",""])
          print(json.dumps(summary,indent=2))
          if blockers: print("FAIL-CLOSED: blockers remain; no production certification.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: oracle-public-risk-coverage-${{ github.run_id }}
          path: recovery/fixtures/current/intelligence/risk_coverage_reconciliation*
          if-no-files-found: error
