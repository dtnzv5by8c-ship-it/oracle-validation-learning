name: Oracle One-Time Prospective Dispatch

on:
  push:
    paths:
      - ".github/workflows/oracle-one-time-prospective-dispatch.yml"
# Single-use trigger arm.

permissions:
  contents: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Oracle one-time prospective dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch serialized prospective cycle on private main
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run oracle_prospective_learning.yml --repo dtnzv5by8c-ship-it/oracle-football-data --ref main
          echo "Dispatched oracle_prospective_learning.yml on private main."

      - name: Remove one-time dispatcher
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/dtnzv5by8c-ship-it/oracle-validation-learning/contents/.github/workflows/oracle-one-time-prospective-dispatch.yml --jq .sha)
          gh api --method DELETE repos/dtnzv5by8c-ship-it/oracle-validation-learning/contents/.github/workflows/oracle-one-time-prospective-dispatch.yml             -f message='Remove one-time prospective dispatcher'             -f sha="$sha"
          echo "One-time dispatcher removed."
