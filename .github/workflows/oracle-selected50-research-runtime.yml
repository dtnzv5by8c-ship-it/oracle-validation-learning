name: Oracle Selected-50 Research Runtime and Backtest

on:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - "**"
      - "!reports/**"
      - "!tests/**"
      - "!scripts/qa_selected50_private_archive.py"
      - "!scripts/settle_market_from_final_score.py"
      - "!*.md"
      - "!**/*.md"
      - "!.github/workflows/**"
      - ".github/workflows/oracle-selected50-research-runtime.yml"
  workflow_dispatch:
    inputs:
      confirm_private_archive_read:
        description: "Confirm use of the existing private archive; this run makes no provider API calls"
        required: true
        default: false
        type: boolean
      private_archive_release_tag:
        description: "Exact private research archive release tag to read"
        required: true
        default: "research-selected50-footystats-history-40447419806"
        type: string

permissions:
  contents: read

jobs:
  selected50-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Guard private archive access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          CONFIRM_PRIVATE_ARCHIVE_READ: ${{ inputs.confirm_private_archive_read }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${CONFIRM_PRIVATE_ARCHIVE_READ:-false}" == "true" ]] || { echo "::error::Explicit private archive read confirmation required."; exit 1; }
          fi
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN missing."; exit 1; }
          gh auth status

      - name: Download and verify existing private archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
          PRIVATE_ARCHIVE_RELEASE_TAG: ${{ inputs.private_archive_release_tag || 'research-selected50-footystats-history-40447419806' }}
        run: |
          set -euo pipefail
          [[ "${PRIVATE_ARCHIVE_RELEASE_TAG}" =~ ^research-selected50-footystats-history-[0-9]+$ ]] || { echo "::error::Invalid private archive release tag format."; exit 1; }
          mkdir -p private-download
          gh release download "${PRIVATE_ARCHIVE_RELEASE_TAG}" \
            --repo dtnzv5by8c-ship-it/oracle-football-data \
            --pattern 'oracle-selected50-footystats-private-ingestion.zip' \
            --pattern 'private-package.sha256' \
            --dir private-download
          cd private-download
          sha256sum -c private-package.sha256

      - name: Install research runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Build isolated Selected-50 research runtime, features, backtest and report
        env:
          ORACLE_ARCHIVE: private-download/oracle-selected50-footystats-private-ingestion.zip
        run: python scripts/build_selected50_research_runtime.py

      - name: Validate walk-forward metrics, league gates and governed report outputs
        run: python scripts/validate_selected50_runtime_outputs.py

      - name: Upload derived report and sanitized QA only
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-research-runtime-report
          path: |
            selected50_runtime_output/oracle_selected50_prediction_report.csv
            selected50_runtime_output/oracle_selected50_governed_fixture_report.csv
            selected50_runtime_output/oracle_selected50_governed_fixture_report_qa.json
            selected50_runtime_output/oracle_selected50_backtest_metrics.json
            selected50_runtime_output/oracle_selected50_walk_forward_metrics.json
            selected50_runtime_output/oracle_selected50_league_market_readiness.csv
            selected50_runtime_output/oracle_selected50_league_walk_forward_metrics.csv
            selected50_runtime_output/oracle_selected50_schedule_coverage.csv
            selected50_runtime_output/oracle_selected50_feature_qa.json
            selected50_runtime_output/season_coverage.csv
            selected50_runtime_output/oracle_selected50_calendar_year_coverage.csv
            selected50_runtime_output/oracle_selected50_provider_season_year_coverage.csv
            selected50_runtime_output/oracle_selected50_settlement_truth_qa.csv
            selected50_runtime_output/oracle_selected50_runtime_validation.json
          if-no-files-found: error
          retention-days: 14
