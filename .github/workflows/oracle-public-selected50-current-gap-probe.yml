name: Oracle Public Selected-50 Current Gap Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oracle-public-selected50-current-gap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe missing selected-50 current seasons
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FOOTYSTATS_API_KEY:-}"
          python - <<'PY'
          import csv,hashlib,json,os,re,time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen
          API=os.environ["FOOTYSTATS_API_KEY"]
          reg_url="https://raw.githubusercontent.com/dtnzv5by8c-ship-it/oracle-validation-learning/research/oracle-50-league-readiness-audit/data/oracle-footystats-selected-50-season-id-manifest.csv"
          reg=json.loads(json.dumps(list(csv.DictReader(urlopen(reg_url,timeout=30).read().decode("utf-8").splitlines()))))
          target_ids={"16571","16615","16614","16572","17964","16537","17178","16627","16708","16617"}
          # Probe only selected leagues absent from the current positive-row main snapshot; no non-selected extras are promoted.\n          # Refresh current-season evidence each execution; no cached/provider-history substitution.
          targets=[r for r in reg if r["selected_id"] in target_ids]
          def get(sid):
              q=urlencode({"key":API,"season_id":sid,"max_per_page":1000})
              req=Request("https://api.football-data-api.com/league-matches?"+q,headers={"User-Agent":"Oracle-Public-Selected50-Gap-Probe/1.0"})
              last=None
              for attempt in range(4):
                  try:
                      with urlopen(req,timeout=60) as resp:
                          raw=resp.read()
                      return raw,json.loads(raw.decode("utf-8"))
                  except Exception as e:
                      last=e
                      if getattr(e,"code",None)==429 and attempt<3:
                          time.sleep(5*(attempt+1)); continue
                      raise
              raise last
          out=Path("recovery/fixtures/current/intelligence"); out.mkdir(parents=True,exist_ok=True)
          def norm(s): return re.sub(r"[^a-z0-9]+","",str(s).lower())
          cat_req=Request("https://api.football-data-api.com/league-list?"+urlencode({"key":API,"chosen_leagues_only":"false"}),headers={"User-Agent":"Oracle-Public-Selected50-Gap-Probe/1.0"})
          with urlopen(cat_req,timeout=60) as resp: cat_payload=json.loads(resp.read().decode("utf-8"))
          catalogue=cat_payload.get("data") if isinstance(cat_payload,dict) else None
          if cat_payload.get("success") is not True or not isinstance(catalogue,list): raise SystemExit("FootyStats league-list failed; fail-closed.")
          results=[]
          for row in targets:
              country=row["country"].strip(); comp=row["competition_name"].strip(); candidates=[]
              for league in catalogue:
                  lname=str(league.get("league_name") or "").strip(); pname=str(league.get("name") or "").strip(); pcountry=str(league.get("country") or "").strip()
                  if norm(pcountry)==norm(country) and (norm(lname)==norm(comp) or norm(pname)==norm(country+" "+comp)):
                      candidates.append(league)
              if len(candidates)!=1:
                  results.append({"selected_id":row["selected_id"],"league":country+" "+comp,"season_id":"","rows":0,"source":"FootyStats API","endpoint":"league-list","payload_sha256":"","status":"LEAGUE_IDENTITY_UNRESOLVED","production_eligible":False,"betting_eligible":False})
                  continue
              league=candidates[0]
              current=[s for s in (league.get("season") or []) if "2026" in str(s.get("year") or s.get("season") or "") and str(s.get("id") or "").strip()]
              if not current:
                  results.append({"selected_id":row["selected_id"],"league":country+" "+comp,"season_id":"","rows":0,"source":"FootyStats API","endpoint":"league-list","payload_sha256":"","status":"NO_CURRENT_2026_SEASON_AVAILABLE","production_eligible":False,"betting_eligible":False})
                  continue
              # Probe every explicitly 2026-labelled provider season for this governed league; never use 2025 or earlier.
              total_rows=0; season_ids=[]; digests=[]
              for s in current:
                  sid=str(s["id"]).strip(); raw,payload=get(sid); data=payload.get("data") if isinstance(payload,dict) else None; data=data if isinstance(data,list) else []
                  total_rows += len(data); season_ids.append(sid); digests.append(hashlib.sha256(raw).hexdigest())
                  time.sleep(0.2)
              results.append({"selected_id":row["selected_id"],"league":country+" "+comp,"season_id":";".join(season_ids),"rows":total_rows,"source":"FootyStats API","endpoint":"league-matches","payload_sha256":";".join(digests),"status":"DIRECT_PROVIDER_EVIDENCE" if total_rows else "PROVIDER_EMPTY","production_eligible":False,"betting_eligible":False})
          summary={"generated_utc":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),"target_selected_leagues":len(targets),"non_empty_current_seasons":sum(x["rows"]>0 for x in results),"empty_current_seasons":sum(x["rows"]==0 for x in results),"api_calls":len(targets),"production_eligible":False,"betting_eligible":False,"fuzzy_matching":False,"historical_fallback":False,"oracle_v1_6_changed":False,"master_omi_a_et_changed":False}
          (out/"selected50_current_gap_probe.csv").write_text("selected_id,league,season_id,rows,source,endpoint,payload_sha256,status,production_eligible,betting_eligible\n"+"\n".join(",".join(str(x[k]).replace(","," ") for k in ["selected_id","league","season_id","rows","source","endpoint","payload_sha256","status","production_eligible","betting_eligible"]) for x in results)+"\n")
          (out/"selected50_current_gap_probe_summary.json").write_text(json.dumps({"summary":summary,"results":results},indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({"summary":summary,"results":results},indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-public-selected50-current-gap-probe-${{ github.run_id }}
          path: recovery/fixtures/current/intelligence/selected50_current_gap_probe*
          if-no-files-found: error
