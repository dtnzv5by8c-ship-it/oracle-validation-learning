name: FootyStats Global Budgeted Endpoint Preflight (Research Only)

on:
  workflow_dispatch:
    inputs:
      confirm_provider_api_usage:
        description: "Use the already user-approved FootyStats API access; no raw payloads are stored"
        required: true
        type: boolean
        default: true
      max_seasons:
        description: "Maximum pending provider seasons to preflight; the default covers the current 2024-forward plan"
        required: true
        type: number
        default: 182
      max_requests:
        description: "Maximum reserved API requests for this run (operational maximum 1500; expected full-plan preflight 910)"
        required: true
        type: number
        default: 1000

permissions:
  contents: write

concurrency:
  group: footystats-global-api-gateway
  cancel-in-progress: false

jobs:
  endpoint-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GOVERNED_BRANCH: research/oracle-50-league-readiness-audit
      LEDGER_PATH: data/footystats/rolling-request-ledger.json
      PLAN_DIR: data/footystats/historical-season-plan-2024-2026
      REPORT_DIR: data/footystats/endpoint-preflight

    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Verify explicit API approval and operational limits
        shell: bash
        env:
          CONFIRM_PROVIDER_API_USAGE: ${{ inputs.confirm_provider_api_usage }}
          MAX_SEASONS: ${{ inputs.max_seasons }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          set -euo pipefail
          [[ "${CONFIRM_PROVIDER_API_USAGE}" == "true" ]] || { echo "::error::Provider API use was not confirmed; no request will be made."; exit 1; }
          [[ -n "${FOOTYSTATS_API_KEY:-}" ]] || { echo "::error::FOOTYSTATS_API_KEY secret is missing; no request will be made."; exit 1; }
          [[ "${MAX_SEASONS}" =~ ^[0-9]+$ ]] && (( MAX_SEASONS >= 1 && MAX_SEASONS <= 1000 )) || { echo "::error::max_seasons must be 1..1000."; exit 1; }
          [[ "${MAX_REQUESTS}" =~ ^[0-9]+$ ]] && (( MAX_REQUESTS >= 1 && MAX_REQUESTS <= 1500 )) || { echo "::error::max_requests must be 1..1500."; exit 1; }
          echo "Provider access approved; request cap validated. API key value is not printed."

      - name: Build current-date historical season plan offline
        shell: bash
        run: |
          set -euo pipefail
          END_DATE="$(date -u +%F)"
          python scripts/build_footystats_historical_season_plan.py \
            --registry-json data/footystats/footystats-provider-season-registry-2026-11-04.json \
            --start-date 2024-01-01 \
            --end-date "${END_DATE}" \
            --plan-csv "${PLAN_DIR}/season-plan.csv" \
            --excluded-csv "${PLAN_DIR}/excluded-seasons.csv" \
            --summary-json "${PLAN_DIR}/summary.json"
          echo "HISTORY_END_DATE=${END_DATE}" >> "${GITHUB_ENV}"

      - name: Reserve global rolling-hour request budget before any provider call
        id: reserve
        shell: bash
        env:
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          set -euo pipefail
          RESERVATION_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RESERVATION_ID=${RESERVATION_ID}" >> "${GITHUB_ENV}"
          python scripts/footystats_budgeted_endpoint_preflight.py reserve \
            --ledger "${LEDGER_PATH}" \
            --reservation-id "${RESERVATION_ID}" \
            --max-requests "${MAX_REQUESTS}" | tee "${RUNNER_TEMP}/footystats-reservation-summary.json"

      - name: Commit durable reservation before provider access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}" data/footystats/full-ingestion-manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${LEDGER_PATH}" "${PLAN_DIR}/season-plan.csv" "${PLAN_DIR}/excluded-seasons.csv" "${PLAN_DIR}/summary.json"
          git commit -m "ops: reserve FootyStats budget for run ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GOVERNED_BRANCH}"
            if ! git rebase "origin/${GOVERNED_BRANCH}"; then
              git rebase --abort || true
              echo "Reservation rebase conflicted (attempt ${attempt}/5); retrying from the latest branch head."
              sleep $((attempt * 2))
              continue
            fi
            if git push origin "HEAD:${GOVERNED_BRANCH}"; then
              pushed=true
              break
            fi
            echo "Research branch advanced during reservation push (attempt ${attempt}/5); retrying without force."
            sleep $((attempt * 2))
          done
          [[ "${pushed}" == "true" ]] || { echo "::error::Could not safely publish request reservation after five attempts; stopping before provider access."; exit 1; }

      - name: Run sanitized endpoint and field preflight
        id: preflight
        shell: bash
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          MAX_SEASONS: ${{ inputs.max_seasons }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          python scripts/footystats_budgeted_endpoint_preflight.py execute \
            --ledger "${LEDGER_PATH}" \
            --reservation-id "${RESERVATION_ID}" \
            --plan "${PLAN_DIR}/season-plan.csv" \
            --report "${REPORT_DIR}/footystats-preflight-run-${GITHUB_RUN_ID}.json" \
            --run-id "${GITHUB_RUN_ID}" \
            --max-seasons "${MAX_SEASONS}" \
            --max-requests "${MAX_REQUESTS}" \
            --history-end-date "${HISTORY_END_DATE}"

      - name: Build offline full historical ingestion manifest from sanitized preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_footystats_full_ingestion_manifest.py \
            --plan-csv "${PLAN_DIR}/season-plan.csv" \
            --preflight-dir "${REPORT_DIR}" \
            --output-dir data/footystats/full-ingestion-manifest \
            --max-requests-per-batch 1500

      - name: Build offline resumable ingestion checkpoint plan
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RECEIPTS_FILE="${RUNNER_TEMP}/footystats-ingestion-receipts.jsonl"
          : > "${RECEIPTS_FILE}"
          python scripts/footystats_ingestion_checkpoint.py \
            --manifest data/footystats/full-ingestion-manifest/ingestion-request-manifest.csv \
            --receipts-jsonl "${RECEIPTS_FILE}" \
            --output-dir data/footystats/resumable-ingestion \
            --max-batch-requests 1500

      - name: Commit sanitized report and finalized request ledger
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${LEDGER_PATH}" "${REPORT_DIR}/" data/footystats/full-ingestion-manifest/ "${PLAN_DIR}/season-plan.csv" "${PLAN_DIR}/excluded-seasons.csv" "${PLAN_DIR}/summary.json"
          if [[ -d data/footystats/resumable-ingestion ]]; then
            git add data/footystats/resumable-ingestion/
          fi
          if git diff --cached --quiet; then
            echo "No sanitized outputs to commit."
            exit 0
          fi
          git commit -m "data: save sanitized FootyStats preflight run ${GITHUB_RUN_ID}"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GOVERNED_BRANCH}"
            if ! git rebase "origin/${GOVERNED_BRANCH}"; then
              git rebase --abort || true
              echo "Sanitized-output rebase conflicted (attempt ${attempt}/5); retrying from the latest branch head."
              sleep $((attempt * 2))
              continue
            fi
            if git push origin "HEAD:${GOVERNED_BRANCH}"; then
              pushed=true
              break
            fi
            echo "Research branch advanced during sanitized-output push (attempt ${attempt}/5); retrying without force."
            sleep $((attempt * 2))
          done
          [[ "${pushed}" == "true" ]] || { echo "::error::Could not safely publish sanitized outputs after five attempts; artifact upload remains available."; exit 1; }

      - name: Upload sanitized preflight report and ingestion manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footystats-sanitized-preflight-and-ingestion-plan-${{ github.run_id }}
          path: |
            data/footystats/endpoint-preflight/footystats-preflight-run-${{ github.run_id }}.json
            data/footystats/full-ingestion-manifest/*.csv
            data/footystats/full-ingestion-manifest/summary.json
            data/footystats/resumable-ingestion/*.csv
            data/footystats/resumable-ingestion/summary.json
          if-no-files-found: warn
          retention-days: 30
