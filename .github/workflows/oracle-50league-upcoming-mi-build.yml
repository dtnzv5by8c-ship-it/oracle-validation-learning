name: Oracle 50-League Upcoming Fixture + MI Build

on:
  push:
    paths:
      - ".github/workflows/oracle-50league-upcoming-mi-build.yml"
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-upcoming-50-mi-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
      LOOKAHEAD_DAYS: "7"
    steps:
      - uses: actions/checkout@v4

      - name: Validate provider secret
        run: test -n "${FOOTYSTATS_API_KEY:-}"

      - name: Build governed 50-league fixture spine and pre-match FootyStats intelligence
        shell: python
        run: |
          import csv,json,os,re,time,unicodedata
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request,urlopen

          API=os.environ["FOOTYSTATS_API_KEY"]
          now=datetime.now(timezone.utc)
          start=now.date()
          end=(now+timedelta(days=int(os.environ.get("LOOKAHEAD_DAYS","7")))).date()
          if end < start or (end-start).days > 14:
              raise SystemExit("Invalid rolling fixture window")

          selected_ids={
            "16571","17326","17181","17171","16544","16741","16615","16789","16614","17087",
            "17157","17091","16714","17146","17184","17180","16572","17102","17117","17210",
            "17212","17356","17964","17084","17404","17115","17099","17097","16558","16533",
            "16905","17112","17215","16537","17247","17178","17426","17148","17119","17444",
            "16627","17199","17269","16576","17129","17265","16504","17191","16708","16617"
          }

          def norm(x):
              return re.sub(r"[^a-z0-9]+","",unicodedata.normalize("NFKD",str(x or "")).encode("ascii","ignore").decode().lower())

          def api(path,params):
              url="https://api.football-data-api.com/"+path+"?"+urlencode({"key":API,**params})
              req=Request(url,headers={"User-Agent":"Oracle-50-League-Upcoming-MI/1.1"})
              # FootyStats can return HTTP 429 when the provider quota/rate window is saturated.
              # Retry with provider-supplied Retry-After when available, otherwise use capped
              # exponential backoff. Never substitute stale data, estimates, or fallback sources.
              for attempt in range(8):
                  try:
                      with urlopen(req,timeout=60) as rr:
                          p=json.loads(rr.read().decode("utf-8"))
                      if p.get("success") is not True:
                          raise RuntimeError(path+" success=false")
                      return p
                  except Exception as e:
                      if getattr(e,"code",None)==429 and attempt<7:
                          retry_after=None
                          try:
                              retry_after=float(e.headers.get("Retry-After"))
                          except Exception:
                              retry_after=None
                          delay=retry_after if retry_after is not None else min(300,30*(2**attempt))
                          print(f"FootyStats HTTP 429 on {path}; retry {attempt+1}/7 after {delay:.0f}s",flush=True)
                          time.sleep(max(1,delay))
                          continue
                      raise

          def date_of(m):
              ts=m.get("date_unix")
              return datetime.fromtimestamp(float(ts),tz=timezone.utc).date().isoformat() if ts is not None else ""

          fixtures=[]
          retrievals=[]
          d=start
          while d<=end:
              page=1
              while True:
                  p=api("todays-matches",{"date":d.isoformat(),"timezone":"Etc/UTC","page":page})
                  for m in p.get("data") or []:
                      if str(m.get("competition_id") or "") in selected_ids:
                          fixtures.append(m)
                  pager=p.get("pager") or {}
                  max_page=int(pager.get("max_page") or page)
                  if page>=max_page: break
                  page+=1
              retrievals.append({"date":d.isoformat(),"retrieved_utc":datetime.now(timezone.utc).isoformat()})
              d+=timedelta(days=1)

          # Exact provider fixture identity is the authoritative spine.
          unique={}
          for m in fixtures:
              fid=str(m.get("id") or "")
              if fid: unique[fid]=m
          fixtures=list(unique.values())
          fixtures.sort(key=lambda m:(date_of(m),str(m.get("date_unix") or ""),str(m.get("competition_id") or ""),norm(m.get("home_name")),norm(m.get("away_name"))))

          out=Path("oracle_upcoming_50"); out.mkdir(exist_ok=True)
          spine=[]
          for m in fixtures:
              ts=m.get("date_unix")
              kickoff=datetime.fromtimestamp(float(ts),tz=timezone.utc).isoformat() if ts is not None else ""
              spine.append({
                "fixture_id":str(m.get("id")),
                "date":date_of(m),
                "kickoff_utc":kickoff,
                "home_team":m.get("home_name") or "",
                "away_team":m.get("away_name") or "",
                "league_season_id":str(m.get("competition_id") or ""),
                "provider_home_id":str(m.get("homeID") or ""),
                "provider_away_id":str(m.get("awayID") or ""),
                "provider":"FootyStats",
                "provider_status":m.get("status") or "",
                "provider_season":m.get("season") or "",
                "identity_status":"EXACT_PROVIDER_FIXTURE_ID",
              })

          with (out/"governed_50league_upcoming_fixtures.csv").open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(spine[0].keys()) if spine else ["fixture_id"])
              w.writeheader(); w.writerows(spine)

          # Pull exact pre-match league-team snapshots for every fixture's season.
          # Do this sequentially and only once per season; never fan out provider calls.
          team_cache={}
          for sid in sorted({r["league_season_id"] for r in spine if r["league_season_id"]}):
              # Earliest kickoff in this season/window is the conservative snapshot cutoff.
              cut=min(int(float(m["date_unix"])) for m in fixtures if str(m.get("competition_id") or "")==sid and m.get("date_unix") is not None)-1
              p=api("league-teams",{"season_id":sid,"include":"stats","max_time":cut})
              team_cache[sid]=(p.get("data") or [],cut)

          def flat(t):
              s=t.get("stats")
              if isinstance(s,dict): return {**t,**s}
              if isinstance(s,list) and s and isinstance(s[0],dict): return {**t,**s[0]}
              return t
          def get(t,*keys):
              t=flat(t)
              for k in keys:
                  if k in t and t[k] not in (None,"","null"): return t[k]
              return None

          metrics=[
            ("PPG","seasonPPG_overall"),("PPG_HOME","seasonPPG_home"),("PPG_AWAY","seasonPPG_away"),
            ("GF_M","seasonAVG_goals_scored","goals_scored_per_match","avg_goals_scored"),
            ("GA_M","seasonAVG_goals_conceded","goals_conceded_per_match","avg_goals_conceded"),
            ("AVG_GOALS","seasonAVG_total_goals","average_goals"),
            ("BTTS_PCT","seasonBTTSPercentage","btts_percentage"),
            ("OVER15_PCT","seasonOver15Percentage","over15_percentage"),
            ("OVER25_PCT","seasonOver25Percentage","over25_percentage"),
            ("OVER35_PCT","seasonOver35Percentage","over35_percentage"),
            ("UNDER45_PCT","seasonUnder45Percentage","under45_percentage"),
          ]

          intel=[]
          for r in spine:
              sid=r["league_season_id"]
              teams,cut=team_cache.get(sid,([],None))
              byid={str(t.get("id")):t for t in teams if isinstance(t,dict) and t.get("id") is not None}
              for side,tid in (("HOME",r["provider_home_id"]),("AWAY",r["provider_away_id"])):
                  t=byid.get(str(tid))
                  for code,*keys in metrics:
                      v=get(t,*keys) if t else None
                      intel.append({
                        "fixture_id":r["fixture_id"],"date":r["date"],"kickoff_utc":r["kickoff_utc"],
                        "home_team":r["home_team"],"away_team":r["away_team"],"league_season_id":sid,
                        "side":side,"metric":code,"value":v if v is not None else "UNAVAILABLE",
                        "source":"FootyStats league-teams","snapshot_cutoff_utc":datetime.fromtimestamp(cut,tz=timezone.utc).isoformat() if cut else "",
                        "pre_match_status":"VERIFIED_PRE_KICKOFF" if cut else "UNVERIFIED",
                        "status":"DIRECT_PROVIDER" if v is not None else "UNAVAILABLE"
                      })

          # Fixture-specific Last-5: use authoritative season match history with a strict kickoff cutoff.
          # The prior lastx endpoint had no fixture-specific cutoff provenance and was not safe for promotion.
          season_matches={}
          for sid in sorted({r["league_season_id"] for r in spine if r["league_season_id"]}):
              rows=[]
              page=1
              while True:
                  p=api("league-matches",{"season_id":sid,"page":page,"max_per_page":1000})
                  rows.extend(p.get("data") or [])
                  pager=p.get("pager") or {}
                  mx=int(pager.get("max_page") or page)
                  if page>=mx: break
                  page+=1
              season_matches[sid]=rows

          def num(x):
              try: return float(x)
              except Exception: return None

          def match_epoch(m):
              for k in ("date_unix","date"):
                  if m.get(k) not in (None,""):
                      try:
                          return float(m[k]) if k=="date_unix" else datetime.fromisoformat(str(m[k]).replace("Z","+00:00")).timestamp()
                      except Exception: pass
              return None

          def score(m,team_id):
              hg=next((m.get(k) for k in ("homeGoalCount","home_goals","homeGoals","home_score") if m.get(k) not in (None,"")),None)
              ag=next((m.get(k) for k in ("awayGoalCount","away_goals","awayGoals","away_score") if m.get(k) not in (None,"")),None)
              hg=num(hg); ag=num(ag)
              if hg is None or ag is None: return None
              ishome=str(m.get("homeID") or "")==str(team_id)
              gf,ga=(hg,ag) if ishome else (ag,hg)
              return gf,ga,("W" if gf>ga else "D" if gf==ga else "L")

          def last5_for(sid,team_id,kickoff_unix,venue=None):
              rows=[]
              for m in season_matches.get(sid,[]):
                  mt=match_epoch(m)
                  if mt is None or mt>=kickoff_unix: continue
                  is_home=str(m.get("homeID") or "")==str(team_id)
                  is_away=str(m.get("awayID") or "")==str(team_id)
                  if not (is_home or is_away): continue
                  if venue=="home" and not is_home: continue
                  if venue=="away" and not is_away: continue
                  sc=score(m,team_id)
                  if sc is not None: rows.append((mt,sc))
              rows.sort(key=lambda x:x[0],reverse=True); rows=rows[:5]
              if not rows: return {"form":"UNAVAILABLE","ppg":"UNAVAILABLE","gf_m":"UNAVAILABLE","ga_m":"UNAVAILABLE","sample":0,"cutoff":""}
              pts=sum(3 if x[1][2]=="W" else 1 if x[1][2]=="D" else 0 for x in rows)
              gf=sum(x[1][0] for x in rows); ga=sum(x[1][1] for x in rows)
              return {"form":" ".join(x[1][2] for x in rows),"ppg":pts/len(rows),"gf_m":gf/len(rows),"ga_m":ga/len(rows),"sample":len(rows),"cutoff":datetime.fromtimestamp(kickoff_unix,tz=timezone.utc).isoformat()}

          def h2h_for(sid,home_id,away_id,kickoff_unix):
              rows=[]
              for m in season_matches.get(sid,[]):
                  mt=match_epoch(m)
                  if mt is None or mt>=kickoff_unix: continue
                  if str(m.get("homeID") or "")!=str(home_id) or str(m.get("awayID") or "")!=str(away_id):
                      continue
                  hg=num(next((m.get(k) for k in ("homeGoalCount","home_goals","homeGoals","home_score") if m.get(k) not in (None,"")),None))
                  ag=num(next((m.get(k) for k in ("awayGoalCount","away_goals","awayGoals","away_score") if m.get(k) not in (None,"")),None))
                  if hg is None or ag is None: continue
                  rows.append((mt,hg,ag))
              rows.sort(key=lambda x:x[0],reverse=True)
              n=len(rows)
              if n==0:
                  return {"sample":0,"home_wins":"UNAVAILABLE","draws":"UNAVAILABLE","away_wins":"UNAVAILABLE","btts_pct":"UNAVAILABLE","over25_pct":"UNAVAILABLE","avg_goals":"UNAVAILABLE","last_meeting_utc":"UNAVAILABLE","status":"UNAVAILABLE_NO_AUTHORITATIVE_H2H"}
              return {
                  "sample":n,
                  "home_wins":sum(h> a for _,h,a in rows),
                  "draws":sum(h==a for _,h,a in rows),
                  "away_wins":sum(h< a for _,h,a in rows),
                  "btts_pct":100*sum(h>0 and a>0 for _,h,a in rows)/n,
                  "over25_pct":100*sum((h+a)>2.5 for _,h,a in rows)/n,
                  "avg_goals":sum(h+a for _,h,a in rows)/n,
                  "last_meeting_utc":datetime.fromtimestamp(rows[0][0],tz=timezone.utc).isoformat(),
                  "status":"VERIFIED_PRE_KICKOFF"
              }

          intel_by_fixture={}
          for z in intel:
              k=(z["fixture_id"],z["side"])
              intel_by_fixture.setdefault(k,{})
              intel_by_fixture[k][z["metric"]]=z["value"]

          mi=[]
          snap=datetime.now(timezone.utc).isoformat()
          for r in spine:
              kickoff_unix=float(datetime.fromisoformat(r["kickoff_utc"].replace("Z","+00:00")).timestamp())
              h_over=last5_for(r["league_season_id"],r["provider_home_id"],kickoff_unix)
              a_over=last5_for(r["league_season_id"],r["provider_away_id"],kickoff_unix)
              h_venue=last5_for(r["league_season_id"],r["provider_home_id"],kickoff_unix,"home")
              a_venue=last5_for(r["league_season_id"],r["provider_away_id"],kickoff_unix,"away")
              hh=h2h_for(r["league_season_id"],r["provider_home_id"],r["provider_away_id"],kickoff_unix)
              row={
                **r,
                "home_last5_form":h_over["form"],"away_last5_form":a_over["form"],
                "home_last5_ppg":h_over["ppg"],"away_last5_ppg":a_over["ppg"],
                "home_last5_gf_m":h_over["gf_m"],"away_last5_gf_m":a_over["gf_m"],
                "home_last5_ga_m":h_over["ga_m"],"away_last5_ga_m":a_over["ga_m"],
                "home_venue_last5_form":h_venue["form"],"away_venue_last5_form":a_venue["form"],
                "home_venue_ppg":h_venue["ppg"],"away_venue_ppg":a_venue["ppg"],
                "home_venue_gf_m":h_venue["gf_m"],"away_venue_gf_m":a_venue["gf_m"],
                "home_venue_ga_m":h_venue["ga_m"],"away_venue_ga_m":a_venue["ga_m"],
                "home_overall_sample":h_over["sample"],"away_overall_sample":a_over["sample"],
                "home_venue_sample":h_venue["sample"],"away_venue_sample":a_venue["sample"],
                "home_last5_cutoff_utc":h_over["cutoff"],"away_last5_cutoff_utc":a_over["cutoff"],
                "home_venue_cutoff_utc":h_venue["cutoff"],"away_venue_cutoff_utc":a_venue["cutoff"],
                "footystats_snapshot_utc":snap,
                "last5_status":"VERIFIED_PRE_KICKOFF" if h_over["sample"]==5 and a_over["sample"]==5 else "UNAVAILABLE_INSUFFICIENT_SAMPLE",
                "venue_last5_status":"VERIFIED_PRE_KICKOFF" if h_venue["sample"]==5 and a_venue["sample"]==5 else "UNAVAILABLE_INSUFFICIENT_SAMPLE",
                "last5_source":"FootyStats league-matches",
                "h2h_sample_n":hh["sample"],"h2h_home_wins":hh["home_wins"],"h2h_draws":hh["draws"],"h2h_away_wins":hh["away_wins"],
                "h2h_btts_pct":hh["btts_pct"],"h2h_over25_pct":hh["over25_pct"],"h2h_avg_goals":hh["avg_goals"],
                "h2h_last_meeting_utc":hh["last_meeting_utc"],"h2h_status":hh["status"],
                "xg_status":"UNVERIFIED_NO_CAPTURE_TIMESTAMP",
                "intelligence_status":"DIRECT_PROVIDER_PREMATCH"
              }
              for side in ("HOME","AWAY"):
                  vals=intel_by_fixture.get((r["fixture_id"],side),{})
                  prefix="home_" if side=="HOME" else "away_"
                  for code,v in vals.items():
                      row[f"fs_{prefix}{code.lower()}"]=v
                      row[f"fs_{prefix}{code.lower()}_source"]="FootyStats league-teams"
                      row[f"fs_{prefix}{code.lower()}_snapshot_cutoff_utc"]=next((z["snapshot_cutoff_utc"] for z in intel if z["fixture_id"]==r["fixture_id"] and z["side"]==side), "")
                      row[f"fs_{prefix}{code.lower()}_status"]="VERIFIED_PRE_KICKOFF" if v not in (None,"UNAVAILABLE") else "UNAVAILABLE"
              mi.append(row)

          # The first MI construction above is authoritative.
          # Do not overwrite it with a second path that referenced an undefined LastX cache.
          with (out/"footystats_market_intelligence.csv").open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(mi[0].keys()) if mi else ["fixture_id"])
              w.writeheader(); w.writerows(mi)

          actual_dates=sorted({r["date"] for r in spine if r.get("date")})
          summary={
            "window_start":start.isoformat(),"window_end":end.isoformat(),
            "fixture_date_min":actual_dates[0] if actual_dates else "",
            "fixture_date_max":actual_dates[-1] if actual_dates else "",
            "governed_leagues":50,
            "fixture_rows":len(spine),"unique_provider_fixture_ids":len({r["fixture_id"] for r in spine}),
            "season_ids_with_fixtures":len({r["league_season_id"] for r in spine}),
            "retrievals":retrievals,"provider":"FootyStats",
            "private_repository_used":False,"fuzzy_matching_used":False,
            "historical_fallback_used":False,"production_model_logic_changed":False,
            "market_intelligence_A_ET_changed":False,"pre_match_only":True,
            "season_match_rows":sum(len(v) for v in season_matches.values()),"last5_fully_verified_fixtures":sum(1 for x in mi if x["last5_status"]=="VERIFIED_PRE_KICKOFF"),
            "generated_utc":snap
          }
          (out/"build_summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          print(json.dumps(summary,indent=2))

          if not spine:
              raise SystemExit("FAIL-CLOSED: no governed 50-league fixtures returned for requested window")

          # Persist only rolling current artifacts. No dated frozen spine is written.
          import shutil
          Path("data/fixtures").mkdir(parents=True,exist_ok=True)
          shutil.copyfile(out/"governed_50league_upcoming_fixtures.csv","data/fixtures/governed_50league_current.csv")
          summary["current_fixture_spine_path"]="data/fixtures/governed_50league_current.csv"
          summary["current_mi_path"]="oracle_upcoming_50/footystats_market_intelligence.csv"
          (Path("data/fixtures")/"governed_50league_current_manifest.json").write_text(
              json.dumps(summary,indent=2),encoding="utf-8"
          )

      - name: Validate rolling current fixture spine persistence
        run: |
          set -euo pipefail
          test -s data/fixtures/governed_50league_current.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("data/fixtures/governed_50league_current.csv")
          rows=list(csv.DictReader(p.open(newline="",encoding="utf-8")))
          assert rows, "FAIL-CLOSED: current governed fixture spine is empty"
          ids=[r["fixture_id"] for r in rows]
          assert len(ids)==len(set(ids)), "FAIL-CLOSED: duplicate provider fixture IDs"
          assert all(r.get("identity_status")=="EXACT_PROVIDER_FIXTURE_ID" for r in rows)
          import json
          manifest=json.loads(Path("data/fixtures/governed_50league_current_manifest.json").read_text())
          dates=sorted(r["date"] for r in rows if r.get("date"))
          assert manifest.get("fixture_rows")==len(rows), "FAIL-CLOSED: manifest row count mismatch"
          assert manifest.get("unique_provider_fixture_ids")==len(set(ids)), "FAIL-CLOSED: manifest fixture-ID count mismatch"
          assert manifest.get("fixture_date_min")==dates[0] and manifest.get("fixture_date_max")==dates[-1], "FAIL-CLOSED: manifest fixture-date bounds mismatch"
          print({"rows":len(rows),"unique_fixture_ids":len(set(ids)),"date_min":dates[0],"date_max":dates[-1]})
          PY

      - name: Persist rolling current fixture and MI artifacts
        run: |
          set -euo pipefail
          git config user.name "oracle-50league-current-mi-bot"
          git config user.email "oracle-50league-current-mi-bot@users.noreply.github.com"
          # Rolling-current artifacts are singleton governed outputs. Concurrent current-data
          # writers can legitimately update the same files while this provider build is running.
          # Never merge generated CSV/JSON histories and never force-push. Instead refresh main,
          # overlay this freshly validated artifact set, and push the resulting latest-main commit.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp data/fixtures/governed_50league_current.csv "$tmpdir/"
          cp data/fixtures/governed_50league_current_manifest.json "$tmpdir/"
          cp oracle_upcoming_50/footystats_market_intelligence.csv "$tmpdir/"
          cp oracle_upcoming_50/governed_50league_upcoming_fixtures.csv "$tmpdir/"
          cp oracle_upcoming_50/build_summary.json "$tmpdir/"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            mkdir -p data/fixtures oracle_upcoming_50
            cp "$tmpdir/governed_50league_current.csv" data/fixtures/governed_50league_current.csv
            cp "$tmpdir/governed_50league_current_manifest.json" data/fixtures/governed_50league_current_manifest.json
            cp "$tmpdir/footystats_market_intelligence.csv" oracle_upcoming_50/footystats_market_intelligence.csv
            cp "$tmpdir/governed_50league_upcoming_fixtures.csv" oracle_upcoming_50/governed_50league_upcoming_fixtures.csv
            cp "$tmpdir/build_summary.json" oracle_upcoming_50/build_summary.json
            git add data/fixtures/governed_50league_current.csv data/fixtures/governed_50league_current_manifest.json oracle_upcoming_50/footystats_market_intelligence.csv oracle_upcoming_50/governed_50league_upcoming_fixtures.csv oracle_upcoming_50/build_summary.json
            if git diff --cached --quiet; then
              echo "No rolling-current changes."
              exit 0
            fi
            git commit -m "Persist rolling 50-league current fixture and MI artifacts"
            if git push origin HEAD:main; then
              echo "Rolling-current artifacts persisted on main."
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "FAIL-CLOSED: could not persist rolling-current artifacts after 5 safe latest-main refresh attempts."
          exit 1

      - name: Upload 50-league fixture and MI evidence
        uses: actions/upload-artifact@v4
        with:
          name: oracle-50league-omi-rolling-current
          path: oracle_upcoming_50/
          retention-days: 30

