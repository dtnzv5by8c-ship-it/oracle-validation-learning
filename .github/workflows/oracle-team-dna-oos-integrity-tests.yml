name: Oracle Team DNA OOS Integrity Tests
on:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - scripts/build_oracle_team_market_oos_profiles.py
      - tests/test_build_oracle_team_market_oos_profiles.py
      - .github/workflows/oracle-team-dna-oos-integrity-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile research-only script
        run: python -m py_compile scripts/build_oracle_team_market_oos_profiles.py
      - name: Run research-only tests
        run: python -m unittest discover -s tests -p "test_build_oracle_team_market_oos_profiles.py" -v
