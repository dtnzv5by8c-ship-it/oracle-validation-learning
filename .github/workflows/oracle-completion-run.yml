      - name: Upload sanitized aggregate completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-sanitized-completion-report
          path: /tmp/oracle-completion-report.json
          retention-days: 14

      - name: Upload fixture-level predictions and reconciliation inputs
        if: steps.live.outcome == 'success' && steps.reconcile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-fixture-level-predictions
          path: |
            oracle/data/fixtures/oracle_upcoming_fixtures.csv
            oracle/data/fixtures/oracle_upcoming_fixtures_manifest.json
            oracle/research/four_model/outputs/four_model_live_predictions.csv
            oracle/research/four_model/outputs/four_model_live_prediction_manifest.json
            /tmp/oracle-fixture-audit.json
            /tmp/oracle-live-reconciliation.json
            /tmp/oracle-completion-report.json
          if-no-files-found: error
          retention-days: 14
