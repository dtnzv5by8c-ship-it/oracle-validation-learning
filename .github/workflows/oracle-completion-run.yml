
name: Oracle Completion Run

on:
  push:
    branches: [main, reporting/visual-intelligence-enrichment]
    paths:
      - ".github/workflows/oracle-completion-run.yml"
      - "scripts/build_visual_intelligence.py"
      - "scripts/build_curated_visual_report.py"
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Fixture ingestion window"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "15"
          - "30"
          

permissions:
  contents: read

concurrency:
  group: oracle-completion-run
  cancel-in-progress: false

jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out reporting and workflow repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Clone governed private Oracle source
        env:
          ORACLE_READ_TOKEN: ${{ secrets.ORACLE_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ORACLE_READ_TOKEN}" ]; then
            echo "ERROR: ORACLE_READ_TOKEN secret is missing."
            exit 1
          fi
          git clone --depth 1 --branch fix/epl-btts-team-state-aliases \
            "https://x-access-token:${ORACLE_READ_TOKEN}@github.com/dtnzv5by8c-ship-it/oracle-football-data.git" oracle
          echo "SOURCE_COMMIT=$(git -C oracle rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Source commit: $(git -C oracle rev-parse HEAD)"
          echo "Governed alias correction refresh: 015df644864392501ad0173b6350dd3a15d10e1f"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn requests beautifulsoup4 openpyxl reportlab

      - name: Verify historical spine and source scripts
        working-directory: oracle
        run: |
          set -euo pipefail
          echo "1836e220bcad535ab6d8e5885cffaf4b7c81593a4df97a0f410de3d17d07d2bc  database/matches.csv" | sha256sum --check -
          echo "1932edf73e29d2df1400bf25e9ec763f6d7ce272fc003b48f0d115b295432e78  database/prematch_team_state.csv" | sha256sum --check -
          python -m py_compile scripts/ingest_upcoming_fixtures.py scripts/oracle_btts_cohort_gate_v1.py scripts/oracle_all_markets_walk_forward_v1.py scripts/oracle_four_model_live_predict.py

      - name: Refresh verified current results and rebuild prematch team state
        id: current_state_refresh
        working-directory: oracle
        run: |
          set -euo pipefail
          python scripts/ingest_current_fotmob.py
          python scripts/reconcile_current_data.py
          python scripts/reconcile_current_sources.py
          python scripts/build_current_team_state.py
          python - <<'PY'
          import csv, json
          from pathlib import Path
          manifest=Path("data/current_source_manifest.json")
          state_manifest=Path("data/current_team_state_manifest.json")
          matches=Path("database/current_matches.csv")
          assert manifest.exists(), "Current source manifest missing after refresh"
          assert state_manifest.exists(), "Team-state manifest missing after rebuild"
          assert matches.exists(), "Current matches file missing after refresh"
          m=json.loads(manifest.read_text())
          sm=json.loads(state_manifest.read_text())
          rows=list(csv.DictReader(matches.open(encoding="utf-8", newline="")))
          completed=[r for r in rows if str(r.get("finished","")).lower()=="true" and str(r.get("cancelled","")).lower()!="true" and r.get("home_goals") not in ("",None) and r.get("away_goals") not in ("",None)]
          latest=m.get("latest_completed_match_utc")
          if not completed or not latest:
              raise SystemExit("BLOCKED: no verified recent completed results were ingested; refusing to call team state fresh.")
          print(json.dumps({"current_match_rows":len(rows),"completed_score_rows":len(completed),"latest_completed_match_utc":latest,"team_state_rows":sm.get("rows"),"team_state_generated_utc":sm.get("generated_utc"),"history_window":sm.get("history_window")},indent=2))
          PY

      - name: Refresh upcoming fixtures from public sources and OpenFoot fallback
        id: ingest
        working-directory: oracle
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
          DAYS_AHEAD: ${{ inputs.days_ahead }}
        run: |
          set -euo pipefail
          if [ -z "${OPENFOOT_API_KEY:-}" ]; then
            echo "ERROR: OPENFOOT_API_KEY secret is missing; refusing the ingestion script's demo-key fallback."
            exit 1
          fi
          # On push-triggered runs, workflow_dispatch inputs are empty.
          # Match the governed workflow_dispatch default (3 days) to avoid silently
          # broadening the forecast horizon on automatic runs.
          DAYS_AHEAD="${DAYS_AHEAD:-7}"
          if ! [[ "$DAYS_AHEAD" =~ ^[0-9]+$ ]] || [ "$DAYS_AHEAD" -lt 1 ] || [ "$DAYS_AHEAD" -gt 31 ]; then
            echo "ERROR: DAYS_AHEAD must be an integer from 1 to 31; got '$DAYS_AHEAD'."
            exit 1
          fi
          echo "Fixture ingestion window: $DAYS_AHEAD days ahead."
          python scripts/ingest_upcoming_fixtures.py "$DAYS_AHEAD" data/fixtures/oracle_upcoming_fixtures.csv

      - name: Audit fixture coverage and prematch state readiness
        id: audit
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          schedule=Path("data/fixtures/oracle_upcoming_fixtures.csv")
          manifest=Path("data/fixtures/oracle_upcoming_fixtures_manifest.json")
          report={"schedule_file_present":schedule.exists(),"manifest_present":manifest.exists()}
          if schedule.exists():
              f=pd.read_csv(schedule)
              report.update({"fixture_count":int(len(f)),
                "league_count":int(f.league_code.nunique()) if len(f) and "league_code" in f else 0,
                "fixture_rows_missing_team":int(f[["home_team","away_team"]].isna().any(axis=1).sum()) if len(f) else 0,
                "duplicate_fixture_rows":int(f.duplicated(["league_code","date","home_team","away_team"]).sum()) if len(f) else 0})
              if "kickoff_time" in f:
                  missing=f["kickoff_time"].isna() | f["kickoff_time"].astype(str).str.strip().isin(["","nan","None"])
                  report["fixtures_missing_verified_kickoff"]=int(missing.sum())
                  report["fixtures_with_verified_kickoff"]=int((~missing).sum())
                  if "league_code" in f:
                      report["missing_kickoff_by_league"]={str(k):int(v) for k,v in f.loc[missing].groupby("league_code").size().to_dict().items()}
          if manifest.exists():
              m=json.loads(manifest.read_text()); targets=m.get("targets",{})
              report.update({"configured_leagues":int(m.get("active_leagues",0)),
                "source_error_count":int(m.get("source_error_count",0)),
                "league_status_counts":{k:sum(1 for v in targets.values() if v.get("status")==k) for k in sorted({v.get("status","UNKNOWN") for v in targets.values()})}})
          state_path=Path("database/current_prematch_team_state.csv")
          if state_path.exists() and schedule.exists():
              s=pd.read_csv(state_path); report["current_state_rows"]=int(len(s))
              report["current_state_date_max"]=str(s["date"].max()) if len(s) and "date" in s else None
          else:
              report["current_state_rows"]=None; report["current_state_date_max"]=None
          source_manifest=Path("data/current_source_manifest.json")
          if source_manifest.exists():
              sm=json.loads(source_manifest.read_text())
              report["latest_completed_result_utc"]=sm.get("latest_completed_match_utc")
              report["current_source_generated_utc"]=sm.get("generated_utc")
              report["completed_match_rows"]=int(sm.get("completed_match_rows",0))
          else:
              report["latest_completed_result_utc"]=None
              report["current_source_generated_utc"]=None
              report["completed_match_rows"]=0
          state_manifest=Path("data/current_team_state_manifest.json")
          if state_manifest.exists():
              report["team_state_generated_utc"]=json.loads(state_manifest.read_text()).get("generated_utc")
          Path("/tmp/oracle-fixture-audit.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Run 22-market chronological out-of-sample benchmark
        id: backtest
        working-directory: oracle
        run: |
          set -euo pipefail
          python scripts/oracle_all_markets_walk_forward_v1.py

      - name: Gate live prediction on fresh verified team state
        id: freshness_gate
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          report_path=Path("/tmp/oracle-fixture-audit.json")
          if not report_path.exists():
              raise SystemExit("BLOCKED: fixture audit report is missing; refusing live predictions.")
          report=json.loads(report_path.read_text())
          latest=report.get("latest_completed_result_utc")
          if not latest:
              raise SystemExit("BLOCKED: verified latest completed-result timestamp is unavailable.")
          try:
              state_date=date.fromisoformat(str(latest)[:10])
          except ValueError:
              raise SystemExit(f"BLOCKED: invalid latest completed-result timestamp: {latest!r}")
          age=(date.today()-state_date).days
          print(json.dumps({
              "latest_completed_result_utc":str(latest),
              "latest_completed_result_date":str(state_date),
              "result_age_days":age,
              "team_state_generated_utc":report.get("team_state_generated_utc"),
              "maximum_allowed_age_days":3
          },indent=2))
          if age < 0 or age > 3:
              raise SystemExit("BLOCKED: latest verified completed results are stale or future-dated; refusing live predictions.")
          PY

      - name: Run current governed live prediction runner (22-market output)
        id: live
        working-directory: oracle
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/oracle_four_model_live_predict.py

      - name: Reconcile 22-market live predictions
        id: reconcile
        working-directory: oracle
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.live.outcome }}" != "success" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          result={"status":"BLOCKED","reason":"live_prediction_step_not_successful; stale or unverified outputs must not be reconciled as current","calibration":"NOT_APPLIED","promotion":"BLOCKED"}
          Path("/tmp/oracle-live-reconciliation.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("research/four_model/outputs")
          pred_path=root/"four_model_live_predictions.csv"
          manifest_path=root/"four_model_live_prediction_manifest.json"
          exclusions_path=root/"four_model_schedule_filter_exclusions.csv"
          assert pred_path.exists(), "Missing live prediction CSV"
          assert manifest_path.exists(), "Missing live prediction manifest"
          pred=pd.read_csv(pred_path)
          manifest=json.loads(manifest_path.read_text())
          expected=[
            "BTTS_YES","BTTS_NO","HOME_1X","AWAY_X2","HOME_12",
            "OVER_1_5","OVER_2_5","OVER_3_5","UNDER_1_5","UNDER_2_5",
            "UNDER_3_5","UNDER_4_5","HOME_O05","HOME_O15","AWAY_O05","AWAY_O15",
            "HOME_1X_O15","AWAY_X2_O15","HOME_1X_U45","AWAY_X2_U45","M1UP_HOME","M1UP_AWAY"
          ]
          assert set(manifest.get("markets",[])) == set(expected), f"Manifest market mismatch: {manifest.get('markets')}"
          assert set(pred.selection.dropna().unique()) == set(expected), f"Output market mismatch: {sorted(pred.selection.dropna().unique())}"
          fixture_n=int(pred.fixture_id.nunique()) if len(pred) else 0
          assert len(pred)==fixture_n*22, f"Rows do not reconcile: {len(pred)} rows for {fixture_n} fixtures"
          assert pred.groupby("fixture_id").selection.nunique().eq(22).all(), "At least one fixture lacks one or more market rows"
          predicted=pred[pred.status.eq("PREDICTED")]
          assert predicted.raw_probability.notna().all(), "PREDICTED row has missing probability"
          assert predicted.raw_probability.between(0,1).all(), "Probability outside [0,1]"
          assert pred.fixture_date.notna().all(), "A prediction has no verified fixture date"
          assert pred[["state_date_home","state_date_away","fixture_date"]].notna().all().all(), "Missing cutoff audit field"
          assert (pd.to_datetime(pred.state_date_home)<pd.to_datetime(pred.fixture_date)).all(), "Home state is not strictly prematch"
          assert (pd.to_datetime(pred.state_date_away)<pd.to_datetime(pred.fixture_date)).all(), "Away state is not strictly prematch"
          if exclusions_path.exists() and exclusions_path.stat().st_size > 0:
              try:
                  exclusions=pd.read_csv(exclusions_path)
              except pd.errors.EmptyDataError:
                  exclusions=pd.DataFrame()
          else:
              # A zero-byte ledger is valid when there are no schedule exclusions.
              exclusions=pd.DataFrame()
          reason_counts=exclusions.reason.value_counts().to_dict() if len(exclusions) and "reason" in exclusions else {}
          result={
            "status":"PASS","fixture_count":fixture_n,"prediction_rows":len(pred),
            "markets":sorted(expected),"predicted_rows":len(predicted),
            "no_prediction_rows":int(len(pred)-len(predicted)),
            "probability_completeness":float(predicted.raw_probability.notna().mean()) if len(predicted) else 0.0,
            "fixture_date_complete":bool(pred.fixture_date.notna().all()) if len(pred) else True,
            "kickoff_time_available":bool(pred.kickoff_utc.notna().all()) if len(pred) else True,
            "kickoff_time_required_for_eligibility":False,
            "strict_prematch_state":True,"schedule_exclusion_reason_counts":reason_counts,
            "calibration":"NOT_APPLIED","promotion":"BLOCKED"
          }
          Path("/tmp/oracle-live-reconciliation.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Build sanitized completion report
        if: always()
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          BACKTEST_OUTCOME: ${{ steps.backtest.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          root=Path("oracle")
          report={
              "artifact":"ORACLE-COMPLETION-RUN",
              "source_commit":os.environ.get("SOURCE_COMMIT"),
              "stage_outcomes":{
                  "fixture_ingestion":os.environ.get("INGEST_OUTCOME"),
                  "fixture_state_audit":os.environ.get("AUDIT_OUTCOME"),
                  "22_market_historical_backtest":os.environ.get("BACKTEST_OUTCOME"),
                  "22_market_live_runner":os.environ.get("LIVE_OUTCOME"),
                  "live_reconciliation":os.environ.get("RECONCILE_OUTCOME")
              },
              "historical_baseline_mutated":False,
              "fixture_level_rows_in_artifact":False,
              "production_promotion":"NOT_ALLOWED"
          }
          recon=Path("/tmp/oracle-live-reconciliation.json")
          if recon.exists(): report["live_reconciliation"]=json.loads(recon.read_text())
          audit=Path("/tmp/oracle-fixture-audit.json")
          if audit.exists(): report["fixture_audit"]=json.loads(audit.read_text())
          summary=root/"research/all_markets/oracle_all_markets_oos_summary.csv"
          if summary.exists():
              df=pd.read_csv(summary)
              report["market_summary"]=df.where(pd.notna(df),None).to_dict(orient="records")
              report["markets_evaluated"]=int(df.market.nunique()) if "market" in df else 0
          manifest=root/"research/all_markets/oracle_all_markets_manifest.json"
          if manifest.exists(): report["backtest_manifest"]=json.loads(manifest.read_text())
          live_manifest=root/"research/four_model/outputs/four_model_live_prediction_manifest.json"
          if live_manifest.exists():
              lm=json.loads(live_manifest.read_text())
              report["live_runner_summary"]={k:lm.get(k) for k in ["status","generated_utc","fixture_n","prediction_rows","markets","m1up_truth_max_date","calibration","promotion"]}
          Path("/tmp/oracle-completion-report.json").write_text(json.dumps(report,indent=2,default=str)+"\n")
          print(json.dumps(report,indent=2,default=str))
          PY

      - name: Build reporting-only Visual Intelligence layer
        if: always()
        working-directory: oracle
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile ../scripts/build_visual_intelligence.py
          python ../scripts/build_visual_intelligence.py
          test -s reports/visual_intelligence.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("reports/visual_intelligence.csv")
          d=pd.read_csv(p)
          assert "Fixture ID" in d.columns, "Visual Intelligence is missing Fixture ID"
          assert d["Fixture ID"].notna().all(), "Visual Intelligence contains a blank Fixture ID"
          assert d["Fixture ID"].is_unique, "Visual Intelligence contains duplicate Fixture IDs"
          assert len(d) > 0, "Visual Intelligence output is empty"
          print(f"Visual Intelligence validation PASS: {len(d)} unique fixtures")
          PY

      - name: Build curated Visual Intelligence Excel and PDF report
        working-directory: oracle
        run: |
          set -euo pipefail
          python -m py_compile ../scripts/build_curated_visual_report.py
          python ../scripts/build_curated_visual_report.py
          test -s reports/oracle_curated_visual_report.xlsx
          test -s reports/oracle_curated_visual_report.pdf
          test -s reports/oracle_curated_visual_report_audit.json

      - name: Enforce report quality controls and publish readiness status
        if: always()
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from openpyxl import load_workbook
          report_dir=Path("reports")
          vi_audit_path=report_dir/"visual_intelligence_audit.json"
          report_audit_path=report_dir/"oracle_curated_visual_report_audit.json"
          xlsx_path=report_dir/"oracle_curated_visual_report.xlsx"
          for p in (vi_audit_path,report_audit_path,xlsx_path):
              if not p.exists() or p.stat().st_size==0:
                  raise SystemExit(f"BLOCKED: required quality-control artifact missing/empty: {p}")
          vi=json.loads(vi_audit_path.read_text())
          ra=json.loads(report_audit_path.read_text())
          if not ra.get("join_complete") or ra.get("oracle_probabilities_modified") is not False:
              raise SystemExit("BLOCKED: report join or probability-preservation audit failed.")
          if ra.get("probability_values_valid_0_to_1") is not True:
              raise SystemExit("BLOCKED: raw probability validation failed.")
          wb=load_workbook(xlsx_path,read_only=False,data_only=False)
          if "Fixture Predictions 16-19 Oct" not in wb.sheetnames:
              raise SystemExit("BLOCKED: expected fixture report sheet missing.")
          ws=wb["Fixture Predictions 16-19 Oct"]
          headers={cell.value:cell.column for cell in ws[1]}
          prob_headers={"BTTS Yes","Home 1X","Away X2","Over 1.5","Over 2.5","Under 4.5",
            "Home over 1.5 goals","Away over 1.5 goals","Home 1X + Over 1.5","Away X2 + Over 1.5",
            "Home 1X + Under 4.5","Away X2 + Under 4.5","M-1UP Home","M-1UP Away","Draw Probability (derived)"}
          missing=prob_headers-set(headers)
          if missing:
              raise SystemExit(f"BLOCKED: expected probability columns missing: {sorted(missing)}")
          bad=[]
          for name in prob_headers:
              col=headers[name]
              for row in range(2,ws.max_row+1):
                  cell=ws.cell(row,col)
                  if isinstance(cell.value,(int,float)) and 0 <= cell.value <= 1 and "%" not in cell.number_format:
                      bad.append(f"{name}@{cell.coordinate}")
          if bad:
              raise SystemExit("BLOCKED: probability cells lack percentage display formatting: "+", ".join(bad[:20]))
          print(json.dumps({"report_quality":"PASS","visual_intelligence_status":vi.get("status"),
            "generation_status":vi.get("generation_status"),"standings_readiness":vi.get("betting_readiness"),
            "standings_verified_fixtures":vi.get("fixtures_both_positions_verified"),
            "fixtures_missing_positions":vi.get("fixtures_missing_one_or_both_positions"),
            "probability_formatting":"PASS","raw_probabilities_valid":True,
            "confidence_percent":ra.get("confidence_percent"),"betting_readiness":ra.get("betting_readiness"),
            "production_promotion":"BLOCKED"},indent=2))
          if vi.get("betting_readiness")=="PARTIAL_NOT_READY" or ra.get("betting_readiness")=="PARTIAL_NOT_READY":
              print("::warning::Report generated, but standings coverage is incomplete. Do not treat this report as fully evidence-verified for betting.")
          PY

      - name: Upload sanitized aggregate completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-sanitized-completion-report
          path: /tmp/oracle-completion-report.json
          retention-days: 14

      - name: Upload fixture-level predictions and reconciliation inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-fixture-level-predictions
          path: |
            oracle/data/fixtures/oracle_upcoming_fixtures.csv
            oracle/data/fixtures/oracle_upcoming_fixtures_manifest.json
            oracle/research/four_model/outputs/four_model_live_predictions.csv
            oracle/research/four_model/outputs/four_model_live_prediction_manifest.json
            oracle/database/current_prematch_team_state.csv
            oracle/database/current_matches.csv
            oracle/database/matches.csv
            oracle/reports/visual_intelligence.csv
            oracle/reports/visual_intelligence_audit.json
            oracle/reports/oracle_curated_visual_report.xlsx
            oracle/reports/oracle_curated_visual_report.pdf
            oracle/reports/oracle_curated_visual_report_audit.json
            /tmp/oracle-fixture-audit.json
            /tmp/oracle-live-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
