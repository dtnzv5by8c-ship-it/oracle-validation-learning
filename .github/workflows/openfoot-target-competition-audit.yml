name: OpenFoot Requested Competition Field Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_openfoot_target_competitions.py"
      - ".github/workflows/openfoot-target-competition-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout read-only audit repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install --upgrade pip requests
      - name: Run target competition feature audit
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: python scripts/audit_openfoot_target_competitions.py
      - name: Upload sanitized coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfoot-target-competition-coverage
          path: artifacts/openfoot_target_competition_coverage.json
          if-no-files-found: warn
          retention-days: 30
