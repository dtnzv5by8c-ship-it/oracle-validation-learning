name: Oracle Selected-50 Provider ID Schema Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm_provider_credit_usage:
        description: "Confirm this run may consume exactly one FootyStats API request"
        required: true
        default: false
        type: boolean
      confirm_monthly_credit_budget_checked:
        description: "Confirm the current monthly FootyStats credit balance was checked and is sufficient for one request; request_remaining is not monthly-credit evidence"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  schema-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout research scope manifest
        uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit

      - name: Run one-call, read-only schema diagnostic
        shell: bash
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          CONFIRM_PROVIDER_CREDIT_USAGE: ${{ inputs.confirm_provider_credit_usage }}
          CONFIRM_MONTHLY_CREDIT_BUDGET_CHECKED: ${{ inputs.confirm_monthly_credit_budget_checked }}
        run: |
          set -euo pipefail
          [[ "${CONFIRM_PROVIDER_CREDIT_USAGE:-false}" == "true" ]] || { echo "::error::Explicit provider-credit confirmation is required; no request made."; exit 1; }
          [[ "${CONFIRM_MONTHLY_CREDIT_BUDGET_CHECKED:-false}" == "true" ]] || { echo "::error::Current monthly FootyStats credit balance has not been explicitly confirmed; no request made."; exit 1; }
          python scripts/oracle_selected50_provider_schema_diagnostic.py

      - name: Upload sanitized schema summary only
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-schema-diagnostic
          path: oracle-selected50-schema-diagnostic/schema-diagnostic-summary.json
          if-no-files-found: error
          retention-days: 7
