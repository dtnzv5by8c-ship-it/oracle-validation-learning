name: Oracle Selected-50 FootyStats Identity Probe
on:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/oracle-selected50-identity-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded sequential identity probe (50 requests maximum, no retries)
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/oracle_selected50_one_season_identity_probe.py
          python scripts/oracle_selected50_one_season_identity_probe.py
      - name: Upload identity probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-identity-probe
          path: oracle-selected50-one-season-identity-probe/
          if-no-files-found: warn
          retention-days: 14
