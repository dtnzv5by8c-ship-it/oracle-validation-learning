name: FootyStats Selected-50 Plan Promoter (Public, 0 API Calls)

on:
  workflow_dispatch:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/footystats-selected50-catalogue-resolver.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: footystats-global-plan-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOVERNED_BRANCH: research/oracle-50-league-readiness-audit
      SOURCE_RUN_ID: "42009600284"
      SOURCE_ARTIFACT: "footystats-selected50-catalogue-resolver-42009600284"
    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOVERNED_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download previously verified resolver artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/selected50-resolver-artifact
          mkdir -p /tmp/selected50-resolver-artifact
          gh run download "${SOURCE_RUN_ID}"             --repo "${GITHUB_REPOSITORY}"             --name "${SOURCE_ARTIFACT}"             --dir /tmp/selected50-resolver-artifact
          find /tmp/selected50-resolver-artifact -maxdepth 2 -type f -print
          test -s /tmp/selected50-resolver-artifact/selected50-full-ingestion-manifest.csv
          test -s /tmp/selected50-resolver-artifact/selected50-provider-season-registry.json
          test -s /tmp/selected50-resolver-artifact/selected50-catalogue-resolution-summary.json

      - name: Validate verified 50-league 182-season 728-task plan offline
        shell: bash
        run: |
          set -euo pipefail
          python - /tmp/selected50-resolver-artifact/selected50-full-ingestion-manifest.csv             /tmp/selected50-resolver-artifact/selected50-provider-season-registry.json             /tmp/selected50-resolver-artifact/selected50-catalogue-resolution-summary.json <<'PY'
          import csv,json,sys
          manifest,registry,summary=sys.argv[1:]
          rows=list(csv.DictReader(open(manifest,encoding="utf-8")))
          reg=json.load(open(registry,encoding="utf-8"))
          s=json.load(open(summary,encoding="utf-8"))
          assert len(rows)==728, len(rows)
          assert len({r["selected_id"] for r in rows})==50
          assert len({r["provider_season_id"] for r in rows})==182
          assert len(rows)==len({r["provider_season_id"] for r in rows})*4
          assert {r["endpoint"] for r in rows}=={"league-matches","league-teams","league-tables","league-season"}
          assert all(r["request_status"]=="PLANNED_NOT_EXECUTED" for r in rows)
          assert all(r["production_eligible"]=="False" and r["betting_eligible"]=="False" for r in rows)
          assert reg["selected_league_count"]==50
          assert reg["resolved_provider_season_count"]==182
          assert s["selected_leagues"]==50 and s["resolved_provider_seasons"]==182 and s["planned_requests"]==728
          assert s["api_calls_this_run"]==1 and s["raw_provider_payload_persisted"] is False
          assert s["production_eligible"] is False and s["betting_eligible"] is False
          print("PASS: verified artifact is exactly 50 leagues / 182 provider seasons / 728 planned endpoint tasks; no provider call made by this promotion.")
          PY

      - name: Promote sanitized plan to governed research branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/selected50-resolver-artifact/selected50-full-ingestion-manifest.csv data/footystats/selected50-full-ingestion-manifest.csv
          cp /tmp/selected50-resolver-artifact/selected50-provider-season-registry.json data/footystats/selected50-provider-season-registry.json
          cp /tmp/selected50-resolver-artifact/selected50-catalogue-resolution-summary.json data/footystats/selected50-catalogue-resolution-summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/footystats/selected50-full-ingestion-manifest.csv data/footystats/selected50-provider-season-registry.json data/footystats/selected50-catalogue-resolution-summary.json
          if git diff --cached --quiet; then
            echo 'Sanitized Selected-50 plan already persisted; no plan commit required.'
          else
            git commit -m 'data: persist verified Selected-50 ingestion plan'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GOVERNED_BRANCH}"
              git rebase "origin/${GOVERNED_BRANCH}" || { git rebase --abort || true; sleep $((attempt*2)); continue; }
              if git push origin "HEAD:${GOVERNED_BRANCH}"; then
                pushed=1
                break
              fi
              sleep $((attempt*2))
            done
            [[ "$pushed" == "1" ]] || { echo '::error::Could not publish the verified Selected-50 plan safely.'; exit 1; }
          fi

      - name: Write promotion receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/FOOTYSTATS_SELECTED50_PLAN_PROMOTION_2026-11-05.md <<'EOF'
          # FootyStats Selected-50 Plan Promotion — 2026-11-05

          - Source resolver run: 42009600284
          - Source artifact: 13405913785
          - API calls made by promotion: 0
          - Verified selected leagues: 50
          - Verified provider seasons: 182
          - Verified planned endpoint tasks: 728
          - Raw provider payload persisted by promotion: false
          - Production eligible: false
          - Betting eligible: false
          - Architecture: public plan promotion only; provider API access remains centralized in the private controlled ingestion workflow.
          EOF
          git add -f reports/FOOTYSTATS_SELECTED50_PLAN_PROMOTION_2026-11-05.md
          git commit -m 'docs: record Selected-50 plan promotion receipt' || true
          git fetch origin "${GOVERNED_BRANCH}"
          git rebase "origin/${GOVERNED_BRANCH}" || { git rebase --abort || true; }
          git push origin "HEAD:${GOVERNED_BRANCH}" || true
