name: DISABLED — Legacy FootyStats Endpoint Coverage Audit

# This workflow previously ran on push and could call multiple provider endpoints without
# explicit monthly-credit confirmation. Use only the reviewed, manually confirmed probe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse automatic provider calls
        shell: bash
        run: |
          echo "::error::This endpoint audit is disabled. Automatic or unbudgeted FootyStats calls are prohibited."
          exit 1
