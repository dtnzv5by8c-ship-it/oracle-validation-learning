name: Oracle FootyStats Archive Feature Audit (Research Only)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/oracle-footystats-archive-feature-audit.yml"
      - "scripts/build_footystats_archive_features.py"
      - "tests/test_footystats_archive_features.py"
      - "scripts/validate_selected50_scope.py"
      - "tests/test_selected50_scope_guard.py"
      - "reports/oracle-footystats-selected-50-league-manifest-2026-10-24.md"
      - "reports/oracle-50-league-provider-canonical-crosswalk-readiness-2026-10-25-r5.csv"
      - "tests/test_chronology_leakage.py"
      - "scripts/build_oracle_competition_crosswalk.py"
      - "scripts/audit_oracle_archive_integrity.py"
      - "scripts/audit_prediction_team_identity.py"
      - "scripts/audit_prediction_fixture_candidates.py"
      - "tests/test_prediction_team_identity.py"
      - "tests/test_prediction_fixture_candidates.py"
      - "scripts/reconstruct_provisional_historical_standings.py"
      - "scripts/build_feature_coverage_matrix.py"
      - "scripts/classify_provider_competition_aliases.py"
      - "scripts/check_archive_freshness.py"
      - "tests/test_archive_freshness.py"
      - "scripts/validate_prospective_prediction.py"
      - "tests/test_prospective_prediction.py"
      - "scripts/validate_prospective_settlement.py"
      - "tests/test_prospective_settlement.py"
      - "scripts/summarize_prospective_evaluation.py"
      - "tests/test_prospective_evaluation_summary.py"
      - "scripts/verify_prospective_evaluation_provenance.py"
      - "tests/test_prospective_evaluation_provenance.py"
      - "scripts/settle_market_from_final_score.py"
      - "tests/test_score_market_settlement.py"
      - "scripts/build_score_verified_evaluation.py"
      - "scripts/adapt_oracle_prediction_ledger.py"
      - "tests/test_oracle_prediction_adapter.py"
      - "tests/test_score_verified_evaluation.py"
      - "scripts/validate_result_snapshot_provenance.py"
      - "tests/test_result_snapshot_provenance.py"
      - "scripts/validate_current_feed_identity_contract.py"
      - "tests/test_current_feed_identity_contract.py"
      - "scripts/stage_current_feed_identity.py"
      - "tests/test_stage_current_feed_identity.py"
      - "data/current_feed_identity_allowlist.research.json"
      - "docs/oracle-result-source-trust-policy-research-only-2026-10-21.md"
      - "docs/oracle-prospective-prediction-evaluation-protocol-v1.md"

permissions:
  contents: read

jobs:
  archive-feature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4

      - name: Install research test dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Validate parser, chronology, freshness, ledger and metrics tests
        run: python -m unittest discover -s tests -v

      - name: Download private FootyStats archive and enforce release freshness
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=dtnzv5by8c-ship-it/oracle-football-data
          TAG=footystats-all-selected-leagues-2024-2026-20261021
          mkdir -p audit-input
          gh release download "$TAG" --repo "$TARGET" --pattern 'oracle-footystats-all-selected-leagues-2024-2026.zip' --dir audit-input
          test -s audit-input/oracle-footystats-all-selected-leagues-2024-2026.zip
          sha256sum audit-input/oracle-footystats-all-selected-leagues-2024-2026.zip > audit-input/archive.sha256
          PUBLISHED_AT="$(gh release view "$TAG" --repo "$TARGET" --json publishedAt --jq .publishedAt)"
          NOW_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/check_archive_freshness.py --published-at "$PUBLISHED_AT" --now "$NOW_UTC" --max-age-days 14 | tee audit-input/archive-freshness.json

      - name: Download previously acquired provider catalogue without API calls
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=dtnzv5by8c-ship-it/oracle-football-data
          TAG=footystats-selected-catalogue-20261021
          mkdir -p audit-input/catalogue
          gh release download "$TAG" --repo "$TARGET" --pattern 'footystats-selected-catalogue.zip' --dir audit-input/catalogue
          unzip -q audit-input/catalogue/footystats-selected-catalogue.zip -d audit-input/catalogue/extracted
          test -s audit-input/catalogue/extracted/private-catalogue-package/selected_leagues.csv

      - name: Build archive-wide chronological research features
        run: python scripts/build_footystats_archive_features.py --archive audit-input/oracle-footystats-all-selected-leagues-2024-2026.zip --out audit-output

      - name: Validate exact owner-selected 50-league scope and ID provenance (research only)
        run: |
          set -euo pipefail
          python scripts/validate_selected50_scope.py \
            --manifest reports/oracle-footystats-selected-50-league-manifest-2026-10-24.md \
            --crosswalk reports/oracle-50-league-provider-canonical-crosswalk-readiness-2026-10-25-r5.csv \
            --catalogue audit-input/catalogue/extracted/private-catalogue-package/selected_leagues.csv \
            --archive-manifest audit-output/manifest_reconciliation.csv \
            --out audit-output/selected50_scope_guard.json

      - name: Independently audit archive identity and season coverage
        run: python scripts/audit_oracle_archive_integrity.py --audit-dir audit-output

      - name: Reconstruct provisional historical standings (research only)
        run: python scripts/reconstruct_provisional_historical_standings.py --audit-dir audit-output

      - name: Build season-by-season feature coverage matrix (research only)
        run: python scripts/build_feature_coverage_matrix.py --audit-dir audit-output

      - name: Build provisional competition crosswalk from acquired provider catalogue
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/dtnzv5by8c-ship-it/oracle-football-data/contents/config/oracle_major_league_registry_v1.json --jq .content | base64 --decode > audit-input/oracle_major_league_registry_v1.json
          python scripts/build_oracle_competition_crosswalk.py --registry audit-input/oracle_major_league_registry_v1.json --manifest audit-output/manifest_reconciliation.csv --catalogue audit-input/catalogue/extracted/private-catalogue-package/selected_leagues.csv --out audit-output/provisional_competition_crosswalk.csv

      - name: Classify provider competition aliases for human review (research only)
        run: python scripts/classify_provider_competition_aliases.py --crosswalk audit-output/provisional_competition_crosswalk.csv --out audit-output/provider_competition_alias_decisions.csv

      - name: Adapt canonical prediction ledger into research staging (fail closed)
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p audit-input/production-ledger audit-output/prediction-adapter
          gh api "repos/dtnzv5by8c-ship-it/oracle-football-data/contents/archive/PREDICTION_LEDGER.csv?ref=fix/epl-btts-team-state-aliases" --jq .content | base64 --decode > audit-input/production-ledger/PREDICTION_LEDGER.csv
          test -s audit-input/production-ledger/PREDICTION_LEDGER.csv
          python scripts/adapt_oracle_prediction_ledger.py \
            --input audit-input/production-ledger/PREDICTION_LEDGER.csv \
            --accepted-out audit-output/prediction-adapter/accepted.jsonl \
            --quarantine-out audit-output/prediction-adapter/quarantine.jsonl \
            --summary-out audit-output/prediction-adapter/summary.json

      - name: Audit prediction team-name identity against archive (research only)
        run: |
          set -euo pipefail
          python scripts/audit_prediction_team_identity.py \
            --predictions audit-output/prediction-adapter/accepted.jsonl \
            --archive-matches audit-output/match_field_audit.csv \
            --out audit-output/prediction-adapter/team_identity_audit.jsonl \
            --summary audit-output/prediction-adapter/team_identity_summary.json

      - name: Audit exact kickoff fixture candidates (research only)
        run: |
          set -euo pipefail
          python scripts/audit_prediction_fixture_candidates.py \
            --predictions audit-output/prediction-adapter/accepted.jsonl \
            --archive-matches audit-output/match_field_audit.csv \
            --out audit-output/prediction-adapter/fixture_candidate_audit.jsonl \
            --summary audit-output/prediction-adapter/fixture_candidate_summary.json

      - name: Upload reports and feature tables
        uses: actions/upload-artifact@v4
        with:
          name: oracle-footystats-archive-feature-audit
          path: |
            audit-output/
            audit-input/archive-freshness.json
            audit-input/archive.sha256
          if-no-files-found: error
          retention-days: 30
