name: Oracle Public Schedule Difference Diagnostic

on:
  push:
    paths:
      - ".github/workflows/oracle-public-schedule-difference-diagnostic.yml"
      - "recovery/fixtures/current/unmatched_fixture_classification.csv"
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-public-schedule-difference-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose timestamp and timezone representation
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import date, datetime, timezone

          src = "recovery/fixtures/current/unmatched_fixture_classification.csv"
          out_csv = "recovery/fixtures/current/schedule_difference_diagnostic.csv"
          out_json = "recovery/fixtures/current/schedule_difference_diagnostic_summary.json"

          rows = list(csv.DictReader(open(src, encoding="utf-8")))
          diffs = [r for r in rows if r.get("classification") == "PROVIDER_SCHEDULE_DIFFERENCE"]

          def parse(v):
              try: return json.loads(v) if v else []
              except Exception: return []

          def unix_to_utc(v):
              try:
                  return datetime.fromtimestamp(float(v), tz=timezone.utc)
              except Exception:
                  return None

          def parse_dt(v):
              if not v: return None
              s=v.strip().replace("Z","+00:00")
              try:
                  dt=datetime.fromisoformat(s)
                  return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          out=[]
          for r in diffs:
              evidence=parse(r.get("provider_pair_evidence"))
              target=date.fromisoformat(r["date"])
              items=[]
              for e in evidence:
                  d=e.get("date")
                  if not d: continue
                  dt=unix_to_utc(e.get("date_unix") or e.get("unix_date") or e.get("kickoff_unix"))
                  raw_dt=parse_dt(e.get("kickoff_time") or e.get("date_time") or e.get("datetime"))
                  if dt is None: dt=raw_dt
                  items.append({
                      "date":d, "fixture_id":e.get("provider_fixture_id"),
                      "competition_id":e.get("competition_id"), "season":e.get("season"),
                      "date_unix":e.get("date_unix") or e.get("unix_date") or e.get("kickoff_unix"),
                      "utc_datetime":dt.isoformat() if dt else "",
                      "raw_datetime":raw_dt.isoformat() if raw_dt else ""
                  })
              current=[x for x in items if x["date"] >= "2026-09-21"]
              offsets=sorted(set((date.fromisoformat(x["date"])-target).days for x in current))
              timestamp_deltas=[]
              for x in current:
                  if x["utc_datetime"]:
                      try:
                          governed_dt=parse_dt(r.get("kickoff_time"))
                          provider_dt=datetime.fromisoformat(x["utc_datetime"])
                          if governed_dt:
                              timestamp_deltas.append(int((provider_dt-governed_dt).total_seconds()))
                      except Exception: pass

              if not current:
                  diagnosis="NO_POST_CUTOFF_PROVIDER_PAIR_EVIDENCE"
              elif any(abs(x) in (4,5) for x in offsets):
                  diagnosis="SCHEDULE_DIFFERENCE_NOT_TIMEZONE_EXPLAINABLE"
              elif offsets and all(abs(x)<=1 for x in offsets):
                  diagnosis="TIMEZONE_OR_DATE_REPRESENTATION_REQUIRES_TIMESTAMP_TEST"
              else:
                  diagnosis="SCHEDULE_DIFFERENCE_REQUIRES_REVIEW"

              out.append({
                  "league_code":r["league_code"], "governed_date":r["date"],
                  "home_team":r["home_team"], "away_team":r["away_team"],
                  "governed_kickoff":r["kickoff_time"],
                  "provider_dates":";".join(x["date"] for x in current),
                  "provider_fixture_ids":";".join(str(x["fixture_id"]) for x in current),
                  "provider_utc_datetimes":";".join(x["utc_datetime"] for x in current),
                  "provider_date_unix":";".join(str(x["date_unix"]) for x in current),
                  "date_offsets_days":",".join(map(str,offsets)),
                  "timestamp_deltas_seconds":",".join(map(str,timestamp_deltas)),
                  "diagnosis":diagnosis,
                  "promotion_allowed":"FALSE",
                  "reason":"Diagnostic only; no timezone normalization or fixture promotion."
              })

          os.makedirs(os.path.dirname(out_csv),exist_ok=True)
          fields=list(out[0].keys()) if out else ["diagnosis"]
          with open(out_csv,"w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(out)

          counts={}
          for r in out: counts[r["diagnosis"]]=counts.get(r["diagnosis"],0)+1
          summary={
              "generated_utc":datetime.now(timezone.utc).isoformat(),
              "schedule_difference_rows":len(out),
              "diagnosis_counts":counts,
              "timestamp_field_available_rows":sum(bool(r["provider_date_unix"] or r["provider_utc_datetimes"]) for r in out),
              "all_rows_promotion_allowed":False,
              "governance":"Diagnostic only. Timezone/date representation is tested before schedule adjudication; no date normalization, fuzzy matching, historical fallback, Oracle V1.6 change, or Master OMI A:ET change.",
              "production_model_logic_changed":False,
              "master_omi_a_et_changed":False,
              "private_repository_used":False
          }
          json.dump(summary,open(out_json,"w",encoding="utf-8"),indent=2)
          print(json.dumps(summary,indent=2))
          PY

      - name: Persist diagnostic
        run: |
          git config user.name "oracle-public-bot"
          git config user.email "oracle-public-bot@users.noreply.github.com"
          git add recovery/fixtures/current/schedule_difference_diagnostic.csv recovery/fixtures/current/schedule_difference_diagnostic_summary.json
          git diff --cached --quiet || git commit -m "Add timezone-aware schedule difference diagnostic"
          git push
