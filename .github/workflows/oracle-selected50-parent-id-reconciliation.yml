name: Oracle Selected-50 Parent-ID and Match-Coverage Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-parent-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout governed research manifest
        uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit first page of matches for each selected ID (hard cap 50 requests; no retries)
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, re, time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          manifest = Path("reports/oracle-footystats-selected-50-league-manifest-2026-10-24.md")
          if not manifest.is_file():
              raise SystemExit("STOP: governed 50-league manifest missing; no API requests made.")
          selected = []
          for line in manifest.read_text(encoding="utf-8").splitlines():
              m = re.match(r"^\|\s*(\d+)\s*\|\s*(\d+)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*$", line)
              if m:
                  selected.append({"row": int(m.group(1)), "selected_id": m.group(2).strip(),
                                   "country": m.group(3).strip(), "competition": m.group(4).strip()})
          if len(selected) != 50 or len({r["selected_id"] for r in selected}) != 50:
              raise SystemExit("STOP: manifest guard failed; expected exactly 50 unique selected IDs; no API requests made.")
          key = os.environ.get("FOOTYSTATS_API_KEY", "").strip()
          if not key:
              raise SystemExit("STOP: FOOTYSTATS_API_KEY secret missing; no API requests made.")
          base = "https://api.football-data-api.com/"
          results = []
          calls = 0
          last_request_remaining = None
          budget_guard_status = "REQUEST_WINDOW_METADATA_NOT_EXPOSED_BY_ENDPOINT"
          empty_sample = {
              "sample_match_id_fields": "", "sample_home_team_id_fields": "",
              "sample_away_team_id_fields": "", "sample_home_team_name_fields": "",
              "sample_away_team_name_fields": "", "sample_kickoff_fields": "",
              "sample_status_fields": "", "sample_home_score_fields": "",
              "sample_away_score_fields": "", "sample_record_field_names": "",
              "request_window_remaining": ""
          }

          def safe_fields(row, allowed):
              parts = []
              if not isinstance(row, dict):
                  return ""
              for name in allowed:
                  value = row.get(name)
                  if value is None or isinstance(value, (dict, list)):
                      continue
                  rendered = str(value).replace("\\n", " ")[:120]
                  if rendered.strip():
                      parts.append(f"{name}={rendered}")
              return ";".join(parts)

          def response_remaining(payload):
              meta = payload.get("metadata") if isinstance(payload, dict) else None
              if not isinstance(meta, dict):
                  data_obj = payload.get("data") if isinstance(payload, dict) else None
                  meta = data_obj.get("metadata") if isinstance(data_obj, dict) else None
              raw = meta.get("request_remaining") if isinstance(meta, dict) else None
              try:
                  return int(raw) if raw is not None else None
              except (TypeError, ValueError):
                  return None

          for item in selected:
              if calls >= 50:
                  raise SystemExit("STOP: hard cap of 50 API requests reached.")
              query = urlencode({"key": key, "season_id": item["selected_id"], "max_per_page": 1000, "page": 1})
              request = Request(base + "league-matches?" + query,
                                headers={"User-Agent": "Oracle-Selected50-Parent-ID-Reconciliation/1.0"})
              calls += 1
              try:
                  with urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                      http_status = response.status
              except HTTPError as exc:
                  results.append({**item, "http_status": exc.code, "api_success": False,
                                  "match_rows_returned": 0, "competition_id_values": "",
                                  "season_id_values": "", **empty_sample, "identity_status": "HTTP_ERROR"})
                  # Fail closed and do not retry.
                  break
              except Exception as exc:
                  results.append({**item, "http_status": "", "api_success": False,
                                  "match_rows_returned": 0, "competition_id_values": "",
                                  "season_id_values": "", **empty_sample, "identity_status": "REQUEST_ERROR_" + type(exc).__name__})
                  break
              ok = isinstance(payload, dict) and payload.get("success") is True
              data = payload.get("data") if isinstance(payload, dict) else None
              rows = data if isinstance(data, list) else ([data] if isinstance(data, dict) else [])
              pager = payload.get("pager") if isinstance(payload, dict) and isinstance(payload.get("pager"), dict) else {}
              try:
                  pager_max_page = int(pager.get("max_page") or 1)
              except (TypeError, ValueError):
                  pager_max_page = 1

              def first_value(record, names):
                  if not isinstance(record, dict):
                      return None
                  for name in names:
                      value = record.get(name)
                      if value not in (None, ""):
                          return value
                  return None

              fixture_names = ["id", "match_id", "matchID", "fixture_id", "fixtureID"]
              home_id_names = ["homeID", "home_id", "home_team_id", "homeTeamID"]
              away_id_names = ["awayID", "away_id", "away_team_id", "awayTeamID"]
              status_names = ["status", "match_status", "fixture_status"]
              home_score_names = ["homeGoalCount", "home_goals", "home_score", "homeGoals"]
              away_score_names = ["awayGoalCount", "away_goals", "away_score", "awayGoals"]
              competition_ids = sorted({str(r.get("competition_id")) for r in rows
                                        if isinstance(r, dict) and r.get("competition_id") not in (None, "")})
              provider_season_values = sorted({str(r.get("season")) for r in rows
                                                if isinstance(r, dict) and r.get("season") not in (None, "")})
              rows_with_explicit_season_id_field = sum(isinstance(r, dict) and "season_id" in r for r in rows)
              rows_with_nonempty_explicit_season_id = sum(isinstance(r, dict) and r.get("season_id") not in (None, "") for r in rows)
              fixture_ids = [str(v).strip() for r in rows
                             if (v := first_value(r, fixture_names)) is not None and str(v).strip()]
              unique_fixture_ids = len(set(fixture_ids))
              duplicate_fixture_id_rows = len(fixture_ids) - unique_fixture_ids
              status_counts = {}
              for record in rows:
                  value = first_value(record, status_names)
                  if value is not None:
                      label = str(value).strip()
                      status_counts[label] = status_counts.get(label, 0) + 1
              home_score_count = sum(first_value(r, home_score_names) is not None for r in rows)
              away_score_count = sum(first_value(r, away_score_names) is not None for r in rows)
              both_score_count = sum(first_value(r, home_score_names) is not None and
                                     first_value(r, away_score_names) is not None for r in rows)
              both_team_id_count = sum(first_value(r, home_id_names) is not None and
                                       first_value(r, away_id_names) is not None for r in rows)
              kickoff_values = []
              for record in rows:
                  raw = first_value(record, ["date_unix"])
                  try:
                      if raw is not None:
                          kickoff_values.append(int(raw))
                  except (TypeError, ValueError):
                      pass

              sample = rows[0] if rows and isinstance(rows[0], dict) else {}
              last_request_remaining = response_remaining(payload)
              if last_request_remaining is not None:
                  budget_guard_status = "REQUEST_WINDOW_METADATA_OBSERVED"
              sample_evidence = {
                  "sample_match_id_fields": safe_fields(sample, fixture_names),
                  "sample_home_team_id_fields": safe_fields(sample, home_id_names),
                  "sample_away_team_id_fields": safe_fields(sample, away_id_names),
                  "sample_home_team_name_fields": safe_fields(sample, ["home_name", "home_team_name", "homeName"]),
                  "sample_away_team_name_fields": safe_fields(sample, ["away_name", "away_team_name", "awayName"]),
                  "sample_kickoff_fields": safe_fields(sample, ["date_unix", "kickoff", "kickoff_time", "date", "datetime"]),
                  "sample_status_fields": safe_fields(sample, status_names),
                  "sample_home_score_fields": safe_fields(sample, home_score_names),
                  "sample_away_score_fields": safe_fields(sample, away_score_names),
                  "sample_record_field_names": ";".join(sorted(str(k) for k in sample.keys())),
                  "request_window_remaining": "" if last_request_remaining is None else last_request_remaining
              }
              results.append({**item, "http_status": http_status, "api_success": bool(ok),
                              "match_rows_returned": len(rows),
                              "pager_max_page": pager_max_page,
                              "first_page_only": True,
                              "page_truncated": pager_max_page > 1,
                              "unique_fixture_ids_on_page": unique_fixture_ids,
                              "duplicate_fixture_id_rows_on_page": duplicate_fixture_id_rows,
                              "rows_with_status": sum(first_value(r, status_names) is not None for r in rows),
                              "status_counts_json": json.dumps(status_counts, sort_keys=True),
                              "rows_with_both_team_ids": both_team_id_count,
                              "rows_with_both_score_fields": both_score_count,
                              "rows_with_home_score_field": home_score_count,
                              "rows_with_away_score_field": away_score_count,
                              "rows_with_unix_kickoff": len(kickoff_values),
                              "kickoff_unix_min": min(kickoff_values) if kickoff_values else "",
                              "kickoff_unix_max": max(kickoff_values) if kickoff_values else "",
                              "selected_id_matches_competition_id": bool(rows) and competition_ids == [item["selected_id"]],
                              "provider_season_values_json": json.dumps(provider_season_values),
                              "rows_with_provider_season_value": sum(first_value(r, ["season"]) is not None for r in rows),
                              "rows_with_explicit_season_id_field": rows_with_explicit_season_id_field,
                              "rows_with_nonempty_explicit_season_id": rows_with_nonempty_explicit_season_id,
                              "competition_id_values": ";".join(competition_ids),
                              "provider_season_values": ";".join(provider_season_values),
                              **sample_evidence,
                              "identity_status": ("COMPETITION_ID_EXPOSED" if ok and competition_ids else
                                                  "NO_MATCH_ROW" if ok and not rows else
                                                  "COMPETITION_ID_NOT_EXPOSED" if ok else "API_SUCCESS_FALSE")})
              if not ok:
                  # Fail closed on provider-level failure; do not spend the remaining request budget.
                  break
              # Stay below the documented 30 requests/minute envelope; no retries or extra endpoints.
              if calls < 50 and last_request_remaining is not None:
                  planned_calls_after_this = 50 - calls
                  if last_request_remaining < planned_calls_after_this + 25:
                      budget_guard_status = "STOPPED_REQUEST_WINDOW_GUARD"
                      break
              time.sleep(2.1)
          out = Path("parent-id-reconciliation")
          out.mkdir(exist_ok=True)
          fields = ["row","selected_id","country","competition","http_status","api_success",
                    "match_rows_returned","pager_max_page","first_page_only","page_truncated",
                    "unique_fixture_ids_on_page","duplicate_fixture_id_rows_on_page","rows_with_status",
                    "status_counts_json","rows_with_both_team_ids","rows_with_both_score_fields",
                    "rows_with_home_score_field","rows_with_away_score_field","rows_with_unix_kickoff",
                    "kickoff_unix_min","kickoff_unix_max","competition_id_consistent_with_selected_id",
                    "selected_id_matches_competition_id","provider_season_values_json",
                    "rows_with_provider_season_value","rows_with_explicit_season_id_field",
                    "rows_with_nonempty_explicit_season_id","competition_id_values","provider_season_values",
                    "sample_match_id_fields","sample_home_team_id_fields","sample_away_team_id_fields",
                    "sample_home_team_name_fields","sample_away_team_name_fields","sample_kickoff_fields",
                    "sample_status_fields","sample_home_score_fields","sample_away_score_fields",
                    "sample_record_field_names","request_window_remaining","identity_status"]
          with (out / "parent-id-reconciliation.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields); writer.writeheader(); writer.writerows(results)
          exposed = sum(bool(r["competition_id_values"]) for r in results)
          unique_comp_ids = sorted({v for r in results for v in str(r["competition_id_values"]).split(";") if v})
          summary = {
            "status": "PARENT_ID_PROBE_COMPLETED" if len(results) == 50 else "PARENT_ID_PROBE_INCOMPLETE",
            "selected_leagues": 50, "requests_started": calls, "hard_request_cap": 50,
            "rows_with_competition_id": exposed, "unique_competition_id_values": len(unique_comp_ids),
            "successful_api_rows": sum(r["api_success"] is True for r in results),
            "leagues_with_first_page_truncated": sum(bool(r.get("page_truncated")) for r in results),
            "fixture_ids_observed_on_first_pages": sum(int(r.get("unique_fixture_ids_on_page") or 0) for r in results),
            "duplicate_fixture_id_rows_on_first_pages": sum(int(r.get("duplicate_fixture_id_rows_on_page") or 0) for r in results),
            "all_rows_are_first_page_only": True,
            "rows_with_explicit_season_id_field": sum(int(r.get("rows_with_explicit_season_id_field") or 0) for r in results),
            "rows_with_nonempty_explicit_season_id": sum(int(r.get("rows_with_nonempty_explicit_season_id") or 0) for r in results),
            "provider_status_and_score_fields_are_descriptive_not_settlement_truth": True,
            "request_window_budget_guard": budget_guard_status,
            "last_observed_request_window_remaining": last_request_remaining,
            "monthly_credit_budget_verified": False,
            "rate_limit_delay_seconds": 2.1,
            "raw_provider_payloads_saved": False, "api_key_logged_or_saved": False,
            "production_logic_or_probabilities_changed": False,
            "production_readiness": "NOT_GRANTED",
            "interpretation": "One request per selected ID retrieves page 1 with max_per_page=1000. In the observed response schema, match rows expose competition_id and season, but no nonempty season_id field; therefore do not treat selected ID/competition_id equality as proof of parent-competition semantics or a canonical bridge. The artifact records per-page fixture ID uniqueness, status counts, score-field presence, team-ID presence, kickoff range and provider pager max_page. If pager_max_page > 1, later pages are not fetched. This is a bounded coverage diagnostic, not full historical coverage, canonical Oracle identity, official settlement truth, or production approval. Monthly credit balance is not exposed by this report and must not be inferred from request-window metadata."
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload sanitized reconciliation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-selected50-parent-id-reconciliation
          path: parent-id-reconciliation/
          if-no-files-found: warn
          retention-days: 14
