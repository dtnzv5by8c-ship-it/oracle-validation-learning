name: DISABLED — Legacy Selected-50 Parent-ID Reconciliation Probe

# The historical probe made up to 50 calls but did not require an explicit monthly-credit
# confirmation. Provider docs distinguish season IDs from parent competition IDs; this
# probe cannot approve canonical parent IDs. Preserve prior evidence and fail closed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse ambiguous identity probe
        shell: bash
        run: |
          echo "::error::This legacy parent-ID probe is disabled. Use the one-call schema diagnostic for evidence gathering; no parent ID may be inferred from a season ID."
          exit 1
