name: Stage FootyStats Provider Catalogue

on:
  workflow_dispatch:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/stage-footystats-provider-catalogue.yml"

permissions:
  contents: write
  actions: read

jobs:
  stage-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout governed research branch
        uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify approved catalogue artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/footystats-catalogue"
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/13332511451/zip \
            > "$RUNNER_TEMP/footystats-catalogue/catalogue.zip"
          echo "6ae5ff7c575d5d7517d25600047d4e342454514ed996324c81685c1204a870fe  $RUNNER_TEMP/footystats-catalogue/catalogue.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/footystats-catalogue/catalogue.zip" -d "$RUNNER_TEMP/footystats-catalogue/extracted"
          test -s "$RUNNER_TEMP/footystats-catalogue/extracted/footystats-selected-leagues.csv"
          test -s "$RUNNER_TEMP/footystats-catalogue/extracted/footystats-catalogue-summary.json"
          mkdir -p data/footystats
          cp "$RUNNER_TEMP/footystats-catalogue/extracted/footystats-selected-leagues.csv" data/footystats/footystats-selected-leagues-2026-11-04.csv
          cp "$RUNNER_TEMP/footystats-catalogue/extracted/footystats-catalogue-summary.json" data/footystats/footystats-catalogue-summary-2026-11-04.json

      - name: Build dynamic provider season registry offline
        run: |
          python scripts/build_footystats_provider_registry.py \
            --catalogue-csv data/footystats/footystats-selected-leagues-2026-11-04.csv \
            --retrieved-utc 2026-11-04T14:34:00Z \
            --scope chosen_leagues_only \
            --output-json data/footystats/footystats-provider-season-registry-2026-11-04.json \
            --output-csv data/footystats/footystats-provider-season-registry-2026-11-04.csv

      - name: Verify catalogue and registry row counts
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          summary=json.loads(Path("data/footystats/footystats-catalogue-summary-2026-11-04.json").read_text())
          registry=json.loads(Path("data/footystats/footystats-provider-season-registry-2026-11-04.json").read_text())
          with Path("data/footystats/footystats-selected-leagues-2026-11-04.csv").open(encoding="utf-8-sig", newline="") as f:
              catalogue=list(csv.DictReader(f))
          assert len(catalogue)==756, f"expected 756 catalogue rows, got {len(catalogue)}"
          assert summary["unique_league_names"]==49
          assert registry["provider_league_count"]==49
          assert registry["provider_season_count"]==756
          assert len({r["season_id"] for r in catalogue})==756
          assert len({r["provider_season_id"] for r in registry["seasons"]})==756
          assert registry["catalogue_scope"]=="chosen_leagues_only"
          assert registry["production_eligible"] is False and registry["betting_eligible"] is False
          print("PASS: 49 provider leagues, 756 unique season IDs; research-only registry.")
          PY

      - name: Build provider-driven historical season plan (offline)
        run: |
          set -euo pipefail
          mkdir -p data/footystats/historical-season-plan-2024-2026
          python scripts/build_footystats_historical_season_plan.py \
            --registry-json data/footystats/footystats-provider-season-registry-2026-11-04.json \
            --start-date 2024-01-01 \
            --end-date 2026-11-04 \
            --plan-csv data/footystats/historical-season-plan-2024-2026/season-plan.csv \
            --excluded-csv data/footystats/historical-season-plan-2024-2026/excluded-seasons.csv \
            --summary-json data/footystats/historical-season-plan-2024-2026/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("data/footystats/historical-season-plan-2024-2026/summary.json").read_text())
          assert summary["catalogue_provider_season_count"] == 756
          assert summary["planned_provider_season_count"] == 182
          assert summary["planned_provider_league_count"] == 49
          assert summary["excluded_provider_season_count"] == 574
          assert summary["all_catalogue_rows_accounted_for"] is True
          assert summary["api_requests_made"] == 0
          assert summary["production_eligible"] is False and summary["betting_eligible"] is False
          print("PASS: 182 historical provider seasons across 49 selected leagues; all 756 catalogue rows accounted for.")
          PY

      - name: Record catalogue provenance
        run: |
          cat > data/footystats/FOOTYSTATS_CATALOGUE_PROVENANCE.md <<'EOF'
          # FootyStats catalogue provenance

          - Source workflow run: 41848820573 (main branch)
          - Source artifact: footystats-selected-league-catalogue
          - Artifact ID: 13332511451
          - Artifact ZIP SHA-256: 6ae5ff7c575d5d7517d25600047d4e342454514ed996324c81685c1204a870fe
          - API request: league-list?chosen_leagues_only=true (one request)
          - Retrieved at: 2026-11-04T14:34:00Z
          - Scope: selected account catalogue only; not proof of all competitions offered by FootyStats
          - Result: 49 unique league names and 756 league-season rows
          - API calls made by this staging workflow: zero
          - Production/betting eligibility: false
          EOF

      - name: Commit verified provider catalogue, registry and historical plan
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/footystats/
          if git diff --cached --quiet; then
            echo "Catalogue registry already current."
          else
            git commit -m "data: stage verified FootyStats provider catalogue, registry and historical plan"
            git fetch origin research/oracle-50-league-readiness-audit
            git rebase origin/research/oracle-50-league-readiness-audit
            git push origin HEAD:research/oracle-50-league-readiness-audit
          fi

      - name: Upload staged catalogue evidence
        uses: actions/upload-artifact@v4
        with:
          name: footystats-provider-catalogue-registry-and-historical-plan
          path: data/footystats/
          if-no-files-found: error
          retention-days: 30
