name: Oracle Master OMI Excel Export
# Continuous Master OMI maintenance heartbeat: rerun governed source reconciliation.

on:
  push:
    paths:
      - ".github/workflows/oracle-master-omi-excel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public repository as the only governed source
        uses: actions/checkout@v4
        with:
          path: oracle

      - name: Enforce public-only source contract
        working-directory: oracle
        run: |
          set -euo pipefail
          required=(
            research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv
            data/fixtures/omi_locked_spine_2026-11-13_to_2026-11-24.csv
            database/current_prematch_team_state.csv
            database/matches.csv
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::PUBLIC_SOURCE_ARTIFACT_MISSING=$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::MASTER_OMI_BLOCKED_NO_PUBLIC_SOURCE_DATA"
            exit 1
          fi
    steps:
      - name: Validate secret
        run: test -n "${GH_TOKEN:-}"

      - name: Clone governed Oracle evidence branch
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"             clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/${TARGET_REPO}.git" oracle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl

      - name: Build Master OMI Excel
        working-directory: oracle
        run: |
          python - <<'PY'
          import csv, json, os, math, re, unicodedata
          from pathlib import Path
          from collections import defaultdict
          import pandas as pd
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment, Border, Side
          from openpyxl.utils import get_column_letter

          ROOT=Path(".")
          ledger=ROOT/"research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv"
          fixtures=ROOT/"data/fixtures/omi_locked_spine_2026-11-13_to_2026-11-24.csv"
          state=ROOT/"database/current_prematch_team_state.csv"
          matches=ROOT/"database/matches.csv"
          visual_candidates=[
              ROOT/"research/team_fixture_intelligence/fixture_intelligence_matrix.csv",
              ROOT/"research/team_fixture_intelligence/team_fixture_intelligence_matrix.csv",
              ROOT/"research/team_fixture_intelligence/fixture_market_research_router.csv"
          ]
          out=ROOT/"Master_OMI_Report_13-24_Nov_2026.xlsx"

          df=pd.read_csv(ledger)
          fx=pd.read_csv(fixtures) if fixtures.exists() and fixtures.stat().st_size else pd.DataFrame()
          st=pd.read_csv(state) if state.exists() and state.stat().st_size else pd.DataFrame()
          mt=pd.read_csv(matches) if matches.exists() and matches.stat().st_size else pd.DataFrame()

          # Canonical fixture key for safe joins. Exact Fixture ID is preferred.
          def norm(s):
              s=unicodedata.normalize("NFKD",str(s or "")).encode("ascii","ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+","-",s).strip("-")
          def fid(r):
              if "fixture_id" in r and str(r.get("fixture_id") or "").strip():
                  return str(r["fixture_id"])
              return f"{r.get('league_code','')}-{str(r.get('date',''))[:10]}-{norm(r.get('home_team',''))}-{norm(r.get('away_team',''))}"
          df["Fixture ID"]=df.apply(fid,axis=1)
          if not fx.empty:
              fx["Fixture ID"]=fx.apply(fid,axis=1)

          # Team-State fixture join: exact fixture/date/team match where available.
          ts_fixture=[]
          fx_lookup={}
          if not fx.empty:
              for _,fr in fx.iterrows():
                  fx_lookup[str(fr.get("fixture_id") or fid(fr))]=fr.to_dict()
          if not st.empty:
              for _,r in df.iterrows():
                  date=str(r.get("date",""))[:10]; home=str(r.get("home_team","")); away=str(r.get("away_team",""))
                  fr=fx_lookup.get(str(r["Fixture ID"]),{})
                  league_name=str(fr.get("league") or fr.get("competition") or "")
                  q=st[(st.get("date",pd.Series([""]*len(st))).astype(str).str[:10]==date) & (st.get("home_team",pd.Series([""]*len(st))).astype(str).map(norm)==norm(home)) & (st.get("away_team",pd.Series([""]*len(st))).astype(str).map(norm)==norm(away))]
                  if len(q):
                      z=q.iloc[0].to_dict(); z["Fixture ID"]=r["Fixture ID"]; ts_fixture.append(z)
                  else:
                      ts_fixture.append({"Fixture ID":r["Fixture ID"],"date":date,"league":league_name,"home_team":home,"away_team":away,"Team State Status":"NOT FOUND IN CURRENT STATE"})
          ts_df=pd.DataFrame(ts_fixture)
          if not ts_df.empty:
              df=df.merge(ts_df.drop_duplicates("Fixture ID"),on="Fixture ID",how="left",suffixes=("","_STATE"))
          # H2H: same-league, strictly pre-match, canonicalised by normalized names.
          h2h_rows=[]
          form_rows=[]
          if not mt.empty:
              mt["date"]=pd.to_datetime(mt["date"],errors="coerce")
              for _,r in df.iterrows():
                  date=pd.to_datetime(r.get("date"),errors="coerce")
                  league=str(r.get("league_code",""))
                  home=str(r.get("home_team",""))
                  away=str(r.get("away_team",""))
                  m=mt[(mt["date"]<date) & (mt.get("league_code",pd.Series([""]*len(mt))).astype(str)==league)].copy() if "league_code" in mt.columns else mt[mt["date"]<date].copy()
                  if not m.empty:
                      def teammask(col,team):
                          return m[col].astype(str).map(norm)==norm(team)
                      hmask=teammask("home_team",home) if "home_team" in m.columns else pd.Series(False,index=m.index)
                      amask=teammask("away_team",away) if "away_team" in m.columns else pd.Series(False,index=m.index)
                      pair=m[(teammask("home_team",home)&teammask("away_team",away))|(teammask("home_team",away)&teammask("away_team",home))]
                  else: pair=pd.DataFrame()
                  n=len(pair)
                  hw=dr=aw=0
                  if n:
                      for _,g in pair.iterrows():
                          hg=float(g.get("home_goals",0)); ag=float(g.get("away_goals",0))
                          if norm(g.get("home_team"))==norm(home):
                              hw+=hg>ag; dr+=hg==ag; aw+=hg<ag
                          else:
                              hw+=ag>hg; dr+=ag==hg; aw+=ag<hg
                  h2h_rows.append({
                      "Fixture ID":r["Fixture ID"],"Date":r.get("date"),"League":league,"Home":home,"Away":away,
                      "H2H Meetings":n,"Home Wins":int(hw),"Draws":int(dr),"Away Wins":int(aw),
                      "H2H Status":"MATCHED" if n>=5 else ("MATCHED - SMALL SAMPLE" if n else "NO VERIFIED HISTORICAL H2H")
                  })
                  # Recent form: last five same-league matches for each team, strictly before fixture.
                  for side,team in [("Home",home),("Away",away)]:
                      tm=m[(m["home_team"].astype(str).map(norm)==norm(team))|(m["away_team"].astype(str).map(norm)==norm(team))].sort_values("date",ascending=False).head(5)
                      pts=gf=ga=0; results=[]
                      for _,g in tm.iterrows():
                          ishome=norm(g.get("home_team"))==norm(team)
                          gf0=float(g.get("home_goals",0) if ishome else g.get("away_goals",0))
                          ga0=float(g.get("away_goals",0) if ishome else g.get("home_goals",0))
                          gf+=gf0; ga+=ga0
                          p=3 if gf0>ga0 else 1 if gf0==ga0 else 0; pts+=p
                          results.append("W" if p==3 else "D" if p==1 else "L")
                      form_rows.append({
                          "Fixture ID":r["Fixture ID"],"Side":side,"Team":team,
                          "Last 5 Results":" ".join(results),"Last 5 Points":pts if len(tm) else "",
                          "Goals For":gf if len(tm) else "","Goals Against":ga if len(tm) else "",
                          "Matches Available":len(tm),
                          "Form Status":"5-match sample" if len(tm)==5 else ("Small sample" if len(tm)>0 else "No verified recent history")
                      })

          # Visual Intelligence: exact Fixture ID join only.
          vis=None; vis_source=""
          for p in visual_candidates:
              if p.exists() and p.stat().st_size:
                  try:
                      x=pd.read_csv(p)
                      if "fixture_id" in [str(c).lower() for c in x.columns] or "Fixture ID" in x.columns:
                          vis=x; vis_source=str(p); break
                  except Exception: pass
          if vis is not None:
              cols={str(c).lower():c for c in vis.columns}
              fk=cols.get("fixture_id") or ("Fixture ID" if "Fixture ID" in vis.columns else None)
              vis=vis.rename(columns={fk:"Fixture ID"})
              vis["Fixture ID"]=vis["Fixture ID"].astype(str)
              df["Fixture ID"]=df["Fixture ID"].astype(str)
              df=df.merge(vis.drop_duplicates("Fixture ID"),on="Fixture ID",how="left",suffixes=("","_VI"))

          # FootyStats Team Intelligence — research/reporting enrichment only.
          # Exact fixture IDs are joined; Home/Away team rows are pivoted into fixture-level columns.
          fs_path = ROOT/"research/four_model/outputs/footystats_team_fixture_intelligence.csv"
          fs = pd.read_csv(fs_path) if fs_path.exists() and fs_path.stat().st_size else pd.DataFrame()
          if not fs.empty:
              fs["Fixture ID"] = fs["fixture_id"].astype(str)
              keep = [c for c in fs.columns if c not in {"fixture_id","league_code","date","kickoff_time","provider_league","provider_season","provider_season_id","side","team","error"}]
              home = fs[fs["side"].eq("home")].copy()
              away = fs[fs["side"].eq("away")].copy()
              home = home[["Fixture ID"] + [c for c in keep if c in home.columns]].rename(columns={c:"FS Home "+c for c in keep if c in home.columns})
              away = away[["Fixture ID"] + [c for c in keep if c in away.columns]].rename(columns={c:"FS Away "+c for c in keep if c in away.columns})
              fs_fixture = home.merge(away,on="Fixture ID",how="outer")
              for side in ("Home","Away"):
                  stcol=f"FS {side} status"
                  if stcol in fs_fixture.columns:
                      pass
              status_cols=[c for c in ["FS Home status","FS Away status"] if c in fs_fixture.columns]
              if status_cols:
                  fs_fixture["FootyStats Team Intelligence Status"] = fs_fixture[status_cols].apply(lambda r: "VERIFIED" if all(str(x)=="VERIFIED" for x in r) else ("PARTIAL" if any(str(x)=="VERIFIED" for x in r) else "UNVERIFIED"),axis=1)
              df=df.merge(fs_fixture.drop_duplicates("Fixture ID"),on="Fixture ID",how="left")

              # Permanent PPG contract: expose provider-supplied PPG, PPG Home and PPG Away
              # explicitly for both fixture sides. Never derive a provider field from odds/results.
              # If FootyStats does not supply a field, keep it explicitly unavailable and preserve
              # source/provenance status rather than silently substituting another statistic.
              def first_existing(frame, candidates):
                  for col in candidates:
                      if col in frame.columns:
                          return col
                  return None

              ppg_aliases = {
                  "PPG": ["ppg", "PPG", "ppg_overall", "points_per_game"],
                  "PPG Home": ["ppg_home", "PPG Home", "home_ppg", "ppg_home", "home_points_per_game"],
                  "PPG Away": ["ppg_away", "PPG Away", "away_ppg", "ppg_away", "away_points_per_game"],
              }
              for side in ("Home", "Away"):
                  for metric, aliases in ppg_aliases.items():
                      target=f"FS {side} {metric}"
                      source=first_existing(fs_fixture, [f"FS {side} {a}" for a in aliases])
                      # A provider metric is VERIFIED only when the metric value and its
                      # point-in-time evidence travel together. Never label a bare value
                      # FOOTYSTATS_DIRECT merely because a source column exists.
                      ts_source=first_existing(fs_fixture, [
                          f"FS {side} as_of", f"FS {side} as_of_timestamp",
                          f"FS {side} snapshot_timestamp", f"FS {side} source_timestamp",
                          f"FS {side} timestamp", f"FS {side} cutoff_unix"
                      ])
                      kickoff_source=first_existing(fs_fixture, [
                          f"FS {side} kickoff_time", f"FS {side} kickoff_timestamp",
                          "kickoff_time", "kickoff_timestamp"
                      ])

                      def present(x):
                          return pd.notna(x) and str(x).strip() not in ("","nan","None")

                      def parse_ts(x):
                          if not present(x):
                              return pd.NaT
                          try:
                              s=str(x).strip()
                              if re.fullmatch(r"-?\\d+(?:\\.\\d+)?",s):
                                  return pd.to_datetime(float(s),unit="s",utc=True)
                              return pd.to_datetime(s,utc=True,errors="coerce")
                          except Exception:
                              return pd.NaT

                      df[target]=df[source] if source else "UNAVAILABLE"
                      status_col=f"FS {side} {metric} Status"
                      value_ok=df[source].map(present) if source else pd.Series(False,index=df.index)
                      ts_ok=df[ts_source].map(present) if ts_source else pd.Series(False,index=df.index)
                      provider_ts=df[ts_source].map(parse_ts) if ts_source else pd.Series(pd.NaT,index=df.index)
                      kickoff_ts=df[kickoff_source].map(parse_ts) if kickoff_source else pd.Series(pd.NaT,index=df.index)
                      chronology_ok=provider_ts.notna() & kickoff_ts.notna() & (provider_ts < kickoff_ts)

                      df[status_col]="PROVIDER_FIELD_MISSING"
                      df.loc[value_ok & ~ts_ok,status_col]="TEMPORAL_PROVENANCE_UNVERIFIED"
                      df.loc[value_ok & ts_ok & ~chronology_ok,status_col]="TEMPORAL_PROVENANCE_UNVERIFIED"
                      df.loc[value_ok & chronology_ok,status_col]="FOOTYSTATS_DIRECT"

                      df[f"FS {side} {metric} Source"]=df[status_col].map(
                          lambda s:"FootyStats" if s in ("FOOTYSTATS_DIRECT","TEMPORAL_PROVENANCE_UNVERIFIED") else "UNAVAILABLE"
                      )
                      df[f"FS {side} {metric} Provenance"]=df[status_col].map(
                          lambda s:"PREMATCH_PROVIDER_FIELD" if s=="FOOTYSTATS_DIRECT" else (
                              "TEMPORAL_PROVENANCE_UNVERIFIED" if s=="TEMPORAL_PROVENANCE_UNVERIFIED" else "PROVIDER_FIELD_MISSING"
                          )
                      )
                      df[f"FS {side} {metric} Quality"]=df[status_col].map(
                          lambda s:"DIRECT_PROVIDER_VALUE" if s=="FOOTYSTATS_DIRECT" else (
                              "UNVERIFIED" if s=="TEMPORAL_PROVENANCE_UNVERIFIED" else "UNAVAILABLE"
                          )
                      )
                      df[f"FS {side} {metric} Source Timestamp"]=df[ts_source] if ts_source else "UNAVAILABLE"
                      df[f"FS {side} {metric} Freshness"]=df[status_col].map(
                          lambda s:"VERIFIED_PRE_KICKOFF" if s=="FOOTYSTATS_DIRECT" else (
                              "UNVERIFIED" if s=="TEMPORAL_PROVENANCE_UNVERIFIED" else "UNAVAILABLE"
                          )
                      )
                      df[f"FS {side} {metric} Substitution Flag"]="FALSE"
                      df[f"FS {side} {metric} Missingness Reason"]=df[status_col].map(
                          lambda s:"" if s=="FOOTYSTATS_DIRECT" else (
                              "TEMPORAL_PROVENANCE_UNVERIFIED" if s=="TEMPORAL_PROVENANCE_UNVERIFIED" else "PROVIDER_FIELD_MISSING"
                          )
                      )

              # Summary.
          wb=Workbook(); ws=wb.active; ws.title="Executive Summary"
          rows=[
              ["Project Oracle — Master OMI Report","13–24 Nov 2026"],
              ["Source run","43584388063"],
              ["Source branch","oracle/prospective/public-run-43584388063"],
              ["Production model","Oracle V1.6 — unchanged"],
              ["Governed universe","50-League Universe; FootyStats current populated coverage = 49, 50th provider exception"],
              ["Fixture rows",len(df)],
              ["CONTROLLED",int((df["status"]=="CONTROLLED").sum())],
              ["WATCH",int((df["status"]=="WATCH").sum())],
              ["NO_BET",int((df["status"]=="NO_BET").sum())],
              ["Raw BTTS coverage",int(df["BTTS_raw"].notna().sum())],
              ["Raw Home 1X coverage",int(df["DC_HOME_raw"].notna().sum())],
              ["Raw Away X2 coverage",int(df["DC_AWAY_raw"].notna().sum())],
              ["Calibration","RAW_ONLY_UNVALIDATED"],
              ["Production / betting","FAIL-CLOSED"],
              ["Prospective maturity","HOLD until governed 100-settlement/model gate"],
              ["Visual Intelligence source",vis_source or "No exact-Fixture-ID Visual Intelligence source available in persisted branch"],
              ["Recent form","Derived from database/matches.csv, strictly pre-match; availability varies by team/league"],
              ["H2H","Derived from database/matches.csv, same-league and strictly pre-match; small/zero samples retained"],
          ]
          for r in rows: ws.append(r)

          def write_df(name,data):
              w=wb.create_sheet(name[:31])
              if data is None or data.empty:
                  w.append(["No source data available — not fabricated."]); return w
              for row in [list(map(str,data.columns))]+data.astype(object).where(pd.notna(data),"").values.tolist(): w.append(row)
              return w

          write_df("Fixture Predictions",df)
          write_df("Market Intelligence",df)
          write_df("FootyStats Team Intelligence",fs if 'fs' in locals() else pd.DataFrame())
          write_df("Recent Form",pd.DataFrame(form_rows))
          write_df("H2H",pd.DataFrame(h2h_rows))
          write_df("Team State",st)
          nb=df[df["status"]=="NO_BET"].copy()
          write_df("NO_BET Diagnostics",nb)
          if vis is not None: write_df("Visual Intelligence",vis)
          else: write_df("Visual Intelligence",pd.DataFrame([{"Status":"NOT AVAILABLE IN PERSISTED SOURCE","Reason":"No exact Fixture ID Visual Intelligence dataset was available in the governed evidence branch; no values were inferred."}]))
          raw_vi=None; raw_vi_source=""
          for p in visual_candidates:
              if p.exists() and p.stat().st_size:
                  try:
                      raw_vi=pd.read_csv(p); raw_vi_source=str(p); break
                  except Exception: pass
          if raw_vi is not None: write_df("Visual Intelligence Raw",raw_vi)
          write_df("Team State by Fixture",pd.DataFrame(ts_fixture))
          governance=pd.DataFrame([
              ["Metric","Current governed evidence"],
              ["BTTS OOS observations",10304],["BTTS Brier",0.2462],["BTTS Log Loss",0.6851],["BTTS AUC",0.5307],
              ["M1UP OOS team opportunities",3280],["M1UP Brier",0.2392],["M1UP Log Loss",0.6711],["M1UP AUC",0.6163],
              ["Current prospective fixtures",len(df)],["Current CONTROLLED",int((df["status"]=="CONTROLLED").sum())],["Current WATCH",int((df["status"]=="WATCH").sum())],["Current NO_BET",int((df["status"]=="NO_BET").sum())],
              ["Current raw BTTS coverage",int(df["BTTS_raw"].notna().sum())],["Current raw Home 1X coverage",int(df["DC_HOME_raw"].notna().sum())],["Current raw Away X2 coverage",int(df["DC_AWAY_raw"].notna().sum())],
              ["Production model","Oracle V1.6 unchanged"],["Calibration","RAW_ONLY_UNVALIDATED"],["Betting eligibility","FAIL-CLOSED"],["Prospective maturity","58 settled/model observations vs 100 governed minimum"]
          ],columns=["Metric","Current governed evidence"])
          write_df("Validation & Governance",governance)
          defs=pd.DataFrame([
              ["Field","Definition"],
              ["BTTS_raw","Governed raw BTTS probability; not calibrated/promotion evidence."],
              ["DC_HOME_raw","Governed raw Home 1X probability."],
              ["DC_AWAY_raw","Governed raw Away X2 probability."],
              ["CONTROLLED / WATCH / NO_BET","Current Oracle admission/readiness status; not a guarantee of outcome."],
              ["Recent Form","Last five verified same-league matches strictly before the fixture date where available."],
              ["H2H","Verified same-league prior meetings strictly before fixture date; small samples are retained and explicitly labelled."],
              ["Visual Intelligence","Only exact Fixture ID joins are accepted; missing values are not inferred."],
              ["Attacking / Defensive / TOTAL Index","Only included where an exact governed source field exists; not fabricated from generic statistics."],
              ["Risk / Confidence","Not inferred when no governed persisted artifact exists."],
              ["Production","Oracle remains fail-closed; this workbook is a review artifact, not betting certification."],
          ["FootyStats Team Intelligence","Research/reporting enrichment only. Point-in-time snapshots use FootyStats league-teams max_time at fixture kickoff minus one second. No Oracle V1.6 production logic is changed."],
          ["FootyStats Team Score","League-relative percentile score: overall 45% PPG + 35% GF/M + 20% inverse GA/M; home/away scores use venue-specific PPG/GF/M/GA/M."],
          ["FootyStats PPG","Direct FootyStats pre-match points-per-game field when supplied; never inferred from odds or Oracle probabilities."],
          ["FootyStats PPG Home","Direct FootyStats pre-match home-scope PPG when supplied. Scope, denominator and as-of timestamp must remain tied to the provider snapshot."],
          ["FootyStats PPG Away","Direct FootyStats pre-match away-scope PPG when supplied. Scope, denominator and as-of timestamp must remain tied to the provider snapshot."],
          ["PPG Status / Provenance / Quality","Each PPG field carries explicit provider/status/provenance/quality metadata. Missing provider fields remain UNAVAILABLE/PROVIDER_FIELD_MISSING."],
          ["FootyStats Goal Environment Score","League-relative research score: 50% average total goals/match + 25% GF/M + 25% GA/M. It is not a production probability."]
          ],columns=["Field","Definition"])
          write_df("Definitions",defs)

          # Styling.
          for w in wb.worksheets:
              w.freeze_panes="A2"; w.auto_filter.ref=w.dimensions
              for cell in w[1]:
                  cell.font=Font(bold=True,color="FFFFFF"); cell.fill=PatternFill("solid",fgColor="1F4E78")
                  cell.alignment=Alignment(horizontal="center",vertical="center",wrap_text=True)
              for row in w.iter_rows():
                  for c in row[0:]:
                      c.alignment=Alignment(vertical="top",wrap_text=True)
              for col in range(1,w.max_column+1):
                  vals=[len(str(w.cell(r,col).value or "")) for r in range(1,min(w.max_row,80)+1)]
                  w.column_dimensions[get_column_letter(col)].width=min(max(max(vals or [10])+2,10),45)
              w.row_dimensions[1].height=32
          wb.save(out)
          print(out, out.stat().st_size)
          PY

      - name: Enforce Master OMI evidence completeness contract
        working-directory: oracle
        run: |
          python - <<'PY'
          import openpyxl, json, pathlib
          p=pathlib.Path("Master_OMI_Report_13-24_Nov_2026.xlsx")
          if not p.exists(): raise SystemExit("Master OMI workbook was not generated")
          wb=openpyxl.load_workbook(p, read_only=True, data_only=False)
          ws=wb["Fixture Predictions"] if "Fixture Predictions" in wb.sheetnames else None
          if ws is None: raise SystemExit("Fixture Predictions sheet missing")
          headers=[c.value for c in next(ws.iter_rows(min_row=1,max_row=1))]
          if "Fixture ID" not in headers: raise SystemExit("Fixture ID column missing")
          rows=list(ws.iter_rows(min_row=2, values_only=True)); n=len(rows)
          if n==0: raise SystemExit("Master OMI contains zero fixture rows")
          i=headers.index("Fixture ID")
          blank=sum(1 for r in rows if r[i] in (None,""))
          if blank: raise SystemExit(f"Blank Fixture ID rows: {blank}")
          report={"fixture_rows":n,"blank_fixture_ids":blank,"status":"PASS","production_model":"Oracle V1.6 unchanged","contract":"Every fixture must have an explicit identity; evidence may be unavailable but must never be fabricated."}
          pathlib.Path("master_omi_completeness_audit.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY

      - name: Validate Market Intelligence FootyStats PPG evidence
        working-directory: oracle
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("Master_OMI_Report_13-24_Nov_2026.xlsx")
          if not p.exists():
              raise SystemExit("FAIL: Master OMI workbook missing")
          mi=pd.read_excel(p,sheet_name="Market Intelligence")
          required=[
              "FS Home PPG","FS Home PPG Home","FS Home PPG Away",
              "FS Away PPG","FS Away PPG Home","FS Away PPG Away",
          ]
          missing=[c for c in required if c not in mi.columns]
          if missing:
              raise SystemExit("FAIL: missing PPG columns: "+", ".join(missing))
          ids=mi["Fixture ID"].astype(str).str.strip()
          if ids.eq("").any() or ids.isna().any() or ids.duplicated().any():
              raise SystemExit("FAIL: missing/duplicate Fixture IDs in Market Intelligence")
          for side in ("Home","Away"):
              for metric in ("PPG","PPG Home","PPG Away"):
                  v=f"FS {side} {metric}"
                  st=f"{v} Status"
                  if any(c not in mi.columns for c in (st,f"{v} Source",f"{v} Provenance",f"{v} Quality")):
                      raise SystemExit(f"FAIL: missing evidence metadata for {v}")
                  raw=mi[v]
                  status_series=mi[st].astype(str).str.strip()
                  # Treat blank/NaN provider cells as unavailable evidence, never as direct values.
                  missing_value=raw.isna() | raw.astype(str).str.strip().isin(["","nan","None","NaN","UNAVAILABLE"])
                  direct=(~missing_value)
                  if (direct & ~status_series.eq("FOOTYSTATS_DIRECT")).any():
                      raise SystemExit(f"FAIL: non-direct {v} values detected")
                  if (missing_value & ~status_series.eq("PROVIDER_FIELD_MISSING")).any():
                      raise SystemExit(f"FAIL: missing {v} rows lack PROVIDER_FIELD_MISSING status")
                  if ((status_series.eq("FOOTYSTATS_DIRECT")) & missing_value).any():
                      raise SystemExit(f"FAIL: {v} marked FOOTYSTATS_DIRECT but provider value is blank/unavailable")
                  src=mi[f"{v} Source"].astype(str).str.strip()
                  prov=mi[f"{v} Provenance"].astype(str).str.strip()
                  qual=mi[f"{v} Quality"].astype(str).str.strip()
                  if (direct & ~src.eq("FootyStats")).any():
                      raise SystemExit(f"FAIL: direct {v} values have non-FootyStats source")
                  if (direct & ~prov.eq("PREMATCH_PROVIDER_FIELD")).any():
                      raise SystemExit(f"FAIL: direct {v} values lack PREMATCH_PROVIDER_FIELD provenance")
                  if (direct & ~qual.eq("DIRECT_PROVIDER_VALUE")).any():
                      raise SystemExit(f"FAIL: direct {v} values lack DIRECT_PROVIDER_VALUE quality")
          # Point-in-time control: a direct FootyStats PPG value is only validated when
          # its provider timestamp is explicitly present and strictly earlier than kickoff.
          # Missing timestamps remain provider data but are not promoted as validated evidence.
          for side in ("Home","Away"):
              for metric in ("PPG","PPG Home","PPG Away"):
                  v=f"FS {side} {metric}"
                  st=f"{v} Status"
                  tscol=f"{v} Source Timestamp"
                  if tscol not in mi.columns:
                      raise SystemExit(f"FAIL: missing chronology field for {v}")
                  direct=mi[st].astype(str).str.strip().eq("FOOTYSTATS_DIRECT")
                  if direct.any():
                      if "date" not in mi.columns:
                          raise SystemExit("FAIL: fixture date missing; cannot establish pre-match chronology")
                      kickoff_col=next((c for c in ["kickoff_time","Kickoff Time","kickoff","Kickoff"] if c in mi.columns), None)
                      if kickoff_col is None:
                          raise SystemExit("FAIL: kickoff timestamp missing; cannot establish pre-match chronology")
                      k=pd.to_datetime(mi["date"].astype(str).str[:10] + " " + mi[kickoff_col].astype(str), errors="coerce", utc=True)
                      ts=mi[tscol]
                      tnum=pd.to_numeric(ts, errors="coerce")
                      parsed=pd.to_datetime(ts, errors="coerce", utc=True)
                      parsed=parsed.where(tnum.isna(), pd.to_datetime(tnum, unit="s", errors="coerce", utc=True))
                      invalid=direct & (k.isna() | parsed.isna() | ~(parsed < k))
                      if invalid.any():
                          raise SystemExit(f"FAIL: {invalid.sum()} direct {v} values lack verified strictly-pre-match chronology")
          print("PASS: exact Fixture ID, direct FootyStats PPG fields, provenance metadata and strict pre-match chronology validated.")
          PY

