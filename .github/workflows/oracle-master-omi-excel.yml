name: Oracle Master OMI Excel Export
# Permanent variable-row / 264-column materialisation contract active.
# Continuous Master OMI maintenance heartbeat: rerun governed source reconciliation.

on:
  push:
    paths:
      - ".github/workflows/oracle-master-omi-excel.yml"
      - "data/fixtures/governed_50league_current.csv"
      - "research/four_model/outputs/omi_prediction_ledger_current.csv"
      - "database/current_prematch_team_state.csv"
      - "database/current_matches.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public repository as the only governed source
        uses: actions/checkout@v4
        with:
          path: oracle

      - name: Enforce rolling current-spine freshness
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          m=Path("data/fixtures/governed_50league_current_manifest.json")
          if not m.exists() or m.stat().st_size == 0:
              raise SystemExit("MASTER_OMI_BLOCKED_CURRENT_SPINE_MANIFEST_MISSING")
          d=json.loads(m.read_text(encoding="utf-8"))
          ts=d.get("generated_utc")
          if not ts:
              raise SystemExit("MASTER_OMI_BLOCKED_CURRENT_SPINE_GENERATION_TIMESTAMP_MISSING")
          generated=datetime.fromisoformat(ts.replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-generated).total_seconds()
          if age < 0 or age > 90*60:
              raise SystemExit(f"MASTER_OMI_BLOCKED_STALE_CURRENT_SPINE age_seconds={age:.0f}")
          rows=int(d.get("fixture_rows",0))
          unique=int(d.get("unique_provider_fixture_ids",0))
          if rows <= 0 or rows != unique:
              raise SystemExit("MASTER_OMI_BLOCKED_CURRENT_SPINE_IDENTITY_INVALID")
          if d.get("private_repository_used") is not False or d.get("fuzzy_matching_used") is not False or d.get("historical_fallback_used") is not False:
              raise SystemExit("MASTER_OMI_BLOCKED_CURRENT_SPINE_GOVERNANCE_FLAGS_INVALID")
          print({"status":"PASS","generated_utc":ts,"age_seconds":round(age),"rows":rows,"unique_provider_fixture_ids":unique})
          PY

      - name: Enforce public-only source contract
        working-directory: oracle
        run: |
          set -euo pipefail
          required=(
            research/four_model/outputs/omi_prediction_ledger_current.csv
            data/fixtures/governed_50league_current.csv
            database/current_prematch_team_state.csv
            database/current_matches.csv
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::PUBLIC_SOURCE_ARTIFACT_MISSING=$f"
              missing=1
            fi
          done
          if compgen -G 'research/four_model/outputs/omi_prediction_ledger_*_to_*.csv' >/dev/null; then
            echo "::error::DATED_FROZEN_OMI_LEDGER_DETECTED"
            missing=1
          fi
          if compgen -G 'data/fixtures/omi_locked_spine_*_to_*.csv' >/dev/null; then
            echo "::error::DATED_FROZEN_OMI_SPINE_DETECTED"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::MASTER_OMI_BLOCKED_NO_PUBLIC_SOURCE_DATA"
            exit 1
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact matching regression gate
        working-directory: oracle
        run: python -m unittest tests/test_master_omi_exact_matching_contract.py

      - name: Validate active Master OMI schema contract
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/master_omi/CANONICAL_V2_1_1_CONTRACT.json")
          s=Path("docs/master_omi/CANONICAL_V2_1_1_SCHEMA.json")
          if not p.exists() or not s.exists(): raise SystemExit("MASTER_OMI_BLOCKED_SCHEMA_CONTRACT_MISSING")
          d=json.loads(p.read_text(encoding="utf-8")); schema=json.loads(s.read_text(encoding="utf-8"))
          if d.get("market_intelligence_columns")!=264 or d.get("immutable_columns")!="A:ET" or d.get("immutable_column_count")!=150:
              raise SystemExit("MASTER_OMI_BLOCKED_SCHEMA_CONTRACT_INVALID")
          if d.get("market_intelligence_rows")!="VARIABLE_CURRENT_ROLLING_SPINE" or d.get("governed_fixture_rows")!="EXACT_CURRENT_FIXTURE_ID_SET":
              raise SystemExit("MASTER_OMI_BLOCKED_FIXED_ROW_CONTRACT_DETECTED")
          if schema.get("market_intelligence_columns")!=264 or schema.get("variable_fixture_rows") is not True:
              raise SystemExit("MASTER_OMI_BLOCKED_VARIABLE_ROW_SCHEMA_INVALID")
          if len(schema.get("headers",[]))!=264: raise SystemExit("MASTER_OMI_BLOCKED_HEADER_SCHEMA_WIDTH")
          print({"status":"PASS","columns":264,"immutable":"A:ET","row_contract":"VARIABLE_CURRENT_ROLLING_SPINE"})
          PY

      - name: Install Excel dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl

      - name: Require authoritative canonical workbook base
        working-directory: oracle
        run: |
          set -euo pipefail
          CANONICAL="runtime/canonical/Oracle_Master_OMI_CANONICAL_v2_Last3PPG_LTSS_V1_H2H_FootyStats_LOCKED.xlsx"
          EXPECTED_SHA="9a02da12dd61b8cd588278c99d7ed544f8bf1a09cc3218aad2629ccbe39f106e"
          if [ ! -s "$CANONICAL" ]; then
            echo "::error::MASTER_OMI_BLOCKED_CANONICAL_BINARY_NOT_AVAILABLE_TO_AUTOMATION"
            echo "::error::No workbook may be synthesized or rebuilt from CSV inputs."
            echo "::error::A:ET must inherit from the locked canonical binary."
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$CANONICAL" | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::MASTER_OMI_BLOCKED_CANONICAL_SHA_MISMATCH expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
            exit 1
          fi
          mkdir -p runtime/work
          cp "$CANONICAL" runtime/work/Master_OMI_Report_BASE.xlsx
          echo "::notice::Canonical workbook base accepted; downstream exporter must overlay without modifying A:ET."
          echo "canonical_sha256=$ACTUAL_SHA"
          echo "canonical_base=runtime/work/Master_OMI_Report_BASE.xlsx"

      - name: Upload Master OMI Excel
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Master-OMI-Current
          path: oracle/Master_OMI_Report_CURRENT.xlsx
          retention-days: 30
