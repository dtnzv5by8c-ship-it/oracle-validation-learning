name: FootyStats Selected-50 Transport Compatibility Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/footystats-selected50-transport-compatibility-probe.yml"

permissions:
  contents: read

concurrency:
  group: footystats-selected50-transport-compatibility-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}

    steps:
      - name: Checkout governed Oracle branch
        uses: actions/checkout@v4
        with:
          ref: research/oracle-50-league-readiness-audit
          fetch-depth: 1

      - name: Validate secret and resolve a real manifest season
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FOOTYSTATS_API_KEY:-}" ]] || {
            echo "::error::FOOTYSTATS_API_KEY secret is missing; zero provider requests made."
            exit 1
          }

          manifest="data/footystats/selected50-full-ingestion-manifest.csv"
          [[ -s "$manifest" ]] || {
            echo "::error::Selected-50 ingestion manifest is missing; zero provider requests made."
            exit 1
          }

          season_id="$(awk -F, 'NR>1 && $1 ~ /^FS:[0-9]+:league-matches:p1$/ {print $7; exit}' "$manifest")"
          [[ "$season_id" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not resolve a valid provider season_id from the governed manifest."
            exit 1
          }

          echo "Resolved governed probe season_id=$season_id"
          echo "TEST_SEASON_ID=$season_id" >> "$GITHUB_ENV"

      - name: Probe FootyStats with HTTP/1.1 and Expect suppression
        shell: bash
        run: |
          set -u
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          body="$tmpdir/body.json"
          status="$tmpdir/status.txt"
          err="$tmpdir/curl.stderr"

          set +e
          curl --silent --show-error --location --http1.1             --connect-timeout 15             --max-time 45             --retry 0             -H "Accept: application/json"             -H "User-Agent: Project-Oracle-Selected50-Transport-Probe/1.1"             -H "Expect:"             -G "https://api.football-data-api.com/league-matches"             --data-urlencode "key=${FOOTYSTATS_API_KEY}"             --data-urlencode "season_id=${TEST_SEASON_ID}"             --data-urlencode "page=1"             --data-urlencode "max_per_page=1000"             -o "$body"             -w "%{http_code}|%{http_version}|%{time_total}"             > "$status" 2> "$err"
          curl_rc=$?
          set -e

          # Never expose the API key. Only report the transport class and status.
          if [[ "$curl_rc" -ne 0 ]]; then
            err_class="$(sed -E 's/[?&]key=[^&[:space:]]+/***REDACTED***/g' "$err" | head -c 500)"
            echo "::error::curl transport failed rc=$curl_rc; detail=$err_class"
            [[ -s "$status" ]] && echo "curl_status=$(cat "$status")"
            exit 1
          fi

          IFS='|' read -r http_status http_version total_time < "$status"

          python3 - "$body" "$http_status" "$http_version" "$total_time" "$TEST_SEASON_ID" <<'PY'
          import json,sys
          body_path,status,http_version,total_time,season_id=sys.argv[1:]

          try:
              payload=json.load(open(body_path,encoding="utf-8"))
          except Exception:
              raw=open(body_path,encoding="utf-8",errors="replace").read(500)
              raise SystemExit(
                  f"BLOCK: provider returned non-JSON response; "
                  f"http_status={status}; http_version={http_version}; "
                  f"body_prefix={raw!r}"
              )

          if status != "200":
              detail=""
              if isinstance(payload,dict):
                  detail=payload.get("message") or payload.get("error") or ""
              raise SystemExit(
                  f"BLOCK: FootyStats returned HTTP {status}; "
                  f"http_version={http_version}; provider_detail={str(detail)[:300]}"
              )

          if not isinstance(payload,dict) or payload.get("success") is not True:
              detail=payload.get("message") if isinstance(payload,dict) else ""
              raise SystemExit(
                  f"BLOCK: FootyStats HTTP 200 but success=true was not established; "
                  f"provider_detail={str(detail)[:300]}"
              )

          data=payload.get("data")
          pager=payload.get("pager")
          count=len(data) if isinstance(data,list) else (1 if isinstance(data,dict) else 0)

          print(json.dumps({
              "status":"PASS",
              "endpoint":"league-matches",
              "season_id":season_id,
              "http_status":int(status),
              "http_version":http_version,
              "response_total_seconds":float(total_time),
              "success":True,
              "returned_rows":count,
              "pager_present":isinstance(pager,dict),
              "raw_provider_payload_persisted":False,
              "production_eligible":False,
              "betting_eligible":False,
              "expect_header_suppressed":True
          }, indent=2))
          PY
