name: Oracle Feature Provenance Gate Tests (Research Only)

on:
  push:
    branches:
      - research/oracle-crosswalk-isolation-2026-10-22
    paths:
      - "scripts/validate_oracle_feature_provenance.py"
      - "tests/test_oracle_feature_provenance.py"
      - ".github/workflows/oracle-feature-provenance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run feature provenance regression tests
        run: python -m unittest tests/test_oracle_feature_provenance.py -v
