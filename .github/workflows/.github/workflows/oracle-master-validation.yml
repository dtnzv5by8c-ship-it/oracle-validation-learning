name: Oracle Master Validation Engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-master-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Clone governed private Oracle branch
        env:
          ORACLE_READ_TOKEN: ${{ secrets.ORACLE_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ORACLE_READ_TOKEN}" ]; then
            echo "ORACLE_READ_TOKEN is not available."
            exit 1
          fi

          git clone \
            --depth 1 \
            --branch fix/epl-btts-team-state-aliases \
            "https://x-access-token:${ORACLE_READ_TOKEN}@github.com/dtnzv5by8c-ship-it/oracle-football-data.git" \
            oracle

      - name: Install Oracle research dependencies
        working-directory: oracle
        run: |
          python -m pip install --disable-pip-version-check \
            pandas \
            numpy \
            scipy \
            scikit-learn

      - name: Verify historical governance
        working-directory: oracle
        run: |
          set -euo pipefail

          echo "=== GOVERNANCE TESTS ==="
          python -m unittest discover -s tests -p "test_*.py"

          echo "=== CANONICAL DATASET GATE ==="
          python scripts/canonical_dataset_gate.py --check

          echo "=== POINT-IN-TIME AUDIT ==="
          python scripts/audit_historical_point_in_time.py

      - name: Run four-market chronological OOS validation
        working-directory: oracle
        run: |
          set -euo pipefail

          echo "=== BASELINE OOS ==="
          python research/four_model/run_baseline_oos.py

          echo "=== CHALLENGER R1 OOS ==="
          python research/four_model/run_challenger_oos.py

          echo "=== R1 CALIBRATION ==="
          python research/four_model/calibrate_challenger_oos.py

          echo "=== R1 VS BASELINE ==="
          python research/four_model/compare_challenger_baseline.py

          echo "=== FEATURE ABLATION ==="
          python research/four_model/run_feature_ablation.py

          echo "=== CHALLENGER R2 OOS ==="
          python research/four_model/run_challenger_r2_oos.py

          echo "=== R2 CALIBRATION ==="
          python research/four_model/calibrate_r2_oos.py

          echo "=== BASELINE VS R1 VS R2 ==="
          python research/four_model/compare_baseline_r1_r2.py

          echo "=== CHRONOLOGICAL OOS CALIBRATION ==="
          python research/four_model/calibrate_oos.py

          echo "=== PROMOTION GATE ==="
          python research/four_model/compare_and_gate.py

      - name: Run all-market chronological learning
        working-directory: oracle
        run: |
          set -euo pipefail

          echo "=== ALL-MARKET WALK-FORWARD ==="
          python scripts/oracle_all_markets_walk_forward_v1.py

          echo "=== MARKET LEARNING LOOP ==="
          python scripts/oracle_market_learning_loop_v1.py

      - name: Run governed BTTS historical cohort gate
        working-directory: oracle
        run: |
          set -euo pipefail

          echo "=== BTTS COHORT GATE ==="
          python scripts/oracle_btts_cohort_gate_v1.py

      - name: Build sanitized Oracle validation summary
        working-directory: oracle
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          root = Path(".")
          research = root / "research"
          all_markets = research / "all_markets"
          four_model = research / "four_model" / "outputs"

          summary = {
              "artifact": "ORACLE-MASTER-VALIDATION",
              "status": "COMPLETE",
              "source_repository": "dtnzv5by8c-ship-it/oracle-football-data",
              "source_branch": "fix/epl-btts-team-state-aliases",
              "production_promotion": "NOT_AUTOMATIC",
              "historical_data_modified": False,
              "private_match_data_published": False,
          }

          # Four-model evidence
          gate_files = list(four_model.glob("*gate*.json"))
          comparison_files = list(four_model.glob("*comparison*.json"))

          summary["four_model"] = {
              "gate_files_found": [p.name for p in gate_files],
              "comparison_files_found": [p.name for p in comparison_files],
          }

          # Market learning evidence
          learning = all_markets / "oracle_market_learning_validation.csv"

          if learning.exists():
              df = pd.read_csv(learning)

              summary["market_learning"] = {
                  "markets_evaluated": int(len(df)),
                  "candidate_promotion_count": int(
                      (
                          df.get(
                              "status",
                              pd.Series(dtype=str)
                          ) == "CANDIDATE_PROMOTION"
                      ).sum()
                  ),
              }

          # BTTS cohort evidence
          btts_manifest = (
              all_markets /
              "oracle_btts_cohort_manifest.json"
          )

          if btts_manifest.exists():
              manifest = json.loads(
                  btts_manifest.read_text()
              )

              summary["btts_cohort"] = {
                  "status": manifest.get("status"),
                  "selected_method": manifest.get(
                      "selected_method"
                  ),
                  "discovery_window": manifest.get(
                      "discovery_window"
                  ),
                  "final_oos_window": manifest.get(
                      "final_oos_window"
                  ),
              }

          # Learning ledger
          ledger = (
              all_markets /
              "oracle_btts_learning_ledger.csv"
          )

          if ledger.exists():
              df = pd.read_csv(ledger)

              summary["btts_learning_ledger"] = {
                  "rows": int(len(df)),
                  "hit_rows": int(
                      (
                          df.get(
                              "hit_miss",
                              pd.Series(dtype=float)
                          ) == 1
                      ).sum()
                  ),
              }

          output = Path(
              "/tmp/oracle_master_validation_summary.json"
          )

          output.write_text(
              json.dumps(
                  summary,
                  indent=2
              ) + "\n"
          )

          print(
              json.dumps(
                  summary,
                  indent=2
              )
          )
          PY

      - name: Upload sanitized validation summary
        uses: actions/upload-artifact@v4
        with:
          name: oracle-master-validation-summary
          path: /tmp/oracle_master_validation_summary.json
          retention-days: 14