name: Oracle Public Prospective Completion Cycle
# Serialized recovery cycle: prospective inference now consumes the governed current-state compatibility view.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oracle-public-prospective-completion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-serialized-evidence-writer
  cancel-in-progress: false

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
      TARGET_REPO: dtnzv5by8c-ship-it/oracle-football-data
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test -n "${FOOTYSTATS_API_KEY:-}"

      - name: Clone latest private production main
        run: |
          set -euo pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" clone --depth 1 --branch main "https://github.com/${TARGET_REPO}.git" oracle
          git -C oracle remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing production dependencies
        working-directory: oracle
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn requests

      - name: Verify durable current Team State on main
        working-directory: oracle
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          test -s data/current_team_state_manifest.json
          python - <<'PY'
          import json, csv, hashlib
          from pathlib import Path
          p=Path("database/current_prematch_team_state.csv")
          m=json.loads(Path("data/current_team_state_manifest.json").read_text())
          with p.open(newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          n=len(rows)
          expected=int(m["rows"])
          if n != expected or n <= 0: raise SystemExit(f"TEAM_STATE_ROW_PARITY_FAIL csv={n} manifest={expected}")
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          if m.get("sha256") and sha != m["sha256"]: raise SystemExit("TEAM_STATE_SHA256_FAIL")
          print(f"DURABLE_CURRENT_TEAM_STATE_PASS rows={n} sha256={sha} bytes={p.stat().st_size}")
          PY

      - name: Preserve locked historical artifacts
        working-directory: oracle
        run: |
          set -euo pipefail
          EXPECTED_STATE_SHA="1932edf73e29d2df1400bf25e9ec763f6d7ce272fc003b48f0d115b295432e78"
          EXPECTED_MATCHES_SHA="1836e220bcad535ab6d8e5885cffaf4b7c81593a4df97a0f410de3d17d07d2bc"
          SOURCE_COMMIT="67742886553ef2d79fe7b3bf3ddd78c201a16f35"
          if [ ! -s database/prematch_team_state.csv ] || [ "$(sha256sum database/prematch_team_state.csv | awk '{print $1}')" != "$EXPECTED_STATE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
            git show "$SOURCE_COMMIT:database/prematch_team_state.csv" > database/prematch_team_state.csv
          fi
          if [ ! -s database/matches.csv ] || [ "$(sha256sum database/matches.csv | awk '{print $1}')" != "$EXPECTED_MATCHES_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
            git show "$SOURCE_COMMIT:database/matches.csv" > database/matches.csv
          fi
          test -s database/prematch_team_state.csv
          test "$(sha256sum database/prematch_team_state.csv | awk '{print $1}')" = "$EXPECTED_STATE_SHA"
          test -s database/matches.csv
          test "$(sha256sum database/matches.csv | awk '{print $1}')" = "$EXPECTED_MATCHES_SHA"
          mkdir -p .oracle_protected_before
          cp database/prematch_team_state.csv .oracle_protected_before/prematch_team_state.csv
          cp database/matches.csv .oracle_protected_before/matches.csv

      - name: Refresh governed upcoming fixtures
        working-directory: oracle
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: python scripts/ingest_upcoming_fixtures.py 14 data/fixtures/oracle_upcoming_fixtures.csv

      - name: Rebuild prediction compatibility view from durable current Team State
        working-directory: oracle
        run: |
          set -euo pipefail
          test -s database/current_prematch_team_state.csv
          test -s data/current_team_state_manifest.json
          python scripts/build_prediction_team_state_compatibility.py

      - name: Run existing governed four-model prediction batch
        working-directory: oracle
        run: python scripts/oracle_four_model_predict.py data/fixtures/omi_locked_spine_2026-11-13_to_2026-11-24.csv research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv

      - name: Diagnose prospective prediction status distribution
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv("research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv")
          print("PREDICTION_ROWS=",len(p))
          print("STATUS_COUNTS=",p.get("status",pd.Series(dtype=str)).value_counts(dropna=False).to_dict())
          if "risk" in p:
              print("RISK_COUNTS=",p["risk"].value_counts(dropna=False).head(30).to_dict())
          print("SAMPLE=",p.head(12).to_dict("records"))
          PY

      - name: Materialize Team-State admission diagnostics
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd, json, unicodedata, re
          from difflib import SequenceMatcher
          p=pd.read_csv("research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv")
          s=pd.read_csv("database/prematch_team_state.csv")
          no=p[p["status"].eq("NO_BET")].copy()
          def norm(x):
              x=unicodedata.normalize("NFKD",str(x)).encode("ascii","ignore").decode().lower()
              return re.sub(r"[^a-z0-9]","",x)
          out=[]
          for _,r in no.iterrows():
              for side in ["home","away"]:
                  team=r[f"{side}_team"]; league=r["league_code"]
                  names=s.loc[s["league_code"].eq(league),f"{side}_team"].dropna().unique().tolist()
                  scores=sorted([(SequenceMatcher(None,norm(team),norm(x)).ratio(),x) for x in names],reverse=True)[:5]
                  out.append({"date":r["date"],"league_code":league,"home_team":r["home_team"],"away_team":r["away_team"],"side":side,"team":team,"risk":r.get("risk",""),"top_candidates":scores})
          pd.DataFrame(out).to_json("research/four_model/outputs/prospective_team_state_admission_diagnostic.json",orient="records",indent=2)
          print("NO_BET_ROWS",len(no))
          print("DIAGNOSTIC_ROWS",len(out))
          print(pd.DataFrame(out).to_string(index=False))
          PY

      - name: Diagnose NO_BET team-state resolution
        working-directory: oracle
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          import oracle_four_model_predict as m
          p=pd.read_csv('research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv')
          nb=p[p['status'].eq('NO_BET')].copy()
          print('NO_BET_ROWS=',len(nb))
          for r in nb.itertuples(index=False):
              hk=m.resolve_current_state(r.league_code,r.home_team)
              ak=m.resolve_current_state(r.league_code,r.away_team)
              h=m.current_state_asof(r.league_code,hk,pd.Timestamp(r.date)) if hk else None
              a=m.current_state_asof(r.league_code,ak,pd.Timestamp(r.date)) if ak else None
              print({'date':r.date,'league':r.league_code,'home':r.home_team,'away':r.away_team,'home_key':hk,'away_key':ak,'home_n':None if h is None else h.get('n'),'away_n':None if a is None else a.get('n')})
          PY

      - name: Prepare immutable prospective publication batch
        working-directory: oracle
        run: |
          set -euo pipefail
          python scripts/prepare_prospective_four_market_publication.py --predictions research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv --fixtures data/fixtures/omi_locked_spine_2026-11-13_to_2026-11-24.csv --output research/four_model/outputs/prospective_publication_batch.csv

      - name: Publish through existing immutable gateway
        id: publish
        continue-on-error: true
        working-directory: oracle
        run: |
          set -o pipefail
          set +e
          batch="research/four_model/outputs/prospective_publication_batch.csv"
          if [ ! -s "${batch}" ] || [ "$(tail -n +2 "${batch}" | wc -l | tr -d ' ')" = "0" ]; then
            echo "NO_OP: no new canonical prediction rows require publication"
            echo "PUBLICATION_RC=0" > publication_gateway_status.txt
            printf '%s\n' "NO_OP: no new canonical prediction rows require publication" > publication_gateway.log
            exit 0
          fi
          python scripts/publish_prediction_run.py "${batch}" 2>&1 | tee /tmp/publication_gateway.log
          rc=${PIPESTATUS[0]}
          cp /tmp/publication_gateway.log publication_gateway.log
          echo "PUBLICATION_RC=${rc}" > publication_gateway_status.txt
          exit "${rc}"

      - name: Upload publication gateway diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-public-publication-diagnostic-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            oracle/publication_gateway.log
            oracle/publication_gateway_status.txt

      - name: Enforce publication gateway result
        if: always()
        working-directory: oracle
        run: |
          set -euo pipefail
          rc="$(awk -F= '/^PUBLICATION_RC=/{print $2}' publication_gateway_status.txt | tail -1)"
          test "${rc}" = "0"

      - name: Restore protected historical artifacts
        working-directory: oracle
        run: |
          set -euo pipefail
          cp .oracle_protected_before/prematch_team_state.csv database/prematch_team_state.csv
          cp .oracle_protected_before/matches.csv database/matches.csv
          test "$(sha256sum database/prematch_team_state.csv | awk '{print $1}')" = "1932edf73e29d2df1400bf25e9ec763f6d7ce272fc003b48f0d115b295432e78"
          test "$(sha256sum database/matches.csv | awk '{print $1}')" = "1836e220bcad535ab6d8e5885cffaf4b7c81593a4df97a0f410de3d17d07d2bc"

      - name: Run canonical chronology and governance gates
        working-directory: oracle
        run: |
          set -euo pipefail
          if [ -s archive/PREDICTION_LEDGER.csv ] && [ "$(wc -l < archive/PREDICTION_LEDGER.csv)" -gt 1 ]; then
            python scripts/validate_prediction_run.py archive/PREDICTION_LEDGER.csv
          fi
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/run_prospective_shadow_gate.py
          python scripts/run_oracle_production_readiness_gate.py

      - name: Persist evidence only, never staging-owned current state
        working-directory: oracle
        run: |
          set -euo pipefail
          git restore -- database/current_matches.csv database/current_goal_events.csv database/current_prematch_team_state.csv data/current_source_manifest.json data/current_team_state_manifest.json
          git config user.name "oracle-public-prospective-bot"
          git config user.email "oracle-public-prospective-bot@users.noreply.github.com"
          files=(
            archive/PREDICTION_LEDGER.csv archive/SETTLEMENT_LEDGER.csv archive/PROBABILITY_ERROR_LEDGER.csv archive/LEARNING_LEDGER.csv
            archive/TEAM_BEHAVIOUR_LEDGER.csv archive/RUN_REGISTRY.csv archive/FEATURE_SNAPSHOT_MANIFEST.csv archive/FEATURE_SNAPSHOT_VALUES.csv
            research/four_model/outputs/omi_prediction_ledger_2026-11-13_to_2026-11-24.csv
            research/four_model/outputs/prospective_publication_batch.csv
            research/four_model/outputs/prospective_publication_batch.csv.manifest.json
            research/four_model/outputs/prospective_shadow_gate_manifest.json
            research/four_model/outputs/oracle_production_readiness_gate.json
          )
          for f in "${files[@]}"; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "No evidence changes"; exit 0; fi
          git commit -m "Record governed prospective OMI evidence from public runner"
          # Generated staging/current inputs are deliberately not evidence. Restore any
          # remaining unstaged tracked files before rebasing the evidence commit.
          git diff --name-only -z | xargs -0 -r git restore --
          git fetch --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main

