name: Disabled - Oracle League Acquisition Tracker Private Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse protected-repository tracker transfer
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This tracker workflow is disabled for the research-only build because its previous implementation uploaded a release to a protected repository. No credentials, private archive, provider API, or remote write may be used here."
          exit 1
