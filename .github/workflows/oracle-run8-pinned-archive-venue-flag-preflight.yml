name: Oracle Run 8 Pinned Archive Venue Flag Preflight (Research Only)

on:
  push:
    branches:
      - research/oracle-50-league-readiness-audit
    paths:
      - ".github/workflows/oracle-run8-pinned-archive-venue-flag-preflight.yml"
      - "scripts/audit_run8_pinned_archive_venue_flag_coverage.py"
      - "tests/test_run8_pinned_archive_venue_flag_coverage.py"

permissions:
  contents: read

jobs:
  venue-flag-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tri-state parser contract tests
        run: python -m unittest discover -s tests -p "test_run8_pinned_archive_venue_flag_coverage.py" -v

      - name: Download and verify exact pinned Run 8 archive (read only)
        env:
          GH_TOKEN: ${{ secrets.ORACLE_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::ORACLE_PRIVATE_REPO_TOKEN is missing."; exit 1; }
          TAG="research-selected50-footystats-history-20261025"
          EXPECTED_SHA256="bc64fbad2f827dac983ae8ef1de5055be34209693b7b8057f4c00508059e7261"
          mkdir -p private-download
          gh release download "$TAG" \
            --repo dtnzv5by8c-ship-it/oracle-football-data \
            --pattern "oracle-selected50-footstats-private-ingestion.zip" \
            --pattern "private-package.sha256" \
            --dir private-download
          DECLARED_SHA256="$(awk 'NR==1 {print $1}' private-download/private-package.sha256)"
          [[ "$DECLARED_SHA256" == "$EXPECTED_SHA256" ]] || { echo "::error::Release checksum file does not match the pinned digest."; exit 1; }
          ACTUAL_SHA256="$(sha256sum private-download/oracle-selected50-footystats-private-ingestion.zip | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]] || { echo "::error::Pinned Run 8 archive SHA-256 mismatch."; exit 1; }
          printf '%s\n' "$ACTUAL_SHA256" > private-download/archive.sha256

      - name: Audit raw venue flag coverage without exporting provider rows
        run: |
          set -euo pipefail
          python scripts/audit_run8_pinned_archive_venue_flag_coverage.py \
            --archive private-download/oracle-selected50-footystats-private-ingestion.zip \
            --selected-manifest data/oracle-footystats-selected-50-season-id-manifest.csv \
            --out research-output \
            --primary-start 2025-03-20 \
            --primary-end 2026-09-20

      - name: Upload aggregate-only research audit
        uses: actions/upload-artifact@v4
        with:
          name: oracle-run8-pinned-archive-venue-flag-preflight
          path: |
            research-output/summary.json
            research-output/group_coverage.csv
            research-output/season_coverage.csv
            research-output/archive_sha256.txt
          if-no-files-found: error
          retention-days: 3
