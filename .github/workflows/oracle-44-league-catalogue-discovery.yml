name: Oracle 44-League Research Catalogue Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - "research/**"
    paths:
      - "scripts/oracle_44_catalogue_discovery.py"
      - ".github/workflows/oracle-44-league-catalogue-discovery.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: oracle-44-league-catalogue-discovery
  cancel-in-progress: false

jobs:
  discover-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Verify API secret exists without exposing it
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FOOTYSTATS_API_KEY:-}" ]] || { echo "::error::FOOTYSTATS_API_KEY missing."; exit 1; }
          echo "FootyStats API secret present; value withheld."

      - name: Discover broad provider catalogue and candidate season metadata
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: python scripts/oracle_44_catalogue_discovery.py

      - name: Upload sanitized catalogue crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: oracle-44-league-broader-catalogue-discovery
          path: oracle-catalogue-discovery/*
          if-no-files-found: error
          retention-days: 30
